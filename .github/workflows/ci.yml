name: CI

on:
  push:
    branches: [main]
    # A push that changes only the shipping log ships no code: its PR already ran the checks, and a release
    # would offer every running copy an update with nothing in it. A push that also changes anything else runs.
    paths-ignore:
      - CHANGELOG.md
      - docs/shipping/**
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # the husky hook is for local commits; CI runs the same checks directly
      - run: npm ci --ignore-scripts
      - run: npm run check
      # the tests again, failing when the ledger's coverage drops under its floor
      - run: npm run coverage
      - run: npm run build
      # the map's screen in a real browser, on the fixture map
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      # the agent docs (AGENTS.md, CLAUDE.md, skills) still match the code
      - run: python3 .github/agent-docs/check.py .

  # Every push to main that passes the checks becomes a dev build, tagged
  # dev-<major.minor from package.json>.<run number>: copies on the dev
  # channel (team/live/channel.js) update to it. It is not a release, so
  # copies on the stable channel, customers', never see it: only the Release
  # workflow (release.yml), run by hand by a maintainer, makes one.
  dev-build:
    needs: app
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag the dev build
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          tag="dev-${base}.${{ github.run_number }}"
          git tag "$tag" "${{ github.sha }}"
          git push origin "refs/tags/$tag"
