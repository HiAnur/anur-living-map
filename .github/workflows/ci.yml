name: CI

on:
  push:
    branches: [dev, main]
    # A push that changes only the shipping log ships no code: its PR already ran the checks, and a release
    # would offer every running copy an update with nothing in it. A push that also changes anything else runs.
    paths-ignore:
      - CHANGELOG.md
      - docs/shipping/**
  pull_request:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Protected branches require an up-to-date PR. A push only verifies that
      # its merged code is exactly what that PR's full checks already tested.
      - name: Verify the merged PR's checks
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/agent-tools/verified-pr.ts "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF_NAME"
      # the husky hook is for local commits; CI runs the same checks directly
      - if: github.event_name == 'pull_request'
        run: npm ci --ignore-scripts
      - if: github.event_name == 'pull_request'
        run: npm run check
      # the tests again, failing when the ledger's coverage drops under its floor
      - if: github.event_name == 'pull_request'
        run: npm run coverage
      - if: github.event_name == 'pull_request'
        run: npm run build
      # the map's screen in a real browser, on the fixture map
      - if: github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium
      - if: github.event_name == 'pull_request'
        run: npm run test:ui
      # the agent docs (AGENTS.md, CLAUDE.md, skills) still match the code
      - if: github.event_name == 'pull_request'
        run: python3 .github/agent-docs/check.py .

  # Every push to dev whose PR checks are verified becomes a dev build, tagged
  # dev-<major.minor from package.json>.<run number>: copies on the dev
  # channel (team/live/channel.js) update to it. Customers' copies follow
  # main, which holds only what is ready; a push there runs the checks, and
  # only the Release workflow (release.yml), run by hand by a maintainer,
  # makes it a release.
  dev-build:
    needs: app
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag the dev build
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          tag="dev-${base}.${{ github.run_number }}"
          git tag "$tag" "${{ github.sha }}"
          git push origin "refs/tags/$tag"
