name: Release

# Makes a release that every copy on the stable channel (customers') updates to: a commit on main whose push verified
# its passing PR checks gets the tag v<major.minor>.<that CI run's number> and a GitHub release. main holds only what is ready (daily
# work merges into dev, and a ready fix is copied to main by a pull request), so a release never carries work the
# team is still testing. Only run by hand (Actions → Release → Run workflow), and only by someone with admin or
# maintain rights on this repository: GitHub lets only people with write access run it at all, and the first step
# stops anyone below maintain. A fork runs its own copy, which cannot tag this repository.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: "The commit on main to release. Leave empty for main's newest."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Only a maintainer may release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          role=$(gh api "repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission" --jq .role_name)
          case "$role" in admin|maintain) echo "${{ github.actor }} may release ($role)." ;;
            *) echo "::error::${{ github.actor }} has '$role' on this repository; releasing needs admin or maintain."; exit 1 ;;
          esac
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Release the build
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          # read from the environment, never pasted into the script: the input is text anyone running it typed
          COMMIT: ${{ inputs.commit }}
        run: |
          git fetch -q --tags --force origin main
          if ! sha=$(git rev-parse -q --verify "${COMMIT:-origin/main}^{commit}"); then
            echo "::error::There is no commit \"$COMMIT\"."; exit 1
          fi
          git merge-base --is-ancestor "$sha" origin/main || { echo "::error::$sha is not on main."; exit 1; }
          # The push's CI verifies that the merged code matches its passing, up-to-date PR checks.
          # Older commits remain eligible when their push ran the full checks itself.
          run=$(gh run list -R "${{ github.repository }}" -w ci.yml -b main -e push -c "$sha" --json number,conclusion \
            --jq '[.[] | select(.conclusion == "success")][0].number // empty')
          [ -n "$run" ] || { echo "::error::CI has not passed on $sha after its push to main."; exit 1; }
          base=$(git show "$sha:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version.split('.').slice(0, 2).join('.')")
          tag="v${base}.${run}"
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null && { echo "::error::$tag is released already."; exit 1; }
          # a release only moves forward: copies update to the newest release on main, so an older one would
          # never reach anyone
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' origin/main 2>/dev/null || true)
          if [ -n "$prev" ] && git merge-base --is-ancestor "$sha" "$prev"; then
            echo "::error::$sha is not newer than the current release $prev."; exit 1
          fi
          gh release create "$tag" --target "$sha" --title "Living Map $tag" --generate-notes ${prev:+--notes-start-tag "$prev"}
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Released $sha as $tag."

  # The same release on npm as anur-living-map <version>: the Mac app carries one exact version of it, so every
  # release it may pin has to be there. A job of its own, so a failed publish never undoes the GitHub release:
  # once npm is fixed, re-run only this failed job from the run's page (the release step refuses a released build).
  # Trusted publishing: npm takes this workflow's GitHub identity in place of a token, once the package's settings
  # on npmjs.com name this repository and release.yml, and adds provenance by itself.
  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5.1 or newer
      - run: npm install -g npm@^11.5.1
      - name: Publish anur-living-map
        working-directory: team/live
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          npm version --no-git-tag-version "${TAG#v}"
          npm publish --access public
