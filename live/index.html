}

// a diagram is what a box opens into on a double click, at view "diagram:<box id>": a timeline (what happened,
// in order), a sequence (who sends what to whom, in turn) or a Venn (what belongs to which of 2 or 3 groups)
const KIND_NAME = { timeline: 'Timeline', sequence: 'Sequence', venn: 'Venn' };
const diagramBox = () => view.startsWith('diagram:') ? nodeById(view.slice(8)) || proposedBox(view.slice(8)) || null : null;
let dgSize = { w: 0, h: 0 };
const zoomOnto = (n, z) => { const r = canvas.getBoundingClientRect(); Object.assign(cam, { z, x: r.width / 2 - n.x * z, y: r.height / 2 - n.y * z }); place(); };
// the map glides into the box, then the box opens into its diagram
function openDiagram(id){
  const n = nodeById(id) || proposedBox(id); if (!n?.diagram || locked(n)) return;
  stage.style.transition = 'transform .28s ease-in';
  zoomOnto(n, Math.min(2.5, cam.z * 2.4));
  setTimeout(() => { stage.style.transition = ''; view = `diagram:${id}`; selected = null; expanded = null; lit = null; render(); fit(); }, 280);
}
// Back: the map comes back zoomed into the box and glides out to where it was
function closeDiagram(){
  const id = view.slice(8), up = S.nodes.find((n) => n.inside?.nodes?.some((x) => x.id === id));
  view = up ? up.id : 'system'; selected = null; render(); fit();
  const n = nodeById(id) || proposedBox(id); if (!n) return;
  const to = { ...cam };
  zoomOnto(n, Math.min(2.5, to.z * 2.4));
  stage.getBoundingClientRect();
  stage.style.transition = 'transform .3s ease-out'; Object.assign(cam, to); place();
  setTimeout(() => { stage.style.transition = ''; }, 320);
}
function drawDiagram(db){
  const d = db.diagram, pop = (i) => `animation-delay:${120 + i * 70}ms`;
  let svg = '', html = '', w = 0, h = 0;
  if (d.kind === 'timeline'){
    // one dot per moment along a line, when above it, what below it
    const X = (i) => 130 + i * 170, Y = 170, last = X(d.items.length - 1);
    w = last + 130; h = Y + 130;
    svg += `<path class="dgl" d="M${X(0) - 50} ${Y}H${last + 50}" stroke="#c9c6bd" stroke-width="2" fill="none"/>`;
    d.items.forEach((m, i) => {
      html += `<div class="dg dot" style="left:${X(i) - 7}px;top:${Y - 7}px;${pop(i)}"></div>
        <div class="dg ev" style="left:${X(i) - 75}px;top:${Y - 34}px;${pop(i)}"><div class="dgw">${esc(m.when || '')}</div></div>
        <div class="dg ev" style="left:${X(i) - 75}px;top:${Y + 18}px;${pop(i)}"><div class="dgt">${esc(m.label)}</div>${m.note ? `<div class="dgn">${esc(m.note)}</div>` : ''}</div>`;
    });
  } else if (d.kind === 'sequence'){
    // everyone in it across the top, each step an arrow down the page from who sends it to who gets it
    const lanes = [...new Set(d.items.flatMap((m) => m.from ? [m.from, m.to] : []))], X = (i) => 130 + i * 190, Y0 = 180, DY = 58;
    const lx = Object.fromEntries(lanes.map((l, i) => [l, X(i)])), mid = (X(0) + X(Math.max(0, lanes.length - 1))) / 2;
    w = X(Math.max(0, lanes.length - 1)) + 140; h = Y0 + d.items.length * DY + 20;
    lanes.forEach((l, i) => {
      html += `<div class="flowlane dg c" style="left:${lx[l]}px;top:110px;${pop(i)}">${esc(l)}</div>`;
      svg += `<path class="dgl" d="M${lx[l]} 128V${h - 10}" stroke="#d6d3cb" stroke-width="1" stroke-dasharray="3 4" fill="none"/>`;
    });
    d.items.forEach((m, i) => {
      const y = Y0 + i * DY, at = pop(lanes.length + i);
      if (!m.from){ html += `<div class="flownote dg c" style="left:${mid}px;top:${y}px;${at}">${esc(m.label)}</div>`; return; }
      const x1 = lx[m.from], x2 = lx[m.to], dir = x2 >= x1 ? 1 : -1;
      svg += x1 === x2 ? `<path class="dgl" style="${at}" d="M${x1 + 4} ${y - 10}h34v20h-28" stroke="#6c6a64" stroke-width="1.5" fill="none" marker-end="url(#a-old)"/>`
        : `<path class="dgl" style="${at}" d="M${x1 + dir * 4} ${y}H${x2 - dir * 6}" stroke="#6c6a64" stroke-width="1.5" fill="none" marker-end="url(#a-old)"/>`;
      html += `<div class="dg say" style="left:${Math.min(x1, x2) + 14}px;top:${y - 24}px;${at}">${esc(m.label)}</div>`;
    });
  } else {
    // one circle per group, overlapping; each item sits in the part for the groups it is in
    const groups = [...new Set(d.items.flatMap((m) => m.in || []))].slice(0, 3), n = groups.length;
    const cx = 330, cy = n === 3 ? 290 : 250, r = n === 3 ? 135 : 150;
    const C = n <= 1 ? [[cx, cy]] : n === 2 ? [[cx - 95, cy], [cx + 95, cy]] : [[cx - 85, cy - 55], [cx + 85, cy - 55], [cx, cy + 85]];
    const FILL = ['rgba(47,111,228,.10)', 'rgba(201,100,66,.10)', 'rgba(46,139,87,.10)'], LINE = ['#2F6FE4', '#C96442', '#2E8B57'];
    C.forEach(([x, y], i) => {
      svg += `<circle class="dgl" style="animation-delay:${i * 90}ms" cx="${x}" cy="${y}" r="${r}" fill="${FILL[i]}" stroke="${LINE[i]}" stroke-width="1.5"/>`;
      if (groups[i]) html += `<div class="dg c set" style="left:${x}px;top:${i === 2 ? y + r + 18 : y - r - 18}px;color:${LINE[i]};${pop(i)}">${esc(groups[i])}</div>`;
    });
    const SPOT = n <= 1 ? { 0: [cx, cy], '': [cx + r + 110, cy] }
      : n === 2 ? { 0: [cx - 170, cy], 1: [cx + 170, cy], '01': [cx, cy], '': [cx, cy + r + 50] }

    let k = 0;
    for (const [key, list] of Object.entries(part)){
      const [x, y] = SPOT[key] || SPOT[''];
      list.forEach((m, j) => { html += `<div class="dg c chip" style="left:${x}px;top:${y + (j - (list.length - 1) / 2) * 28}px;${pop(n + k++)}">${esc(m.label)}</div>`; });

function fit(){
  const fb = flowBox(), db = diagramBox();
  const { nodes } = scope(); if (!fb && !db && !nodes.length) return;
  const xs = nodes.map((n) => n.x), ys = nodes.map((n) => n.y);
  let minX = Math.min(...xs) - 120, maxX = Math.max(...xs) + 120, minY = Math.min(...ys) - 80, maxY = Math.max(...ys) + 100;
  if (fb){ minX = 20; maxX = LANE_X(fb.flow.lanes.length - 1) + 180; minY = 10; maxY = STEP_Y0 + (fb.flow.steps.length + 2) * STEP_DY + 40; }
  else if (db){ minX = 20; maxX = dgSize.w + 20; minY = 10; maxY = dgSize.h + 20; }
  // the lines and their words too: a curve between two boxes in one column, and its words, reach past the boxes
  else try { const b = edgesEl.getBBox(); if (b.width){ minX = Math.min(minX, b.x - 24); maxX = Math.max(maxX, b.x + b.width + 24); minY = Math.min(minY, b.y - 24); maxY = Math.max(maxY, b.y + b.height + 24); } } catch {}
  const r = canvas.getBoundingClientRect();
  // the map takes whichever is bigger: the space beside the queue, or the full width under it
  const q = $('queue').getBoundingClientRect();
  const right = ($('side').classList.contains('on') || prsOpen) ? 440 : 40, bottom = 60;
  const under = Math.max(30, q.bottom - r.top + 16);
  const fitIn = (left, top) => Math.min(1.6, (r.width - left - right) / (maxX - minX), (r.height - top - bottom) / (maxY - minY));
  const beside = fitIn(q.width + 48, 30), below = fitIn(40, under);
  const [left, top, z] = below >= beside ? [40, under, below] : [q.width + 48, 30, beside];
  cam.z = z; cam.x = left + ((r.width - left - right) - (maxX - minX) * z) / 2 - minX * z; cam.y = top + ((r.height - top - bottom) - (maxY - minY) * z) / 2 - minY * z;
  place();
}

// a database is drawn as the usual cylinder before its name
const ICON = {

  lock: '<svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5 7V5a3 3 0 016 0v2"/></svg>',
};

/* arrowheads, one per line colour */
const COL = { old: '#9b988f', new: '#2F6FE4', 'assumed-gone': '#D23B32' };
const defsHtml = `<defs>${Object.entries(COL).map(([k, c]) => `<marker id="a-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1L10 5L0 9Z" fill="${c}"/></marker>`).join('')}</defs>`;

// out of one box, into the next: straight when they line up, one elbow otherwise
// A line leaves and enters on the sides that face each other: boxes mostly side
// by side join left-to-right with one jog in the gap; boxes mostly above each
// other join bottom-to-top the same way. So a line never runs along a box edge
// or arrives where another line already does.
function route(a, b, dup, others = []){
  // two lines between the same boxes sit 7px either side of the middle
  const off = dup === null ? 0 : dup ? 7 : -7;
  const dx = b.x - a.x, dy = b.y - a.y;
  // sideways: out of the facing sides, one jog in the gap between them
  const side = () => {
    const sx = dx > 0 ? a.x + W(a) / 2 : a.x - W(a) / 2, tx = dx > 0 ? b.x - W(b) / 2 - 2 : b.x + W(b) / 2 + 2;
    const y1 = a.y + off, y2 = b.y + off, mx = (sx + tx) / 2;
    return Math.abs(dy) < 2 ? [[sx, y1], [tx, y1]] : [[sx, y1], [mx, y1], [mx, y2], [tx, y2]];
  };
  // up or down: out of the top or bottom, one jog between the rows
  const updown = () => {
    const sy = dy > 0 ? a.y + HT(a) / 2 : a.y - HT(a) / 2, ty = dy > 0 ? b.y - HT(b) / 2 - 2 : b.y + HT(b) / 2 + 2, my = (sy + ty) / 2;
    return Math.abs(dx) < 2 ? [[a.x, sy], [a.x, ty]] : [[a.x, sy], [a.x, my], [b.x, my], [b.x, ty]];
  };
  // the natural shape, unless it runs through another box and the other one does not
  const blocked = (pts) => pts.slice(1).reduce((k, [x2, y2], i) => {
    const [x1, y1] = pts[i];
    return k + others.filter((n) => n !== a && n !== b && Math.max(x1, x2) > n.x - W(n) / 2 - 4 && Math.min(x1, x2) < n.x + W(n) / 2 + 4
      && Math.max(y1, y2) > n.y - HT(n) / 2 - 4 && Math.min(y1, y2) < n.y + HT(n) / 2 + 4).length;
  }, 0);
  const first = Math.abs(dx) >= Math.abs(dy) ? side() : updown(), second = Math.abs(dx) >= Math.abs(dy) ? updown() : side();
  const pts = blocked(first) && blocked(second) < blocked(first) ? second : first;
  return pts.map(([x, y], i) => `${i ? 'L' : 'M'}${x} ${y}`).join('');
}

// A topic map (one box everything hangs off) is a tree: each box hangs under the box nearest the first one that
// has a line to it, as Tidy up lays it out. Its other lines are cross-links, drawn faint, dashed and curved the
// way XMind draws its relationships, so they read as "related to" and never as part of the tree.
function crossLinks(){
  const ids = new Set(S.nodes.map((n) => n.id)), es = S.edges.filter((e) => ids.has(e.from) && ids.has(e.to) && e.from !== e.to);
  const into = new Set(es.map((e) => e.to)), roots = S.nodes.filter((n) => !into.has(n.id));
  if (roots.length !== 1) return null;
  const out = new Map(); for (const e of es){ if (!out.has(e.from)) out.set(e.from, []); out.get(e.from).push(e); }
  const seen = new Set([roots[0].id]), tree = new Set(), q = [roots[0].id];
  while (q.length) for (const e of out.get(q.shift()) || []) if (!seen.has(e.to)){ seen.add(e.to); tree.add(e); q.push(e.to); }
  if (seen.size !== S.nodes.length) return null;
  return { root: roots[0], links: new Set(es.filter((e) => !tree.has(e)).map((e) => `${e.from}>${e.to}`)) };
}
// a cross-link's curve: out of the side facing the other box and into its facing side; two boxes in one column
// join on their outer side (away from the first box), the curve bowing out past them
function curve(a, b, cx){
  const column = Math.abs(b.x - a.x) < (W(a) + W(b)) / 2 + 24, dir = column ? (a.x >= cx ? 1 : -1) : Math.sign(b.x - a.x);
  const sx = a.x + dir * W(a) / 2, tx = column ? b.x + dir * (W(b) / 2 + 2) : b.x - dir * (W(b) / 2 + 2);
  const bow = column ? Math.min(64, 32 + Math.abs(b.y - a.y) / 8) : Math.max(40, Math.abs(tx - sx) / 2);
  const c1 = [sx + dir * bow, a.y], c2 = [column ? tx + dir * bow : tx - dir * bow, b.y];
  return { d: `M${sx} ${a.y}C${c1[0]} ${c1[1]} ${c2[0]} ${c2[1]} ${tx} ${b.y}`,
    mid: [(sx + 3 * c1[0] + 3 * c2[0] + tx) / 8, (a.y + 3 * c1[1] + 3 * c2[1] + b.y) / 8] };
}

function render(){
  if (!S) return;
  const fb = flowBox();
  const db = !fb && diagramBox();
  if (fb || db){ if (fb) drawFlow(fb); else drawDiagram(db); renderLevels(); renderTop(); renderInbox(); renderQueue(); renderSide(); renderPrs(); renderCursors(); renderComments(); renderChat(); renderDecs(); renderHist(); renderMem(); fitPane(); return; }
  let { nodes, edges } = scope();
  while ([selected, lit].some((id) => id && reveal(id))) ({ nodes, edges } = scope());
  const byId = Object.fromEntries(nodes.map((n) => [n.id, n]));
  // lines
  let svg = '';
  const pair = (e) => edges.some((o) => o.from === e.to && o.to === e.from);
  const seen = new Set(), cross = view === 'system' ? crossLinks() : null;
  for (const e of edges){
    const a = byId[e.from], b = byId[e.to]; if (!a || !b) continue;
    const dup = pair(e) ? seen.has(`${e.to}>${e.from}`) : null; seen.add(`${e.from}>${e.to}`);
    // a line Claude proposed and you have not applied is blue and moving, on any map; on a map of decisions the rest are plain
    const k = e.proposed ? 'new' : decisionMap() ? 'old' : e.state || 'old';
    const quiet = anyFocus() && !e.state && !focused(a) && !focused(b);
    // a cross-link always curves around the tree; a plain one is faint, one a plan adds or proposes keeps its colour
    if (cross?.links.has(`${e.from}>${e.to}`)){
      const c = curve(a, b, cross.root.x), kc = !e.proposed && !e.state ? 'cross' : k;
      svg += `<path class="${kc} ${quiet ? 'faint' : ''}" d="${c.d}" marker-end="url(#a-${kc === 'cross' ? 'old' : k})"/>`;
      if (e.label) svg += `<rect class="gap" x="${c.mid[0]}" y="${c.mid[1] - 8}" width="0" height="16" fill="var(--canvas)"/><text class="${kc}" x="${c.mid[0]}" y="${c.mid[1]}" text-anchor="middle" dominant-baseline="central">${e.label}</text>`;
      continue;
    }
    svg += `<path class="${k} ${quiet ? 'faint' : ''}" d="${route(a, b, dup, nodes)}" marker-end="url(#a-${k})"/>`;
    // a line's words sit on the line itself, in a gap, so the line reads "Upgrade →"
    if (e.label){
      const level = Math.abs(a.y - b.y) < 2, upright = Math.abs(a.x - b.x) < 2;
      const off = dup === null ? 0 : dup ? 7 : -7;
      const x1 = a.x < b.x ? a.x + W(a) / 2 : a.x - W(a) / 2, x2 = level ? (a.x < b.x ? b.x - W(b) / 2 : b.x + W(b) / 2) : b.x;
      // a straight up-and-down line carries its words halfway between the two boxes; a sideways line with a jog
      // carries them on its own last stretch, so lines that share a stem out of one box keep their words apart
      const branch = !level && !upright && Math.abs(b.x - a.x) >= Math.abs(b.y - a.y);
      const tx = a.x < b.x ? b.x - W(b) / 2 - 2 : b.x + W(b) / 2 + 2;
      const mx = upright ? a.x : branch ? ((x1 + tx) / 2 + tx) / 2 : (x1 + x2) / 2;
      const my = upright ? ((a.y < b.y ? a.y + HT(a) / 2 : a.y - HT(a) / 2) + (a.y < b.y ? b.y - HT(b) / 2 : b.y + HT(b) / 2)) / 2 : branch ? b.y + off : a.y + off;
      svg += `<rect class="gap" x="${mx}" y="${my - 8}" width="0" height="16" fill="var(--canvas)"/><text class="${k}" x="${mx}" y="${my}" text-anchor="middle" dominant-baseline="central">${e.label}</text>`;
    }
  }
  edgesEl.innerHTML = defsHtml + svg;
  // the gap is as wide as the words, measured, plus a little air
  for (const r of edgesEl.querySelectorAll('rect.gap')){
    const t = r.nextElementSibling, w = t.getComputedTextLength() + 8;
    r.setAttribute('x', Number(r.getAttribute('x')) - w / 2); r.setAttribute('width', w);
  }
  // boxes
  document.body.classList.toggle('decide', decisionMap());
  let html = '';
  for (const n of nodes){
    const open = S.calls.filter((c) => c.node === n.id && c.status === 'open'), mine = open.some((c) => c.for === ME);
    // a box outside your reach shows nothing of what was decided on it, unless a question on it waits on you
    const cls = ['node', n.kind || '', n.ghost ? 'ghost' : '', n.proposed ? 'proposed new' : '', decisionMap() ? (locked(n) && !mine ? '' : boxDecision(n)) : n.state || '', selected === n.id || lit === n.id ? 'sel' : '', locked(n) ? 'locked' : '', focused(n) || view !== 'system' || !anyFocus() ? '' : 'faint'].join(' ');
    html += `<div class="${cls}" data-id="${n.id}" style="left:${n.x}px;top:${n.y}px;width:${W(n)}px;height:${HT(n)}px" ${locked(n) ? `title="No access: ask ${S.people.find((p) => p.role === 'Admin')?.id || 'an admin'}"` : ''}>
      <div class="n">${locked(n) ? ICON.lock : n.icon === 'db' ? ICON.db : ''}<span class="nt">${n.label}</span></div>${n.sub && !locked(n) ? `<div class="s">${n.sub}</div>` : ''}
      ${n.note && n.note !== n.sub && n.state === 'assumed-gone' ? `<div class="s2">${n.note}</div>` : ''}
      ${mine ? `<span class="mk q" title="${open.find((c) => c.for === ME).ask || ''}">Need clarify</span>`
        : locked(n) ? '' : open.length ? waitPill(open, 'mk q') : (() => { const d = S.calls.filter((c) => c.node === n.id && c.status !== 'open').at(-1); return d && !open.length ? `<span class="mk q ok" title="${d.ask || d.text}: ${ans(d)} from ${d.by}, ${d.at}">Clarified</span>` : ''; })()}
      ${n.inside && !locked(n) ? `<span class="expand" data-expand="${n.id}" title="Open ${n.label}: what is inside it">Expand ›</span>`
        : n.diagram && !locked(n) ? `<span class="expand dgp dg-${KIND_NAME[n.diagram.kind] ? n.diagram.kind : ''}" data-dgx="${n.id}" title="Open ${esc(n.label)}: its ${n.diagram.kind} (double click)">${KIND_NAME[n.diagram.kind]} ›</span>` : ''}
      ${foldButton(n, byId)}
      </div>`;
    // the file only for the box you picked; the card has it too
    if (n.file && selected === n.id) html += `<div class="file" style="left:${n.x - W(n) / 2}px;top:${n.y + HT(n) / 2 + 5}px">${n.file}</div>`;
  }
  nodesEl.innerHTML = html;
  renderLevels(); renderTop(); renderInbox(); renderQueue(); renderSide(); renderPrs(); renderCursors(); renderComments(); renderChat(); renderDecs(); renderHist(); renderMem(); fitPane();
}

    ${peopleOpen ? `<div class="pm">${ppl.map((p) => `<div class="pm-row ${p.id === ME ? 'me' : ''} ${isHere(p) ? '' : 'away'}"${SIGNED_IN ? '' : ` data-as="${p.id}"`}${p.id === ME || SIGNED_IN ? '' : ` title="See the map as ${p.id}"`}><span class="face" style="background:${pcol(p.id)}">${p.id[0]}</span><span class="pm-who"><b>${p.id}${p.id === ME ? ' <i>(You)</i>' : ''}</b><span>${[roleOf(p), isHere(p) ? '<em class="on">Here now</em>' : 'Not here'].filter(Boolean).join(' · ')}</span></span></div>`).join('')}
      <div class="pm-row"><span class="face cl">✳</span><span class="pm-who"><b>Claude Code</b><span>AI agent, draws the plans</span></span></div>
      ${SIGNED_IN ? `<div class="pm-row pm-out" data-signout>Sign out</div>` : ''}</div>` : ''}`;

// renaming the map: Enter or clicking away saves the new name for everyone, Esc keeps the old one
let renaming = false;

document.addEventListener('focusout', (e) => { if (e.target.id === 'renamei') endRename(true); });

// What someone answered: Yes or No, or the option they picked ("Own answer" when they wrote their own)
// "Wait on (P)": the question waits on someone else, not you; each person's initial in their colour, their name on hover
const waitPill = (calls, cls) => { const who = [...new Set(calls.map((c) => c.for))];
  return `<span class="${cls} wait">Wait on ${who.map((w) => `<i class="wav" style="background:${pcol(w)}" data-name="${w}" aria-label="${w}">${w[0]}</i>`).join('')}</span>`; };
const ans = (c) => c.status === 'answered' ? (c.pickedId === 'other' ? 'Own answer' : c.picked) : c.status === 'confirmed' ? 'Yes' : 'No';

// What the agent needs from you before it builds: one short question, the box it is on, and its answers:
// Yes / No when that is the whole choice, or a few options plus "Other…" to say it in your own words.
// Click it and it opens in place: why it is asked, and what each answer does; its box lights up on the map.
let expanded = null;
// the box card's tab ('box' for Information, 'history' or 'chat') and the box it was chosen on
let sideTab = 'box', sideFor = null, sideSeen = '';
// a box opened from Decisions or Claude's chat has a Back to it, which returns to where you were in that list
let backTo = null, decsScroll = 0;
// the answered questions opened with More in History, by call id
const histOpen = new Set();
// what the Information tab shows behind More: n:<box> the rest of its notes, c:<call> why a question is asked, o:<call> its own-words box
const infoMore = new Set();
const callRow = (c, withButtons) => `<div class="row open-node ca ${expanded === c.id ? 'open' : ''}" data-call-row="${c.id}" data-node="${c.node}">
  <div class="ca-line"><span class="ca-q">${c.ask || c.assume || c.text}</span>${withButtons && c.status === 'open' && !c.options?.length
    ? `<span class="ca-btns"><span class="gb yes" data-call="${c.id}" data-ans="confirm">Yes</span><span class="gb" data-call="${c.id}" data-ans="dispute">No</span></span>`
    : c.status !== 'open' ? `<span class="ca-done">${ans(c)}</span>` : ''}</div>
  ${withButtons && c.status === 'open' && c.options?.length ? `<div class="ca-opts">${c.options.map((o) => `<span class="gb" data-call="${c.id}" data-opt="${o.id}" data-label="${o.label}" title="${o.means || ''}">${o.label}</span>`).join('')}<span class="gb" data-other-pick="${c.id}">Other…</span></div>` : ''}
  <div class="ca-on">${c.from === 'Codex' ? 'Codex' : 'Claude'} · ${nodeById(c.node)?.label || c.node}<span class="ca-more">${expanded === c.id ? 'Less' : 'Why?'}</span></div>
  ${expanded === c.id ? `<div class="ca-x">
    ${c.plain || c.context ? `<p>${c.plain || c.context}</p>` : ''}
    ${c.options?.length ? c.options.map((o) => `<div class="ca-if"><span>${o.label}${o.means ? `: ${o.means}` : ''}</span></div>`).join('')
      : `${c.yes ? `<div class="ca-if"><b>Yes</b><span>${c.yes}</span></div>` : ''}${c.no ? `<div class="ca-if"><b>No</b><span>${c.no}</span></div>` : ''}`}
  </div>` : ''}</div>`;

function renderQueue(){
  const open = S.calls.filter((c) => c.for === ME && c.status === 'open');
  const q = $('queue');
  q.classList.toggle('quiet-card', !open.length);
  if (!open.length){ q.innerHTML = '<span class="quiet">Nothing for you to answer</span>'; return; }
  q.innerHTML = `<div class="ct">Need clarify <span class="ca-n">${open.length}</span></div>${open.map((c) => callRow(c, true)).join('')}`;
}

function renderSide(){
  const el = $('side');
  const n = selected && nodeById(selected), pb = selected && !n && proposedBox(selected);
  el.classList.toggle('on', !!(n || pb));
  el.classList.remove('info');
  // a box Claude proposed and nobody applied yet: what it is, and the change it comes with, Apply on it
  if (pb){
    el.innerHTML = `<div class="ct"><span>${pb.label}</span><span class="ct-r"><span class="x" data-close>×</span></span></div>
      <div class="d-prop">Proposed. It joins the map when you press Apply.</div>
      ${pb.sub ? `<div class="d-sub">${pb.sub}</div>` : ''}${notes(pb.desc && pb.desc !== pb.sub ? pb.desc : '')}${proposalOf(pb.id)}`;
    return;
  }
  if (!n) return;
  if (locked(n)){
    const admin = S.people.find((p) => p.role === 'Admin')?.id || 'an admin';
    el.innerHTML = `<div class="ct"><span>${n.label}</span><span class="x" data-close>×</span></div>
      <div class="nope">${ICON.lock}<div><b>You don't have access to ${n.label}.</b><br>Your access covers ${me().sees}. Ask ${admin} to open this one.</div></div>`;
    return;
  }
  const calls = S.calls.filter((c) => c.node === n.id);
  // a box you just opened starts on what is open on it now
  if (sideFor !== n.id){ sideFor = n.id; sideTab = 'box'; backTo = null; }
  // The card answers one question: what is being decided about this box, and what each answer does.
  // Open questions sit on "This box"; once answered they move to "History", with what was picked and why.
  // An open question, short: who asks, the question, and its answers by name, as buttons when it is yours to
  // answer. More opens why Claude asks and what each answer means; "Other…" opens a box for your own words.
  const decision = (c) => {
    const agent = c.from === 'Codex' ? 'Codex' : 'Claude', opts = c.options || [], mine = c.for === ME;
    const more = infoMore.has(`c:${c.id}`), other = infoMore.has(`o:${c.id}`);
    const answers = mine
      ? opts.length
        ? `<div class="d-chips">${opts.map((o) => `<span class="gb" data-call="${c.id}" data-opt="${o.id}" data-label="${o.label}">${o.label}</span>`).join('')}<span class="gb" data-more="o:${c.id}">Other…</span></div>
          ${other ? `<form class="d-other" data-other="${c.id}"><input id="other-${c.id}" placeholder="Say it in your words" autocomplete="off"><button class="gb" type="submit">Send</button></form>` : ''}`
        : `<div class="btns"><span class="gb yes" data-call="${c.id}" data-ans="confirm">Yes</span><span class="gb" data-call="${c.id}" data-ans="dispute">No</span></div>`
      : opts.length && !more ? `<div class="d-list">${opts.map((o) => o.label).join(' · ')}</div>` : '';
    const why = `${c.plain || c.context ? `<div class="d-why">${c.plain || c.context}</div>` : ''}${opts.length
      ? `<div class="d-optx">${opts.map((o) => `<div><b>${o.label}</b>${o.means ? `<span>${o.means}</span>` : ''}</div>`).join('')}</div>`
      : `${c.yes ? `<div class="d-if"><b>Yes</b><span>${c.yes}</span></div>` : ''}${c.no ? `<div class="d-if"><b>No</b><span>${c.no}</span></div>` : ''}`}`;
    return `<div class="d">
      <div class="d-who">${agent} asks ${mine ? 'you' : c.for}${mine ? '' : waitPill([c], 'wpill')}</div>
      <div class="d-q">${c.ask || c.text}</div>
      ${answers}
      ${more ? `<div class="d-x">${why}</div>` : ''}
      <div class="d-morel"><span class="d-more" data-more="c:${c.id}">${more ? 'Less' : 'More'}</span></div>
    </div>`;
  };
  // an answered question in History: the question and why it was asked, then the answers there were with what each
  // meant, the picked one green with what the person wrote; an own answer is one more choice, Other, picked, with their words
  const decided = (c) => {
    const opts = c.options?.length ? c.options.map((o) => ({ label: o.label, means: o.means, on: c.pickedId === o.id }))
      : [{ label: 'Yes', means: c.yes, on: c.status === 'confirmed' }, { label: 'No', means: c.no, on: c.status === 'disputed' }];
    if (c.pickedId === 'other') opts.push({ label: 'Other', on: true });
    const words = c.pickedId === 'other' ? c.picked : c.said && c.said !== c.picked ? c.said : '', more = histOpen.has(c.id);
    // short: only the green pick; More: who asked and why, then every choice with the pick still green
    const po = (o) => `<div class="d-po ${o.on ? 'on' : ''}">${o.on ? '✓ ' : ''}${prose(o.label)}${o.means && (more || !o.on) ? `<i>${prose(o.means)}</i>` : ''}${o.on && words ? `<span>“${prose(words)}”</span>` : ''}</div>`;
    return `<div class="d done">
      <div class="d-q">${c.ask || c.text}</div>
      ${more && (c.plain || c.context) ? `<div class="d-who">${c.from === 'Codex' ? 'Codex' : 'Claude'} asked ${c.for === ME ? 'you' : c.for}</div><div class="d-why">${c.plain || c.context}</div>` : ''}
      <div class="d-pick">${(more ? opts : opts.filter((o) => o.on)).map(po).join('')}</div>
      <div class="d-who">${c.by}, ${c.at}<span class="d-more" data-hist-more="${c.id}">${more ? 'Less' : 'More'}</span></div>
    </div>`;
  };
  const answered = calls.filter((c) => c.status !== 'open').reverse();
  const history = answered.length ? answered.map(decided).join('')
    : n.decided ? `<div class="dec"><b>${n.decided.what}</b><span class="who">${n.decided.who}, ${n.decided.at}</span></div>`
    : '<div class="d-wait">Nothing has been answered on this box yet.</div>';
  // Chat: your side chat on this box (threads['@Duy>billing']), to brainstorm and refine it. Claude reads your main chat
  // each time you ask, so it knows what you said there; what you say here stays on this box and never fills the main chat.
  const sideKey = `@${ME}>${n.id}`, sideT = S.threads?.[sideKey] || [], asked = sideT.filter((m) => m.who !== 'Claude').length;
  // laid out like the Claude app: Claude on the left, you on the right
  const chat = `${sideT.map((m, i) => m.who !== 'Claude' ? yours(m.text)
      : claudes(`${m.thinking && !m.text ? '<span class="spark" title="Reading the map">✳</span>' : md(m.text)}${change(m, sideKey, i)}`)).join('')}
    <form class="ask cbox side-ask" data-ask="${n.id}"><input placeholder="Brainstorm ${n.label}" autocomplete="off"><div class="crow">${attached(n)}<button class="send" type="submit" title="Ask" aria-label="Ask">${SEND_ICON}</button></div></form>`;
  // two tabs: Information (what the box is and what is open on it, then its Side Chat under a divider) and Decision
  // history (what was answered); ✳ Side Chat beside × goes down to the Side Chat, ready to type
  const tab = (id, label) => `<span data-side-tab="${id}" class="${sideTab === id ? 'on' : ''}">${label}</span>`;
  // on Information the panel is a column, so Claude references can sit on its bottom edge
  el.classList.toggle('info', sideTab !== 'history' && sideTab !== 'chat');
  el.innerHTML =`${backTo ? `<div class="side-back" data-back>‹ Back to ${backTo === 'decisions' ? 'Decisions' : backTo === 'sidechats' ? 'Side Chats' : 'Claude'}</div>` : ''}<div class="ct"><span>${n.label}</span><span class="ct-r"><button class="gb chat-h" data-chat-box title="Side chat about ${n.label}">✳ Side Chat</button><span class="x" data-close>×</span></span></div>
    <div class="side-tabs">${tab('box', 'Information')}${tab('history', `Decision history${answered.length ? ` · ${answered.length}` : ''}`)}</div>
    ${sideTab === 'history' ? history : `<div class="info-body">
    ${(() => {
      // the box at a glance, read top to bottom: what was decided, green and bold (hovering it says who decided
      // it and when), then its notes as plain lines; "Why them: …" reads "Why them? …", a catch or a risk carries
      // ⚠️, other lines are a list; the first 5 lines at once and the rest under More
      const done = calls.filter((c) => c.status !== 'open'), last = done.at(-1);
      const tip = last ? `✓ Decided by ${last.by}, ${last.at}` : n.decided ? `✓ Decided by ${n.decided.who}, ${n.decided.at}` : '';
      const top = n.sub || (n.decided && !done.length ? n.decided.what : '');
      const glance = (ls, first) => { let html = '', list = [];
        const flush = () => { if (list.length) html += `<ul class="nt-list">${list.map((v) => `<li>${prose(v)}</li>`).join('')}</ul>`; list = []; };
        ls.forEach((l, i) => {
          const item = l.match(/^[-•]\s+(.+)/), pair = l.match(/^([A-Z][\w' ]{1,23}):\s+(.+)/);
          if (pair){ flush(); const k = pair[1], warn = /catch|risk|warning|watch out|unknown|not known|downside|danger/i.test(k);
            html += `<p class="i-p">${warn ? '⚠️ ' : ''}<b>${prose(k)}${/^(why|what|who|how|when|where)\b/i.test(k) ? '?' : ':'}</b> ${prose(pair[2][0].toUpperCase() + pair[2].slice(1))}</p>`; }
          else if (item) list.push(item[1]);
          else if (i === 0 && first) html += `<p class="i-p">${prose(l)}</p>`;
          else list.push(l);
        });
        flush(); return html ? `<div class="notes">${html}</div>` : ''; };
      const lines = String(n.desc && n.desc !== n.sub ? n.desc : '').split('\n').map((l) => l.trim()).filter(Boolean), more = infoMore.has(`n:${n.id}`);
      return `${top ? `<div class="d-sub"><span class="${tip ? 'i-ok' : ''}"${tip ? ` data-tip="${prose(tip)}"` : ''}>${top}</span></div>` : ''}
        ${glance(lines.slice(0, 5), true)}
        ${more ? glance(lines.slice(5), false) : ''}
        ${lines.length > 5 ? `<div class="d-morel nt-more"><span class="d-more" data-more="n:${n.id}">${more ? 'Less' : 'More about this box'}</span></div>` : ''}`;
    })()}
    ${memOf(n.id)}
    ${calls.filter((c) => c.status === 'open').map(decision).join('')}
    ${n.inside || flowOf(n) || n.diagram ? `<div class="h">Go deeper</div><div class="btns">${n.inside ? `<button class="gb" data-enter="${n.id}">Open ${n.label} ›</button>` : ''}${flowOf(n) ? `<button class="gb" data-flow="${flowOf(n).id}">See the payment flow ›</button>` : ''}${n.diagram ? `<button class="gb" data-diagram="${n.id}">Open the ${n.diagram.kind} ›</button>` : ''}</div>` : ''}
    ${n.file ? `<div class="d-file">${n.file}</div>` : ''}</div>
    ${n.fact ? `<div class="refs"><div class="h">Claude references</div><div class="fact">${n.fact.text}<span class="from">${n.fact.from}</span></div></div>` : ''}
    <div class="sc-sec"><div class="sc-div"><span>Side Chat${asked ? ` · ${asked}` : ''}</span></div>${chat}</div>`}`;
  // a new message in the box's Side Chat scrolls the card down to it; opening a box leaves the card at the top
  const seen = `${n.id}:${sideT.map((m) => m.text).join('').length + sideT.length}`;
  if (sideTab === 'box' && seen !== sideSeen){ if (sideSeen.startsWith(`${n.id}:`)) el.scrollTop = el.scrollHeight; sideSeen = seen; }
}

// the change a proposed box comes with, as its Apply card: from your chats on the map, or the Claude Code chat linked for you
const proposalOf = (id) => {
  const has = (p) => p?.status === 'pending' && p.plan?.nodes.some((n) => n.id === id);
  for (const k of Object.keys(S.threads || {}).filter((k) => k === `@${ME}` || k.startsWith(`@${ME}>`)))
    for (const [i, m] of S.threads[k].entries()) if (has(m?.proposal)) return change(m, k, i);
  const p = (S.proposals || []).find((p) => has(p) && (S.linked || []).some((l) => l.session === p.session && l.owner === ME));

/* comments */
let tool = 'select', openThread = null, draft = null, panelQuery = '', pendingOpen = false, showResolved = false, lit = null;
document.addEventListener('input', (e) => { if (e.target.id === 'cpq'){ panelQuery = e.target.value; renderComments(); const q = $('cpq'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); } });

const ago = (t) => { const s = Math.max(0, Math.round((Date.now() - t) / 1000)); if (s < 60) return 'just now'; const m = Math.round(s / 60); if (m < 60) return `${m} minute${m === 1 ? '' : 's'} ago`; const h = Math.round(m / 60); return `${h} hour${h === 1 ? '' : 's'} ago`; };
const av = (who) => `<span class="av" style="background:${pcol(who)}">${who[0]}</span>`;

function renderComments(){

      <div class="th-body">${c.msgs.map((m) => `<div class="th-msg">${av(m.who)}<div><span class="who">${m.who}</span><span class="ago">${ago(m.at)}</span><div class="tx">${mention(m.text)}</div></div></div>`).join('')}</div>
      <form class="th-reply" data-reply="${c.id}">${av(ME)}<input placeholder="Reply" autocomplete="off"><button type="submit" title="Send">↑</button></form>`

    const w = th.offsetWidth, h = th.offsetHeight, pinH = 30;
    let left = px + 36, top = py - pinH;

function setTool(t){ tool = t; document.querySelectorAll('.tb').forEach((x) => x.classList.toggle('on', x.dataset.tool === t)); if (t !== 'comment') draft = null; render(); }

/* pan, zoom, drag */
let drag = null, panning = null, moved = false;
canvas.addEventListener('pointerdown', (e) => {
  const pin = e.target.closest('.pinc');
  if (pin){ if (pin.dataset.pin){ openThread = openThread === Number(pin.dataset.pin) ? null : Number(pin.dataset.pin); draft = null; render(); } return; }
  // the Expand pill opens the box here: the canvas captures the pointer, so a
  // click event would land on the canvas, not on the pill
  const ex = e.target.closest('.expand');
  if (ex){ if (ex.dataset.dgx) openDiagram(ex.dataset.dgx); else enter(ex.dataset.expand); return; }
  const fo = e.target.closest('.fold');
  if (fo){ toggleFold(fo.dataset.fold); return; }
  const nd = e.target.closest('.node');
  moved = false;
  // the comment tool drops a pin where you click, on a box or on the canvas
  if (tool === 'comment'){
    const [sx, sy] = toStage(e.clientX, e.clientY);
    const n = nd && nodeById(nd.dataset.id);
    if (n && locked(n)){ toast(`You don't have access to ${n.label}.`); return; }
    draft = { x: Math.round(sx), y: Math.round(sy), node: n?.id || null }; openThread = null; render(); return;
  }
  // a proposed box drags, and a click opens its card
  if (nd?.classList.contains('proposed')){
    const n = proposedBox(nd.dataset.id);
    if (n){ const [sx, sy] = toStage(e.clientX, e.clientY); drag = { n, dx: n.x - sx, dy: n.y - sy, proposed: true }; canvas.setPointerCapture(e.pointerId); }
    return;
  }
  if (nd){
    const n = nodeById(nd.dataset.id);
    // a locked box opens its "no access" card and never moves
    if (locked(n)){ selected = selected === n.id ? null : n.id; render(); if (selected) keepInView(selected); return; }
    const [sx, sy] = toStage(e.clientX, e.clientY); drag = { n, dx: n.x - sx, dy: n.y - sy };
  }
  else { panning = { x: e.clientX - cam.x, y: e.clientY - cam.y }; canvas.classList.add('grabbing'); }
  canvas.setPointerCapture(e.pointerId);
});
let lastCur = 0;
canvas.addEventListener('pointermove', (e) => {
  const [sx, sy] = toStage(e.clientX, e.clientY);
  if (drag){ moved = true; drag.n.x = Math.round(sx + drag.dx); drag.n.y = Math.round(sy + drag.dy); render(); }
  else if (panning){ moved = true; cam.x = e.clientX - panning.x; cam.y = e.clientY - panning.y; place(); }
  if (Date.now() - lastCur > 50){ lastCur = Date.now(); act('cursor', { x: Math.round(sx), y: Math.round(sy), view }); }
});
// a double click is two taps on the same box within 350ms: the first tap
// redraws the box, so the browser's own dblclick never sees the same element
let lastTap = { id: null, at: 0 };
// a box that opens on a double click waits out the second click before its card opens, so the card
// never lands on top of the box between the two clicks
const DBL = 320;
let tapTimer = null;
const pick = (n) => {
  clearTimeout(tapTimer);
  const go = () => { selected = selected === n.id ? null : n.id; render(); if (selected) keepInView(selected); };
  if (n.inside || n.diagram) tapTimer = setTimeout(go, DBL); else go();
};
canvas.addEventListener('pointerup', (e) => {
  if (drag){
    if (moved) act('move', { id: drag.n.id, x: drag.n.x, y: drag.n.y });
    // a proposed box you click, not drag, opens its card
    else if (drag.proposed){
      // a double click on a proposed box with a diagram shows the diagram before anyone presses Apply
      const n = drag.n, twice = lastTap.id === n.id && Date.now() - lastTap.at < DBL;
      lastTap = { id: n.id, at: Date.now() };
      if (twice && n.diagram){ clearTimeout(tapTimer); drag = null; openDiagram(n.id); return; }
      pick(n);
    }
    else {
      const n = drag.n, twice = lastTap.id === n.id && Date.now() - lastTap.at < DBL;
      lastTap = { id: n.id, at: Date.now() };
      if (twice && (n.inside || n.diagram) && !locked(n)){ clearTimeout(tapTimer); drag = null; if (n.inside) enter(n.id); else openDiagram(n.id); return; }
      pick(n);
    }
    drag = null;
  }
  if (panning){ panning = null; canvas.classList.remove('grabbing'); if (!moved){ selected = null; render(); } }
});
canvas.addEventListener('pointerleave', () => act('cursor', { x: null }));
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey){ const z = Math.min(2.5, Math.max(.3, cam.z * (e.deltaY < 0 ? 1.08 : .92))); const [sx, sy] = toStage(e.clientX, e.clientY), r = canvas.getBoundingClientRect(); cam.x = e.clientX - r.left - sx * z; cam.y = e.clientY - r.top - sy * z; cam.z = z; }
  else { cam.x -= e.deltaX; cam.y -= e.deltaY; }
  place();
}, { passive: false });

function enter(id){ view = id; selected = null; render(); fit(); }

  // a change your Claude Code chat proposed, and switching which linked chat the pane follows
  else if (t.closest('[data-applyp]')){ act('apply', { proposal: t.closest('[data-applyp]').dataset.applyp }); toast('Applied to the map. Your Claude chat hears it now.'); }
  else if (t.closest('[data-dropp]')){ act('drop', { proposal: t.closest('[data-dropp]').dataset.dropp }); }
  else if (t.closest('[data-relink]')){ const l = (S.linked || []).find((x) => x.session === t.closest('[data-relink]').dataset.relink); if (l) act('link', { session: l.session, file: l.file }); chatHist = false; chatSeen = -1; }
  else if (t.closest('[data-idea]')){ act('ask', { text: t.closest('[data-idea]').dataset.idea }); }
});
document.addEventListener('submit', (e) => {
  // the Memory pane: new words for an instruction or a memory
  const me = e.target.closest('form[data-memedit]');
  if (me){
    e.preventDefault(); const text = me.querySelector('input').value.trim(); if (!text) return;
    act('editmemory', { id: me.dataset.memedit, text }); memEdit = null; render(); return;
  }
  const r = e.target.closest('form[data-reply], form[data-new]');
  if (r){
    e.preventDefault(); const text = r.querySelector('input').value.trim(); if (!text) return;
    if (r.dataset.reply) act('reply', { id: r.dataset.reply, text });
    else if (draft){ const d = draft; draft = null; pendingOpen = true; act('comment', { ...d, view, text }); }
    r.querySelector('input').value = '';
    return;
  }
  const c = e.target.closest('form[data-chat]');
  if (c){
    e.preventDefault(); const i = c.querySelector('input'), text = i.value.trim();
    if (MIRROR && (text || chatPics.length)){ act('say', { text, images: chatPics }); chatPics = []; i.value = ''; renderChat(); }
    else if (!MIRROR && text){ act('ask', chatAbout ? { text, about: chatAbout } : { text }); chatAbout = null; i.value = ''; }
    return;
  }
  // your own answer to a question with options
  const o = e.target.closest('form[data-other]');
  if (o){ e.preventDefault(); const i = o.querySelector('input'), text = i.value.trim(); if (text){ act('call', { id: o.dataset.other, other: text }); toast('Sent. The chat hears it now.'); i.value = ''; } return; }
  const f = e.target.closest('form[data-ask]'); if (!f) return;
  e.preventDefault(); const i = f.querySelector('input'); const text = i.value.trim(); if (!text) return;
  act('ask', { node: f.dataset.ask, text, side: true }); i.value = '';
  // "visualize this flow": Claude draws it, so the map opens on it
  const fx = flowOf(nodeById(f.dataset.ask));
  if (fx && /flow|visuali|diagram|draw|sequence/i.test(text)) setTimeout(() => openFlow(fx.id), 700);
});
/* pictures for your Claude chat: + picks them, or paste or drop them in the pane, up to five at a time;
   a click on one in the chat opens it large */
const addPics = (files) => {
  const ok = [...files].filter((f) => /^image\/(png|jpeg|gif|webp)$/.test(f.type) && f.size <= 10e6).slice(0, Math.max(0, 5 - chatPics.length));
  Promise.all(ok.map((f) => new Promise((done) => { const r = new FileReader(); r.onload = () => done(r.result); r.onerror = () => done(null); r.readAsDataURL(f); })))
    .then((urls) => { chatPics = [...chatPics, ...urls.filter(Boolean)]; renderChat(); document.querySelector('#chat form[data-chat] input')?.focus(); });
};
document.addEventListener('change', (e) => { if (e.target.matches?.('#chat [data-pick]')) addPics(e.target.files); });
document.addEventListener('paste', (e) => { const f = [...(e.clipboardData?.files || [])]; if (MIRROR && f.length && e.target.closest?.('#chat')){ e.preventDefault(); addPics(f); } });
$('chat').addEventListener('dragover', (e) => { if (MIRROR && e.dataTransfer?.types.includes('Files')){ e.preventDefault(); $('chat').classList.add('drop'); } });
$('chat').addEventListener('dragleave', (e) => { if (!$('chat').contains(e.relatedTarget)) $('chat').classList.remove('drop'); });
$('chat').addEventListener('drop', (e) => { $('chat').classList.remove('drop'); if (MIRROR && e.dataTransfer?.files.length){ e.preventDefault(); addPics(e.dataTransfer.files); } });
document.addEventListener('click', (e) => {
  if (e.target.closest('#chat [data-attach]')) return $('chat').querySelector('[data-pick]')?.click();
  const u = e.target.closest('#chat [data-unpic]'); if (u){ chatPics.splice(Number(u.dataset.unpic), 1); return renderChat(); }
  const img = e.target.closest('#chat .ua img'); if (img){ $('lightbox').innerHTML = `<img src="${img.src}" alt="">`; return $('lightbox').classList.add('on'); }
  if (e.target.closest('#lightbox')) $('lightbox').classList.remove('on');
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('lightbox').classList.remove('on'); });
const when = (t) => { const d = new Date(t), today = new Date().toDateString() === d.toDateString(); return today ? d.toTimeString().slice(0, 5) : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); };

/* History: every change saves itself, and each one is a version (the server's api/history, newest first).
   A version shows the map as it was, over the live one, until Back to now; Restore makes it the map again. */
const fetchHist = () => { const n = ++histAsk; fetch('api/history').then((r) => r.json()).then((h) => { if (n === histAsk){ HIST = h; renderHist(); } }).catch(() => {}); };
const vtime = (t) => { const d = new Date(t), today = d.toDateString() === new Date().toDateString(); return `${today ? 'Today' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}, ${d.toTimeString().slice(0, 5)}`; };
function renderHist(){
  const el = $('hist'), open = railTab === 'history' && !selected;
  el.classList.toggle('on', open);
  // closing History while an earlier version shows goes back to now
  if (!open){ if (PREVIEW) setTimeout(backToNow); return; }
  if (!HIST.length) fetchHist();
  const cur = PREVIEW?.id || HIST[0]?.id;
  el.innerHTML = `<div class="ct"><span>History</span><span class="x" data-close-rail>×</span></div>
    ${HIST.map((v, i) => `<button class="hv ${v.id === cur ? 'on' : ''}" data-hver="${v.id}"><span class="hv-t">${i === 0 ? 'Now' : vtime(v.at)}</span><span class="hv-w">${esc(v.what)}</span></button>`).join('')
      || '<div class="d-wait">No changes yet.</div>'}`;
}
function renderHistBar(){
  const el = $('histbar'); el.classList.toggle('on', !!PREVIEW); document.body.classList.toggle('previewing', !!PREVIEW);
  el.innerHTML = PREVIEW ? `<span class="hb-w">${vtime(PREVIEW.at)} · ${esc(PREVIEW.what)}</span><button class="go" data-hrestore>Restore this version</button><button data-hnow>Back to now</button>` : '';
}
function showVersion(id){
  const v = HIST.find((h) => h.id === id); if (!v) return;
  fetch(`api/history/${id}`).then((r) => r.json()).then((content) => {
    PREVIEW = { ...v, content }; S = { ...LIVE, ...content }; selected = null; renderHistBar(); render();
  }).catch(() => toast('That version could not be opened.'));
}
function backToNow(){ if (!PREVIEW) return; PREVIEW = null; S = LIVE; renderHistBar(); render(); }

let toastT; function toast(t){ $('toast').textContent = t; $('toast').classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => $('toast').classList.remove('on'), 2600); }

/* follow the server */
function listen(){
  const es = new EventSource('api/events');
  let first = true;
  es.addEventListener('state', (m) => {
    const next = JSON.parse(m.data);
    if (drag){ const d = drag.proposed ? proposedBox(drag.n.id, next) : next.nodes.flatMap((n) => [n, ...(n.inside?.nodes || [])]).find((n) => n.id === drag.n.id); if (d){ d.x = drag.n.x; d.y = drag.n.y; drag.n = d; } }
    // a box or flow you are inside that no longer exists sends you back to the system
    const here = view.replace(/^(flow|diagram):/, ''), dg = view.startsWith('diagram:');
    if (view !== 'system' && !next.nodes.flatMap((n) => [n, ...(n.inside?.nodes || [])]).some((n) => n.id === here && (!view.startsWith('flow:') || n.flow) && (!dg || n.diagram))
      && !(dg && proposedBox(here, next)?.diagram)) view = 'system';
    // the comment you just posted opens as a thread
    if (pendingOpen && next.comments?.length){ const mine = next.comments.filter((c) => c.msgs[0].who === ME).at(-1); if (mine) openThread = mine.id; pendingOpen = false; }
    // typing a reply, or the next question to Claude while it is still answering, survives the redraw
    const ae = document.activeElement;
    const typing = ae?.closest?.('#thread, #cpanel, #side, #chat, #mem') ? { sel: ae.id || (ae.closest('#thread') ? '#thread input' : ae.closest('#side') ? '#side form[data-ask] input' : ae.closest('#chat') ? '#chat form[data-chat] input' : null), val: ae.value } : null;
    // an earlier version on show stays on show: the live map waits underneath until Back to now
    LIVE = next; S = PREVIEW ? { ...next, ...PREVIEW.content } : next; render();
    if (railTab === 'history') fetchHist();
    if (typing?.sel){ const el = typing.sel.includes(' ') ? document.querySelector(typing.sel) : $(typing.sel); if (el){ el.value = typing.val; el.focus(); } }
    if (first){ first = false; fit(); }
  });
  es.addEventListener('cursors', (m) => { cursors = JSON.parse(m.data); renderCursors(); });
  // your Claude Code chat, synced into the Claude pane; typing in the pane survives the redraw
  es.addEventListener('mirror', (m) => {
    const v = JSON.parse(m.data); MIRROR = v.owner === ME ? v : null;
    const ae = document.activeElement, typing = ae?.closest?.('#chat') ? ae.value : null;
    renderChat();
    if (typing !== null){ const el = document.querySelector('#chat form[data-chat] input'); if (el){ el.value = typing; el.focus(); } }
  });
  es.addEventListener('here', (m) => { hereNow = JSON.parse(m.data); if (S) renderTop(); });
  es.onerror = () => { es.close(); setTimeout(listen, 1500); };
}
window.addEventListener('resize', fit);
listen();
fetchInbox(); setInterval(fetchInbox, 8000);
</script>
