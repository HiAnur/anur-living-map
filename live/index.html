function renderSide(){
  const el = $('side');
  const n = selected && nodeById(selected);
  el.classList.toggle('on', !!n);
  if (!n) return;
  if (locked(n)){
    const admin = S.people.find((p) => p.role === 'Admin')?.id || 'an admin';
    el.innerHTML = `<div class="ct"><span>${n.label}</span><span class="x" data-close>×</span></div>
      <div class="nope">${ICON.lock}<div><b>You don't have access to ${n.label}.</b><br>Your access covers ${me().sees}. Ask ${admin} to open this one.</div></div>`;
    return;
  }
  const calls = S.calls.filter((c) => c.node === n.id);
  // this box's part of your chats with Claude, earlier chats first: the messages that carry this box, at their place in each chat
  const thread = myChats().flatMap((k) => S.threads[k].map((m, i) => ({ m, i, k }))).filter(({ m }) => m.about === n.id);
  // a box you just opened starts on what is open on it now
  if (sideFor !== n.id){ sideFor = n.id; sideTab = 'box'; backTo = null; }
  // The card answers one question: what is being decided about this box, and what each answer does.
  // Open questions sit on "This box"; once answered they move to "History", with what was picked and why.
  // An open question, short: who asks, the question, and its answers by name, as buttons when it is yours to
  // answer. More opens why Claude asks and what each answer means; "Other…" opens a box for your own words.
  const decision = (c) => {
    const agent = c.from === 'Codex' ? 'Codex' : 'Claude', opts = c.options || [], mine = c.for === ME;
    const more = infoMore.has(`c:${c.id}`), other = infoMore.has(`o:${c.id}`);
    const answers = mine
      ? opts.length
        ? `<div class="d-chips">${opts.map((o) => `<span class="gb" data-call="${c.id}" data-opt="${o.id}" data-label="${o.label}">${o.label}</span>`).join('')}<span class="gb" data-more="o:${c.id}">Other…</span></div>
          ${other ? `<form class="d-other" data-other="${c.id}"><input id="other-${c.id}" placeholder="Say it in your words" autocomplete="off"><button class="gb" type="submit">Send</button></form>` : ''}`
        : `<div class="btns"><span class="gb yes" data-call="${c.id}" data-ans="confirm">Yes</span><span class="gb" data-call="${c.id}" data-ans="dispute">No</span></div>`
      : opts.length ? `<div class="d-list">${opts.map((o) => o.label).join(' · ')}</div>` : '';
    const why = `${c.plain || c.context ? `<div class="d-why">${c.plain || c.context}</div>` : ''}${opts.length
      ? opts.map((o) => `<div class="d-if"><b>${o.label}</b><span>${o.means || ''}</span></div>`).join('')
      : `${c.yes ? `<div class="d-if"><b>Yes</b><span>${c.yes}</span></div>` : ''}${c.no ? `<div class="d-if"><b>No</b><span>${c.no}</span></div>` : ''}`}`;
    return `<div class="d">
      <div class="d-who">${agent} asks ${mine ? 'you' : c.for}${mine ? '' : waitPill([c], 'wpill')}</div>
      <div class="d-q">${c.ask || c.text}</div>
      ${answers}
      ${more ? `<div class="d-x">${why}</div>` : ''}
      <div class="d-morel"><span class="d-more" data-more="c:${c.id}">${more ? 'Less' : 'More'}</span></div>
    </div>`;
  };
  // an answered question in History, short: the question and what was decided; More opens why it was asked,
  // the answers there were to pick from, and what the person said
  const decided = (c) => {
    const agent = c.from === 'Codex' ? 'Codex' : 'Claude', opts = c.options || [], more = histOpen.has(c.id);
    const meant = c.status === 'confirmed' ? c.yes : c.status === 'disputed' ? c.no : c.pickedId === 'other' ? `“${prose(c.picked)}”` : '';
    return `<div class="d done">
      <div class="d-q">${c.ask || c.text}</div>
      <div class="d-ans"><b>${ans(c)}</b>${meant ? `<span> · ${meant}</span>` : ''}</div>
      <div class="d-who">${c.by}, ${c.at}<span class="d-more" data-hist-more="${c.id}">${more ? 'Less' : 'More'}</span></div>
      ${more ? `<div class="d-x">
        <div class="d-who">${agent} asked ${c.for === ME ? 'you' : c.for}</div>
        ${c.plain || c.context ? `<div class="d-why">${c.plain || c.context}</div>` : ''}
        ${opts.length ? `<div class="d-opts">${opts.map((o) => `<div class="d-opt ${c.pickedId === o.id ? 'picked' : ''}"><b>${o.label}</b>${o.means ? `<span>${o.means}</span>` : ''}</div>`).join('')}</div>`
          : `${c.yes ? `<div class="d-if"><b>Yes</b><span>${c.yes}</span></div>` : ''}${c.no ? `<div class="d-if"><b>No</b><span>${c.no}</span></div>` : ''}`}
        ${c.said && c.pickedId !== 'other' ? `<div class="d-said">“${prose(c.said)}”</div>` : ''}
      </div>` : ''}
    </div>`;
  };
  const answered = calls.filter((c) => c.status !== 'open').reverse();
  const history = answered.length ? answered.map(decided).join('')
    : n.decided ? `<div class="dec"><b>${n.decided.what}</b><span class="who">${n.decided.who}, ${n.decided.at}</span></div>`
    : '<div class="d-wait">Nothing has been answered on this box yet.</div>';
  // three tabs: Information (what the box is and what is open on it), History (what was answered), Chat (what you asked
  // Claude about it). Asking opens your one chat with Claude, this box attached.
  const tab = (id, label) => `<span data-side-tab="${id}" class="${sideTab === id ? 'on' : ''}">${label}</span>`;
  const asked = thread.filter(({ m }) => m.who !== 'Claude').length;
  const chat = `${thread.length ? thread.map(({ m, i, k }) => `<div class="msg ${m.who === 'Claude' ? 'cl' : ''}"><b>${m.who === ME ? 'You' : m.who}</b><span class="t">${m.at}</span><br>${m.thinking && !m.text ? '<span class="wait">Reading the map…</span>' : prose(m.text)}${change(m, k, i)}</div>`).join('')
      : '<div class="d-wait">Nothing asked about this box yet.</div>'}
    <div class="btns"><button class="gb yes" data-ask-box="${n.id}">✳ Ask Claude about ${n.label}</button></div>`;
  el.innerHTML = `${backTo ? `<div class="side-back" data-back>‹ Back to ${backTo === 'decisions' ? 'Decisions' : 'Claude'}</div>` : ''}<div class="ct"><span>${n.label}</span><span class="x" data-close>×</span></div>
    <div class="side-tabs">${tab('box', 'Information')}${tab('history', `History${answered.length ? ` · ${answered.length}` : ''}`)}${tab('chat', `Chat${asked ? ` · ${asked}` : ''}`)}</div>
    ${sideTab === 'history' ? history : sideTab === 'chat' ? chat : `
    ${n.sub ? `<div class="d-sub">${n.sub}</div>` : ''}
    ${(() => {
      const lines = String(n.desc && n.desc !== n.sub ? n.desc : '').split('\n').map((l) => l.trim()).filter(Boolean), more = infoMore.has(`n:${n.id}`);
      return `${lines.length ? `<div class="notes"><p class="nt-lead">${prose(lines[0])}</p></div>` : ''}
        ${more ? `${notes(lines.slice(1).join('\n'), false)}${n.fact ? `<div class="h">What Claude found</div><div class="fact">${n.fact.text}<span class="from">${n.fact.from}</span></div>` : ''}` : ''}
        ${lines.length > 1 || n.fact ? `<div class="d-morel nt-more"><span class="d-more" data-more="n:${n.id}">${more ? 'Less' : 'More about this box'}</span></div>` : ''}`;
    })()}
    ${calls.filter((c) => c.status === 'open').map(decision).join('')}
    ${n.inside || flowOf(n) ? `<div class="h">Go deeper</div><div class="btns">${n.inside ? `<button class="gb" data-enter="${n.id}">Open ${n.label} ›</button>` : ''}${flowOf(n) ? `<button class="gb" data-flow="${flowOf(n).id}">See the payment flow ›</button>` : ''}</div>` : ''}
    ${n.file ? `<div class="d-file">${n.file}</div>` : ''}`}`;
}

/* a change Claude proposed in a chat: what it does, in plain words, and Apply; nothing changes until someone presses it */
const change = (m, key, i) => {
  const p = m.proposal; if (!p) return '';
  const head = p.status === 'pending' ? 'Change to the map' : p.status === 'applied' ? `Applied by ${p.by}${p.at ? `, ${p.at}` : ''}` : 'Not applied';
  return `<div class="prop ${p.status}"><div class="ph">${head}</div>
    ${p.ops.length ? `<ul>${p.ops.map((o) => `<li>${prose(o)}</li>`).join('')}</ul>` : ''}
    ${p.dropped.length ? `<div class="pd">Left out: ${p.dropped.map((d) => prose(`${d.text}, ${d.why}`)).join('; ')}</div>` : ''}
    ${p.status === 'pending' ? `<div class="btns"><span class="gb yes" data-apply="${key}|${i}">Apply</span><span class="gb" data-drop="${key}|${i}">Not now</span></div>` : ''}</div>`;
};

/* the chat in the corner: your one thread with Claude, about the whole map or, with a box attached, about that box;
   a message about a box wears its name, and clicking it opens the box. A box you open takes the chat's place. */
let chatOpen = false, chatSeen = 0, chatAbout = null;
// the pane's width follows its left edge as you drag it, between 320px and leaving the map 360px; this browser remembers it
const setChatW = (w) => { w = Math.round(Math.min(Math.max(w, 320), Math.max(320, innerWidth - 72 - 360))); document.body.style.setProperty('--chatw', `${w}px`); fitTools(); return w; };
// the tool bar and Legend, Tidy up and Fit need about 560px side by side
const fitTools = () => document.body.classList.toggle('tight', document.body.classList.contains('chatting') && $('canvas').clientWidth < 560);
window.addEventListener('resize', fitTools);
try { const w = Number(localStorage.getItem('lm.chatw')); if (w) setChatW(w); } catch {}
$('chatgrip').addEventListener('pointerdown', (e) => {
  e.preventDefault(); const g = e.currentTarget; let w = 0;
  g.setPointerCapture(e.pointerId); g.classList.add('on'); document.body.classList.add('resizing');
  const move = (ev) => { w = setChatW(innerWidth - 72 - ev.clientX); };
  const up = () => {
    g.classList.remove('on'); document.body.classList.remove('resizing');
    g.removeEventListener('pointermove', move); g.removeEventListener('pointerup', up); g.removeEventListener('pointercancel', up);
    if (w) try { localStorage.setItem('lm.chatw', String(w)); } catch {}
  };
  g.addEventListener('pointermove', move); g.addEventListener('pointerup', up); g.addEventListener('pointercancel', up);
});
const CHAT_IDEAS = [['What is waiting on me?', 'The questions on this map that need your answer'], ['Sum up this map', 'What it shows, in a few lines']];
// your chats with Claude: earlier ones (threads['@Duy#<when it was put away>']) oldest first, then the one open now (threads['@Duy'])
const chatTime = (k) => parseInt(k.split('#')[1], 36) || 0;
const myChats = () => [...Object.keys(S.threads || {}).filter((k) => k.startsWith(`@${ME}#`)).sort((a, b) => chatTime(a) - chatTime(b)), ...(S.threads?.[`@${ME}`] ? [`@${ME}`] : [])];
// New chat and History sit in the pane's header, like Descript's Underlord
let chatHist = false;
const CHAT_ICON = {
  newchat: '<svg viewBox="0 0 20 20"><path d="M10 3.5H5A1.5 1.5 0 003.5 5v7.5A1.5 1.5 0 005 14h1.5v3l3.5-3h5a1.5 1.5 0 001.5-1.5V10"/><path d="M15 2v5M12.5 4.5h5"/></svg>',
  history: '<svg viewBox="0 0 20 20"><path d="M3.5 3.5h8a1 1 0 011 1v5a1 1 0 01-1 1H7l-3 2.5v-2.5h-.5a1 1 0 01-1-1v-5a1 1 0 011-1z"/><path d="M14.5 7.5H16a1 1 0 011 1v5a1 1 0 01-1 1h-.5V17l-3-2.5h-4a1 1 0 01-1-1V12.5"/></svg>',
};
function chatList(){
  const rows = myChats().reverse().filter((k) => S.threads[k].length).map((k) => {
    const t = S.threads[k], first = t.find((m) => m.who !== 'Claude')?.text || 'A chat with Claude', now = k === `@${ME}`;
    return `<button class="hrow ${now ? 'cur' : ''}" data-openchat="${k}">${prose(first.length > 70 ? `${first.slice(0, 70)}…` : first)}
      <span>${now ? 'Open now' : when(chatTime(k))} · ${t.length} message${t.length === 1 ? '' : 's'}</span></button>`;
  });
  return `<div class="hist"><div class="h" style="margin-top:4px">Your chats on this map</div>${rows.join('') || '<div class="d-wait">No chats yet.</div>'}</div>`;
}
function renderChat(){
  const el = $('chat'), open = chatOpen && !selected;
  el.classList.toggle('on', open); $('bot').classList.toggle('on', chatOpen); document.body.classList.toggle('chatting', open); fitTools();
  if (!open) return;
  const thread = S.threads?.[`@${ME}`] || [], keep = el.querySelector('.msgs')?.scrollTop || 0;
  el.innerHTML = `<div class="ct"><span><span class="star">✳</span>Claude</span><span class="cb">
      <button class="ci" data-newchat title="New chat" aria-label="New chat">${CHAT_ICON.newchat}</button>
      <button class="ci ${chatHist ? 'on' : ''}" data-chathist title="Chat history" aria-label="Chat history">${CHAT_ICON.history}</button>
      <span class="x" data-close-chat>×</span></span></div>
    <div class="msgs">${chatHist ? chatList() : thread.length ? thread.map((m, i) => `<div class="msg ${m.who === 'Claude' ? 'cl' : ''}"><b>${m.who === ME ? 'You' : m.who}</b><span class="t">${m.at}</span><br>${m.about && m.who !== 'Claude' && nodeById(m.about) ? `<span class="about" data-about="${m.about}" title="Open ${nodeById(m.about).label}">${nodeById(m.about).label}</span>` : ''}${m.thinking && !m.text ? '<span class="wait">Reading the map…</span>' : prose(m.text)}${change(m, `@${ME}`, i)}</div>`).join('')
      : `<div class="hello"><div class="ic">✳</div><div class="big">I'm Claude. Ask me anything about ${prose(S.title)}.</div>
        ${CHAT_IDEAS.map(([q, why]) => `<button class="sug" data-idea="${q}">${q}<span>${why}</span></button>`).join('')}</div>`}</div>
    ${chatHist ? '' : chatAbout && nodeById(chatAbout) ? `<div class="att"><span>About</span><b>${nodeById(chatAbout).label}</b><span class="x" data-unattach title="Ask about the whole map instead">×</span></div>` : ''}
    ${chatHist ? '' : `<form class="ask" data-chat><input placeholder="${chatAbout && nodeById(chatAbout) ? `Ask about ${nodeById(chatAbout).label}` : 'Ask about this map'}" autocomplete="off"><button class="gb" type="submit">Ask</button></form>`}`;
  // a new message scrolls the chat to the bottom; any other redraw keeps where you were
  const box = el.querySelector('.msgs'), n = thread.map((m) => m.text).join('').length + thread.length;
  if (n !== chatSeen){ box.scrollTop = box.scrollHeight; chatSeen = n; } else box.scrollTop = keep;
}

/* the rail's Decisions panel: every question answered on this map, newest first: intent made clear, not edits;
   a box's name opens that box on its History tab. One panel shows beside the rail at a time; a box you open takes its place. */
let railTab = null;
// the decision opened in the Decisions panel, by call id: one at a time
const decOpen = new Set();
function renderDecs(){
  const el = $('decs'), open = railTab === 'decisions' && !selected;
  el.classList.toggle('on', open);
  document.querySelectorAll('#rail .ri').forEach((b) => b.classList.toggle('on', b.dataset.rail === railTab && !selected));
  if (!open) return;
  const when = (t) => { const d = new Date(t); return `${d.toDateString() === new Date().toDateString() ? '' : `${d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}, `}${d.toTimeString().slice(0, 5)}`; };
  const logged = (S.log || []).filter((l) => ['confirmed', 'disputed', 'answered'].includes(l.action))
    .map((l) => ({ ...l, c: l.call ? S.calls.find((c) => c.id === l.call) : null })).reverse();
  // an answer the log never held (an older map) still counts, after the logged ones
  const older = S.calls.filter((c) => c.status !== 'open' && !logged.some((l) => l.c === c)).reverse().map((c) => ({ action: c.status, who: c.by, c, node: c.node }));
  const all = [...logged, ...older].filter((r) => canSee(nodeById(r.node || r.c?.node) || {}));
  const at = (r) => r.at ? when(r.at) : r.c?.at || '';
  // the answer, read as a reply: who answered first, as @Name, then the answer, then their words if they added any
  const reply = (who, chip, words) => `<div class="dl-ans"><span class="dl-at" style="color:${pcol(who)}">@${who}</span>${chip ? `<span class="dl-v">${chip}</span>` : ''}${words ? `<span class="dl-said">“${prose(words)}”</span>` : ''}<span class="dl-chev">›</span></div>`;
  // opened: why it was asked, and the way into the box, where its History has the choices
  const detail = (c) => `<div class="dl-x">
      ${c.plain || c.context ? `<div class="h">Why Claude asked</div><p>${c.plain || c.context}</p>` : ''}
      ${nodeById(c.node) ? `<button class="gb" data-about-h="${c.node}">Go to ${nodeById(c.node).label} ›</button>` : ''}
    </div>`;
  el.innerHTML = `<div class="ct"><span>Decisions${all.length ? ` · ${all.length}` : ''}</span><span class="x" data-close-rail>×</span></div>
    <div class="dl-sub">Every question answered on this map, newest first. Click one for why it was asked.</div>
    ${all.length ? all.map((r, i) => {
      const id = r.c?.id || `applied-${r.at || i}`, open = decOpen.has(id);
      const c = r.c || { ask: r.text, status: r.action, by: r.who, node: r.node };
      const own = c.pickedId === 'other', said = own ? c.picked : c.said && c.said !== c.picked ? c.said : '';
      return `<div class="dl ${open ? 'open' : ''}" data-dec="${id}">
        <div class="dl-q"><span class="dl-when">${at(r)}</span>${c.ask || c.text || ''}</div>
        ${reply(r.who || c.by, r.c && !own ? ans(c) : r.c ? '' : r.action, said)}
        ${open && r.c ? detail(c) : ''}</div>`;
    }).join('')
      : '<div class="d-wait">Nothing has been decided on this map yet.</div>'}`;
}

// The Inbox button, with a count when anyone is asking you something, and its list: your questions and the
// comment threads waiting on your reply (you wrote in it, or someone @-named you), this map first, then the others
function renderInbox(){
  const mention = new RegExp(`@${ME}\\b`, 'i');
  const calls = S.calls.filter((c) => c.for === ME && c.status === 'open' && canSee(nodeById(c.node) || {}));
  const talk = (S.comments || []).filter((c) => !c.resolved && (!c.node || canSee(nodeById(c.node) || {})) && c.msgs.at(-1).who !== ME
    && c.msgs.some((m) => m.who === ME || mention.test(m.text)));
  const n = calls.length + talk.length + elsewhere.reduce((k, m) => k + m.items.length, 0);
  const b = $('inboxb');
  b.innerHTML = `<svg viewBox="0 0 20 20"><path d="M3 11h4l1.2 2h3.6L13 11h4M3 11v4.5h14V11l-2.2-6.5H5.2z"/></svg>Inbox${n ? `<span class="n">${n}</span>` : ''}`;
  b.classList.toggle('on', inboxOpen);
  const el = $('inbox'); el.classList.toggle('on', inboxOpen); if (!inboxOpen) return;
  el.style.left = `${Math.max(16, Math.min(b.getBoundingClientRect().left, innerWidth - 396))}px`;
  const here = (c) => `<div class="ib-row" data-goto="${c.id}"><div>${prose(c.msgs.at(-1).text)}</div><div class="on">${c.msgs.at(-1).who} wrote${c.node ? ` · ${nodeById(c.node)?.label || c.node}` : ''}</div></div>`;
  const far = (m, it) => `<a class="ib-row" href="${m.href}?as=${encodeURIComponent(ME)}"><div>${prose(it.text)}</div><div class="on">${it.kind === 'call' ? `${it.from} asks you` : `${it.from} wrote`}${it.on ? ` · ${prose(it.on)}` : ''}</div></a>`;
  el.innerHTML = `<div class="ct"><span>Inbox${n ? ` <span class="ca-n">${n}</span>` : ''}</span><span class="x" data-close-inbox>×</span></div>
    ${n ? '' : '<div class="quiet">Nobody is asking you anything.</div>'}
    ${calls.length || talk.length ? `<div class="ib-map">${prose(S.title)} · this map</div>${calls.map((c) => callRow(c, true)).join('')}${talk.map(here).join('')}` : ''}
    ${elsewhere.map((m) => `<div class="ib-map">${prose(m.title || m.name)}</div>${m.items.map((it) => far(m, it)).join('')}`).join('')}`;
}

function renderPrs(){
  const el = $('prs'); el.classList.toggle('on', prsOpen); if (!prsOpen) return;
  el.innerHTML = `<div class="ct"><span>Pull requests on ${S.title}</span><span class="x" data-close-prs>×</span></div>` + S.prs.map((p) => `<div class="pr"><span class="id">${p.id}</span> ${p.title}<div class="st">${p.agent}, ${p.by} · ${p.status}</div>
    ${p.checks.map((c) => `<div class="chk ${c.ok ? 'ok' : 'bad'}">${c.ok ? '✓' : '✕'} ${c.name}${c.detail ? `<span class="d">${c.detail}</span>` : ''}</div>`).join('')}
    <div class="mono" style="margin-top:6px">${p.files.join(' · ')}</div></div>`).join('');
}

function renderCursors(){
  $('curs').innerHTML = Object.entries(cursors).filter(([who, c]) => who !== ME && c.view === view && Date.now() - c.at < 15000)
    .map(([who, c]) => `<div class="cur" style="transform:translate(${c.x}px,${c.y}px)"><svg width="16" height="20" viewBox="0 0 16 20"><path d="M1 1L1 16L5 12L8 19L11 18L8 11L14 11Z" fill="${pcol(who)}" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg><span class="tag" style="background:${pcol(who)}">${who}</span></div>`).join('');
}

/* comments */
let tool = 'select', openThread = null, draft = null, panelQuery = '', pendingOpen = false, showResolved = false, lit = null;
document.addEventListener('input', (e) => { if (e.target.id === 'cpq'){ panelQuery = e.target.value; renderComments(); const q = $('cpq'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); } });
document.addEventListener('keydown', (e) => { if (e.key === 'c' && !e.target.closest('input, textarea')) setTool(tool === 'comment' ? 'select' : 'comment'); if (e.key === 'Escape'){ draft = null; openThread = null; render(); } });
const ago = (t) => { const s = Math.max(0, Math.round((Date.now() - t) / 1000)); if (s < 60) return 'just now'; const m = Math.round(s / 60); if (m < 60) return `${m} minute${m === 1 ? '' : 's'} ago`; const h = Math.round(m / 60); return `${h} hour${h === 1 ? '' : 's'} ago`; };
const av = (who) => `<span class="av" style="background:${pcol(who)}">${who[0]}</span>`;
const mention = (t) => t.replace(/@(\w+)/g, '<span class="at">$1</span>');
// a resolved comment leaves the map, as in Figma; the panel keeps it behind "Show resolved"
const visibleComments = () => (S.comments || []).filter((c) => c.view === view && (!c.resolved || showResolved) && (!c.node || !locked(nodeById(c.node) || {})));
function renderComments(){
  const pins = visibleComments().map((c) => `<div class="pinc ${openThread === c.id ? 'on' : ''} ${c.resolved ? 'done' : ''}" data-pin="${c.id}" style="left:${c.x}px;top:${c.y}px">${`<i style="background:${pcol(c.msgs[0].who)}">${c.msgs[0].who[0]}</i>`}${c.msgs.length > 1 ? `<span class="cnt">${c.msgs.length}</span>` : ''}</div>`);
  if (draft) pins.push(`<div class="pinc on" style="left:${draft.x}px;top:${draft.y}px"><i style="background:${pcol(ME)}">${ME[0]}</i></div>`);
  $('pins').innerHTML = pins.join('');
  // the open thread, or the box for a new one, beside its pin
  const th = $('thread');
  const c = openThread && (S.comments || []).find((x) => x.id === openThread);
  if (!c && !draft){ th.classList.remove('on'); }
  else {
    const p = c || draft;
    th.classList.toggle('draft', !c);
    th.innerHTML = c ? `<div class="th-head">Comment<span class="sp"></span><span class="ib ${c.resolved ? 'done' : ''}" data-resolve="${c.id}" title="${c.resolved ? 'Reopen' : 'Resolve'}">✓</span><span class="ib" data-close-th title="Close">✕</span></div>
      <div class="th-body">${c.msgs.map((m) => `<div class="th-msg">${av(m.who)}<div><span class="who">${m.who}</span><span class="ago">${ago(m.at)}</span><div class="tx">${mention(m.text)}</div></div></div>`).join('')}</div>
      <form class="th-reply" data-reply="${c.id}">${av(ME)}<input placeholder="Reply" autocomplete="off"><button type="submit" title="Send">↑</button></form>`
      // a new comment is one row beside its pin, the way Figma opens it
      : `<form class="th-reply" data-new><input placeholder="Add a comment" autocomplete="off"><button type="submit" title="Post">↑</button></form>`;
    th.classList.add('on');
    // its top sits level with the pin's top, just right of the pin; left of it if there is no room, and kept on screen
    const r = canvas.getBoundingClientRect(), px = p.x * cam.z + cam.x + r.left, py = p.y * cam.z + cam.y + r.top;
    const w = th.offsetWidth, h = th.offsetHeight, pinH = 30;
    let left = px + 36, top = py - pinH;
    if (left + w > innerWidth - 12) left = px - w - 8;
    top = Math.max(r.top + 8, Math.min(innerHeight - h - 12, top));
    th.style.left = left + 'px'; th.style.top = top + 'px';
    if (draft) setTimeout(() => th.querySelector('input')?.focus(), 0);
  }
  // every thread in the panel, newest first
  const cp = $('cpanel'), listOn = railTab === 'comments' && !selected; cp.classList.toggle('on', listOn);
  if (listOn){
    const q = panelQuery.toLowerCase();
    const all = (S.comments || []).filter((x) => !x.node || !locked(nodeById(x.node) || {})).filter((x) => showResolved || !x.resolved).filter((x) => !q || x.msgs.some((m) => (m.text + m.who).toLowerCase().includes(q))).slice().reverse();
    const nResolved = (S.comments || []).filter((x) => x.resolved).length;
    cp.innerHTML = `<div class="cp-head"><input id="cpq" placeholder="Search" value="${panelQuery.replace(/"/g, '&quot;')}"><span class="x" data-close-cp title="Close">×</span></div>
      ${nResolved ? `<label class="cp-res"><input type="checkbox" id="cpres" ${showResolved ? 'checked' : ''}> Show resolved (${nResolved})</label>` : ''}
      <div class="cp-list">${all.length ? all.map((x) => `<div class="cp-item ${openThread === x.id ? 'on' : ''} ${x.resolved ? 'done' : ''}" data-goto="${x.id}">
        <div class="cp-top">${av(x.msgs[0].who)}<span class="cp-acts"><span class="ib" data-resolve="${x.id}" title="${x.resolved ? 'Reopen' : 'Resolve'}"><svg viewBox="0 0 22 22"><circle cx="11" cy="11" r="8.25"/><path d="M7.6 11.2l2.4 2.4 4.4-4.8"/></svg></span></span></div>
        <div class="meta">#${x.id} · ${x.node ? nodeById(x.node)?.label || x.node : x.view === 'system' ? 'System' : nodeById(x.view)?.label}${x.resolved ? ' · resolved' : ''}</div>
        <div class="by"><span class="who">${x.msgs[0].who}</span><span class="ago">${ago(x.msgs[0].at)}</span></div><div class="tx">${mention(x.msgs[0].text)}</div>
        ${x.msgs.length > 1 ? `<div class="rp">${x.msgs.length - 1} repl${x.msgs.length === 2 ? 'y' : 'ies'}</div>` : ''}</div>`).join('') : '<div class="cp-empty">No comments yet. Pick the comment tool and click anywhere on the map.</div>'}</div>`;
  }
  // a red dot on the tool while any thread is open and unresolved
  const tb = document.querySelector('[data-tool="comment"]');
  const unread = (S.comments || []).some((x) => !x.resolved && x.msgs.at(-1).who !== ME);
  for (const b of [tb, document.querySelector('#rail [data-rail="comments"]')]) if (b){ b.querySelector('.dot')?.remove(); if (unread) b.insertAdjacentHTML('beforeend', '<span class="dot"></span>'); }
  canvas.classList.toggle('commenting', tool === 'comment');
}
function setTool(t){ tool = t; document.querySelectorAll('.tb').forEach((x) => x.classList.toggle('on', x.dataset.tool === t)); if (t !== 'comment') draft = null; render(); }

/* pan, zoom, drag */
let drag = null, panning = null, moved = false;
canvas.addEventListener('pointerdown', (e) => {
  const pin = e.target.closest('.pinc');
  if (pin){ if (pin.dataset.pin){ openThread = openThread === Number(pin.dataset.pin) ? null : Number(pin.dataset.pin); draft = null; render(); } return; }
  // the Expand pill opens the box here: the canvas captures the pointer, so a
  // click event would land on the canvas, not on the pill
  const ex = e.target.closest('.expand');
  if (ex){ enter(ex.dataset.expand); return; }
  const nd = e.target.closest('.node');
  moved = false;
  // the comment tool drops a pin where you click, on a box or on the canvas
  if (tool === 'comment'){
    const [sx, sy] = toStage(e.clientX, e.clientY);
    const n = nd && nodeById(nd.dataset.id);
    if (n && locked(n)){ toast(`You don't have access to ${n.label}.`); return; }
    draft = { x: Math.round(sx), y: Math.round(sy), node: n?.id || null }; openThread = null; render(); return;
  }
  if (nd){
    const n = nodeById(nd.dataset.id);
    // a locked box opens its "no access" card and never moves
    if (locked(n)){ selected = selected === n.id ? null : n.id; render(); return; }
    const [sx, sy] = toStage(e.clientX, e.clientY); drag = { n, dx: n.x - sx, dy: n.y - sy };
  }
  else { panning = { x: e.clientX - cam.x, y: e.clientY - cam.y }; canvas.classList.add('grabbing'); }
  canvas.setPointerCapture(e.pointerId);
});
let lastCur = 0;
canvas.addEventListener('pointermove', (e) => {
  const [sx, sy] = toStage(e.clientX, e.clientY);
  if (drag){ moved = true; drag.n.x = Math.round(sx + drag.dx); drag.n.y = Math.round(sy + drag.dy); render(); }
  else if (panning){ moved = true; cam.x = e.clientX - panning.x; cam.y = e.clientY - panning.y; place(); }
  if (Date.now() - lastCur > 50){ lastCur = Date.now(); act('cursor', { x: Math.round(sx), y: Math.round(sy), view }); }
});
// a double click is two taps on the same box within 350ms: the first tap
// redraws the box, so the browser's own dblclick never sees the same element
let lastTap = { id: null, at: 0 };
canvas.addEventListener('pointerup', (e) => {
  if (drag){
    if (moved) act('move', { id: drag.n.id, x: drag.n.x, y: drag.n.y });
    else {
      const n = drag.n, twice = lastTap.id === n.id && Date.now() - lastTap.at < 350;
      lastTap = { id: n.id, at: Date.now() };
      if (twice && n.inside && !locked(n)){ drag = null; enter(n.id); return; }
      selected = selected === n.id ? null : n.id; render();
    }
    drag = null;
  }
  if (panning){ panning = null; canvas.classList.remove('grabbing'); if (!moved){ selected = null; render(); } }
});
canvas.addEventListener('pointerleave', () => act('cursor', { x: null }));
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey){ const z = Math.min(2.5, Math.max(.3, cam.z * (e.deltaY < 0 ? 1.08 : .92))); const [sx, sy] = toStage(e.clientX, e.clientY), r = canvas.getBoundingClientRect(); cam.x = e.clientX - r.left - sx * z; cam.y = e.clientY - r.top - sy * z; cam.z = z; }
  else { cam.x -= e.deltaX; cam.y -= e.deltaY; }
  place();
}, { passive: false });

function enter(id){ view = id; selected = null; render(); fit(); }
// Esc steps back out of a box
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && view !== 'system' && !e.target.closest('input')) enter('system'); });
document.addEventListener('click', (e) => {
  const t = e.target;
  // the people menu closes on any click outside it
  if (peopleOpen && !t.closest('#faces')){ peopleOpen = false; renderTop(); }
  const face = t.closest('[data-as]');
  if (face && face.dataset.as !== ME){ const q = new URLSearchParams(location.search); q.set('as', face.dataset.as); location.search = q.toString(); return; }
  if (t.closest('[data-signout]')){ fetch('/api/logout', { method: 'POST' }).finally(() => { location.href = `/login?next=${encodeURIComponent(location.pathname)}`; }); return; }
  if (t.dataset.v === 'system'){ view = 'system'; selected = null; render(); fit(); }
  else if (t.dataset.enter){ enter(t.dataset.enter); }
  else if (t.dataset.flow){ openFlow(t.dataset.flow); }
  else if (t.hasAttribute('data-close')){ selected = null; backTo = null; render(); }
  else if (t.closest('[data-back]')){ const to = backTo; backTo = null; selected = null; render(); if (to === 'decisions') $('decs').scrollTop = decsScroll; }
  else if (t.dataset.sideTab){ sideTab = t.dataset.sideTab; render(); }
  else if (t.closest('[data-hist-more]')){ const id = t.closest('[data-hist-more]').dataset.histMore; histOpen.has(id) ? histOpen.delete(id) : histOpen.add(id); render(); }
  // "Other…" on a question in the corner opens its box, ready for your own words
  else if (t.closest('[data-more]')){ const k = t.closest('[data-more]').dataset.more; infoMore.has(k) ? infoMore.delete(k) : infoMore.add(k); render(); if (k.startsWith('o:') && infoMore.has(k)) $(`other-${k.slice(2)}`)?.focus(); }
  else if (t.dataset.otherPick){ const c = S.calls.find((x) => x.id === t.dataset.otherPick); if (c){ selected = c.node; sideFor = c.node; sideTab = 'box'; infoMore.add(`o:${c.id}`); render(); $(`other-${c.id}`)?.focus(); } }
  else if (t.closest('[data-call-row]') && !t.closest('.gb')){
    // the call opens in place; its box lights up on the map, and no other card opens
    const row = t.closest('[data-call-row]'), id = row.dataset.callRow;
    expanded = expanded === id ? null : id;
    lit = expanded ? row.dataset.node : null;
    render();
  }
  else if (t.hasAttribute('data-close-prs')){ prsOpen = false; render(); }
  else if (t.closest('[data-call]')){
    const b = t.closest('[data-call]'), o = b.dataset.opt; b.classList.add('pressed');
    act('call', o ? { id: b.dataset.call, option: o } : { id: b.dataset.call, answer: b.dataset.ans });
    toast(o ? `Picked “${b.dataset.label}”. The chat hears it now.` : `${b.dataset.ans === 'confirm' ? 'Confirmed' : 'Disputed'}. The chat hears it now.`);
  }
  else if (t.closest('#peopleb')){ peopleOpen = !peopleOpen; renderTop(); }
  else if (t.id === 'shareb'){ shareOpen = true; renderShare(); }
  else if (t.id === 'sharebg' || t.closest('[data-close-share]')){ shareOpen = false; renderShare(); }
  else if (t.closest('#inboxb')){ inboxOpen = !inboxOpen; if (inboxOpen) fetchInbox(); render(); }
  else if (t.closest('[data-close-inbox]')){ inboxOpen = false; render(); }
  else if (t.closest('#menub')){ drawerOpen = !drawerOpen; renderDrawer(); }
  else if (t.id === 'saveb' || t.closest('[data-save]')){ act('save'); toast('Map saved'); drawerOpen = true; }
  else if (t.closest('[data-unsave]')){ act('unsave', { id: t.closest('[data-unsave]').dataset.unsave }); toast('Saved map deleted'); }
  else if (t.closest('[data-unsession]')){ act('unsession', { id: t.closest('[data-unsession]').dataset.unsession }); toast('Session deleted. Its boxes stay on the map.'); }
  else if (t.closest('[data-load]')){ act('load', { id: t.closest('[data-load]').dataset.load }); view = 'system'; selected = null; expanded = null; lit = null; setTimeout(fit, 400); toast('Opened the saved map'); }
  else if (t.closest('[data-session]')){ view = 'system'; selected = null; drawerOpen = false; render(); fit(); }
  else if (t.closest('[data-resolve]')){
    const id = Number(t.closest('[data-resolve]').dataset.resolve), c = S.comments.find((x) => x.id === id);
    act('resolve', { id });
    // resolving closes the thread and takes the pin off the map; reopening keeps it open
    if (c && !c.resolved){ openThread = null; render(); toast('Comment resolved'); }
  }
  else if (t.id === 'cpres'){ showResolved = t.checked; render(); }
  else if (t.closest('[data-close-th]')){ openThread = null; draft = null; render(); }
  else if (t.closest('[data-close-cp]')){ railTab = null; render(); }
  else if (t.closest('[data-goto]')){
    const c = S.comments.find((x) => x.id === Number(t.closest('[data-goto]').dataset.goto));
    if (c){ if (c.view !== view){ view = c.view; } openThread = c.id; draft = null;
      const r = canvas.getBoundingClientRect(); cam.x = (r.width - 340) / 2 - c.x * cam.z; cam.y = r.height / 2 - c.y * cam.z; place(); render(); }
  }
  // Ask Claude, in the tool bar or on a box card, opens your one chat; with a box open, that box comes attached
  else if (t.closest('[data-ask-box]')){
    chatAbout = t.closest('[data-ask-box]')?.dataset.askBox || selected || chatAbout;
    selected = null; chatOpen = true; railTab = null; chatSeen = -1; render(); $('chat').querySelector('input')?.focus();
  }
  else if (t.closest('[data-unattach]')){ chatAbout = null; render(); $('chat').querySelector('input')?.focus(); }
  // a message's box name opens that box, on its Chat tab
  else if (t.closest('[data-about]')){ const id = t.closest('[data-about]').dataset.about; if (nodeById(id)){ backTo = chatOpen && !selected ? 'chat' : null; selected = id; sideFor = id; sideTab = 'chat'; render(); centerOn(id); } }
  else if (t.closest('.tb')){ const b = t.closest('.tb'); setTool(tool === b.dataset.tool && b.dataset.tool === 'comment' ? 'select' : b.dataset.tool); }
  else if (t.id === 'tidyb'){ if (!view.startsWith('flow:')) act('tidy', { view }); }
  else if (t.id === 'fitb'){ fit(); }
  else if (t.id === 'zoomin' || t.id === 'zoomout'){ zoomBy(t.id === 'zoomin' ? 1.2 : 1 / 1.2); }
  else if (t.closest('[data-rail]')){ const r = t.closest('[data-rail]').dataset.rail; railTab = railTab === r && !selected ? null : r; if (railTab){ selected = null; chatOpen = false; } render(); }
  else if (t.closest('[data-close-rail]')){ railTab = null; render(); }
  // a box's name in Decisions opens that box on its History tab
  else if (t.closest('[data-dec]') && !t.closest('[data-about-h]') && !t.closest('.dl-x')){ const id = t.closest('[data-dec]').dataset.dec, was = decOpen.has(id); decOpen.clear(); if (!was) decOpen.add(id); render(); }
  else if (t.closest('[data-about-h]')){ const id = t.closest('[data-about-h]').dataset.aboutH; if (nodeById(id)){ backTo = railTab === 'decisions' && !selected ? 'decisions' : null; if (backTo) decsScroll = $('decs').scrollTop; selected = id; sideFor = id; sideTab = 'history'; render(); centerOn(id); } }
  else if (t.closest('#bot')){ chatOpen = !(chatOpen && !selected); if (chatOpen){ selected = null; railTab = null; } chatSeen = -1; render(); if (chatOpen) $('chat').querySelector('input')?.focus(); }
  else if (t.closest('[data-close-chat]')){ chatOpen = false; render(); }
  // New chat keeps the one you had in your history; History lists your chats, and a click reopens one
  else if (t.closest('[data-newchat]')){ if ((S.threads?.[`@${ME}`] || []).length) act('newchat'); chatHist = false; chatAbout = null; chatSeen = -1; render(); }
  else if (t.closest('[data-chathist]')){ chatHist = !chatHist; chatSeen = -1; render(); }
  else if (t.closest('[data-openchat]')){ const k = t.closest('[data-openchat]').dataset.openchat; if (k !== `@${ME}`) act('openchat', { chat: k }); chatHist = false; chatSeen = -1; render(); }
  else if (t.closest('[data-rename]')){
    t.closest('[data-rename]').outerHTML = `<input id="renamei" value="${esc(S.title)}" maxlength="60" aria-label="Map name" autocomplete="off">`;
    renaming = true; $('renamei').focus(); $('renamei').select();
  }
  else if (t.closest('[data-apply]')){ const [thread, index] = t.closest('[data-apply]').dataset.apply.split('|'); act('apply', { thread, index: Number(index) }); toast('Applied to the map. The chat that drew it hears it now.'); }
  else if (t.closest('[data-drop]')){ const [thread, index] = t.closest('[data-drop]').dataset.drop.split('|'); act('drop', { thread, index: Number(index) }); }
  else if (t.closest('[data-idea]')){ act('ask', { text: t.closest('[data-idea]').dataset.idea }); }
});
document.addEventListener('submit', (e) => {
  const r = e.target.closest('form[data-reply], form[data-new]');
  if (r){
    e.preventDefault(); const text = r.querySelector('input').value.trim(); if (!text) return;
    if (r.dataset.reply) act('reply', { id: r.dataset.reply, text });
    else if (draft){ const d = draft; draft = null; pendingOpen = true; act('comment', { ...d, view, text }); }
    r.querySelector('input').value = '';
    return;
  }
  const c = e.target.closest('form[data-chat]');
  if (c){ e.preventDefault(); const i = c.querySelector('input'), text = i.value.trim(); if (text){ act('ask', chatAbout ? { text, about: chatAbout } : { text }); chatAbout = null; i.value = ''; } return; }
  // your own answer to a question with options
  const o = e.target.closest('form[data-other]');
  if (o){ e.preventDefault(); const i = o.querySelector('input'), text = i.value.trim(); if (text){ act('call', { id: o.dataset.other, other: text }); toast('Sent. The chat hears it now.'); i.value = ''; } return; }
  const f = e.target.closest('form[data-ask]'); if (!f) return;
  e.preventDefault(); const i = f.querySelector('input'); const text = i.value.trim(); if (!text) return;
  act('ask', { node: f.dataset.ask, text }); i.value = '';
  // "visualize this flow": Claude draws it, so the map opens on it
  const fx = flowOf(nodeById(f.dataset.ask));
  if (fx && /flow|visuali|diagram|draw|sequence/i.test(text)) setTimeout(() => openFlow(fx.id), 700);
});
/* the menu: sessions that drew on this map, newest first, and saved copies of it */
let drawerOpen = false;
const when = (t) => { const d = new Date(t), today = new Date().toDateString() === d.toDateString(); return today ? d.toTimeString().slice(0, 5) : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); };
function renderDrawer(){
  const el = $('drawer'); el.classList.toggle('on', drawerOpen); $('menub').classList.toggle('on', drawerOpen);
  if (!drawerOpen || !S) return;
  const ss = S.sessions || [], sv = S.saves || [];
  el.innerHTML = `<div class="dh">Sessions</div>
    ${ss.length ? ss.map((s, i) => `<div class="dsave"><button class="di ${i === 0 ? 'latest' : ''}" data-session="${s.id}"><b>${s.ticket || 'Plan'}${s.chat ? ` · ${s.chat}` : ''}</b><span><span class="ag">✳ ${s.agent}</span> drew ${s.boxes} box${s.boxes === 1 ? '' : 'es'}, ${s.calls} question${s.calls === 1 ? '' : 's'} · ${when(s.at)}</span></button><button class="dx" data-unsession="${s.id}" title="Delete this session from the list; its boxes stay on the map" aria-label="Delete this session">✕</button></div>`).join('')
      : '<div class="dnone">No session has drawn on this map yet. Plan a ticket in Claude Code and it shows here.</div>'}
    <div class="dh" style="margin-top:14px">Saved maps <span class="gb" data-save>Save now</span></div>
    ${sv.length ? sv.map((s) => `<div class="dsave"><button class="di" data-load="${s.id}" title="Open this saved map for everyone"><b>${s.name}</b><span>${s.by} · ${when(s.at)} · ${s.boxes} boxes${s.open ? `, ${s.open} open` : ''}</span></button><button class="dx" data-unsave="${s.id}" title="Delete this saved map" aria-label="Delete ${s.name}">✕</button></div>`).join('')
      : '<div class="dnone">Nothing saved yet.</div>'}`;
}

let toastT; function toast(t){ $('toast').textContent = t; $('toast').classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => $('toast').classList.remove('on'), 2600); }

/* follow the server */
function listen(){
  const es = new EventSource('api/events');
  let first = true;
  es.addEventListener('state', (m) => {
    const next = JSON.parse(m.data);
    if (drag){ const d = next.nodes.flatMap((n) => [n, ...(n.inside?.nodes || [])]).find((n) => n.id === drag.n.id); if (d){ d.x = drag.n.x; d.y = drag.n.y; drag.n = d; } }
    // a box or flow you are inside that no longer exists sends you back to the system
    const here = view.startsWith('flow:') ? view.slice(5) : view;
    if (view !== 'system' && !next.nodes.flatMap((n) => [n, ...(n.inside?.nodes || [])]).some((n) => n.id === here && (!view.startsWith('flow:') || n.flow))) view = 'system';
    // the comment you just posted opens as a thread
    if (pendingOpen && next.comments?.length){ const mine = next.comments.filter((c) => c.msgs[0].who === ME).at(-1); if (mine) openThread = mine.id; pendingOpen = false; }
    // typing a reply, or the next question to Claude while it is still answering, survives the redraw
    const ae = document.activeElement;
    const typing = ae?.closest?.('#thread, #cpanel, #side, #chat') ? { sel: ae.id || (ae.closest('#thread') ? '#thread input' : ae.closest('#side') ? '#side form[data-ask] input' : ae.closest('#chat') ? '#chat form[data-chat] input' : null), val: ae.value } : null;
    S = next; render();
    if (typing?.sel){ const el = typing.sel.includes(' ') ? document.querySelector(typing.sel) : $(typing.sel); if (el){ el.value = typing.val; el.focus(); } }
    if (first){ first = false; fit(); }
  });
  es.addEventListener('cursors', (m) => { cursors = JSON.parse(m.data); renderCursors(); });
  es.onerror = () => { es.close(); setTimeout(listen, 1500); };
}
window.addEventListener('resize', fit);
listen();
fetchInbox(); setInterval(fetchInbox, 8000);
</script>
