<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Living Map Demo · Scenario 2</title>
<style>
:root{
  --bg:#0c0e11; --hair:#22262c;
  --green:#3fb37f; --red:#e5534b; --amber:#d9a054; --grey:#4b515a; --purple:#a78bfa;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
  --ease: cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:#d6d9de;overflow:hidden;user-select:none;cursor:default}
#app{display:flex;height:100vh}

/* chat: the Claude desktop app's Code tab, a long way down */
#chat{width:40%;border-right:1px solid #2b2a27;background:#262624;color:#e8e6e1;display:flex;flex-direction:column;font:14px/1.55 var(--sans)}
.chead{height:40px;flex:none;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid #31302d;font-size:13px;color:#c9c6be}
.chead .br{color:#86837b;font:12px var(--mono)}
#msgs{flex:1;overflow:hidden;padding:22px 22px 4px;display:flex;flex-direction:column;gap:14px}
.bubble{align-self:flex-end;max-width:82%;background:#3a3935;color:#f3f1ec;border-radius:14px;padding:8px 13px}
.divider{font-size:11.5px;color:#6b6861;text-align:center;border-top:1px solid #35342f;padding-top:8px}
.tools{display:flex;flex-direction:column;gap:3px;border-left:1px solid #3d3c38;padding:2px 0 2px 12px;margin-left:2px}
.tool{font-size:12.5px;display:flex;gap:8px;align-items:baseline}
.tool .v{color:#bdb9b0;font-weight:500;min-width:34px}
.tool .p{font:12px var(--mono);color:#a29e95}
.tool .x{font:11.5px var(--mono);color:#7fae8a}
.anim{animation:fadein .3s ease-out}
.composer{flex:none;margin:12px 18px 18px;background:#30302e;border:1px solid #3e3d39;border-radius:16px;padding:12px 14px 10px}
.field{min-height:22px;color:#f3f1ec}
.ph{color:#7d7a72}
.composer.has .ph{display:none}
.caret{display:inline-block;width:1.5px;height:1.1em;background:#e8e6e1;vertical-align:-.2em;animation:blink 1s steps(1) infinite}
.crow{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:#8a877f}
.send{width:26px;height:26px;border-radius:8px;background:#c96442;color:#fff;display:grid;place-items:center;font-size:14px;opacity:.45}
.working{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#8a877f}
.spin{width:12px;height:12px;border:1.5px solid #4a4944;border-top-color:#e8e6e1;border-radius:50%;animation:spin .8s linear infinite}
.frommap{font-size:12.5px;color:#b8a6f0}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

/* map, inside the app's browser pane */
#map{width:60%;display:flex;flex-direction:column;background:#1f1e1d}
.bbar{height:40px;flex:none;display:flex;align-items:center;gap:12px;padding:0 12px;border-bottom:1px solid #2b2a27;color:#6f6c65;font:14px var(--sans)}
.url{flex:1;background:#2a2927;border-radius:7px;padding:4px 12px;font-size:12px;color:#a8a49b}
#canvas{flex:1;position:relative;overflow:hidden;background-color:#0d0f12;
  background-image:radial-gradient(circle,#1a1e24 1px,transparent 1.3px);background-size:24px 24px}
#canvas.notrans *{transition:none !important}

/* level 1: the mind map, with what waits on you pinned on top */
#tree{position:absolute;left:50%;top:50%;width:880px;height:660px;transition:opacity .4s ease-out}
#tree.off{pointer-events:none}
#tree.dim{opacity:.22}
#treeIn{position:absolute;inset:0;transition:transform .45s var(--ease),opacity .4s ease-out}
#treeIn.zoom{transform:scale(2.6);opacity:0}
#tedges{position:absolute;left:0;top:0;width:880px;height:660px;overflow:visible}
#tedges path{fill:none;stroke:#555d68;stroke-width:1.6;transition:opacity .3s ease-out}
.tn{position:absolute;transform:translateY(-50%);display:flex;gap:9px;align-items:flex-start;padding:6px 12px 6px 9px;
  background:#15181d;border:1px solid #343a42;border-radius:8px;transition:background .3s ease-out,border-color .3s ease-out}
.tn.root{padding:8px 16px}
.tn.root .tt{font-weight:600;font-size:14px;color:#eef0f3}
.tn .tt{font:13px/1.35 var(--sans);color:#d6d9de;white-space:nowrap}
.tn .td{font:11px/1.35 var(--sans);color:#8fb8a0;white-space:nowrap;margin-top:1px}
.tn .gp{position:absolute;top:calc(100% + 6px);left:0;white-space:nowrap;font:11px/1.5 var(--sans);color:#a9b4ad;
  background:#0f1512;border:1px solid rgba(63,179,127,.6);border-radius:999px;padding:1px 9px}
.tn.fresh .td{color:#c2ab7a}
.tn.fresh.built{border-color:var(--green);background:#111a15}
.tn.fresh.built .td{color:#8fb8a0}
.tn.hl{background:#262038}
.tn.old .tt,.tn.old .td{color:#7d848d}
.tn .q{position:absolute;top:-9px;right:-8px;width:18px;height:18px;border-radius:50%;background:var(--amber);color:#0d0f12;
  font:700 12px/18px var(--sans);text-align:center;transition:opacity .3s ease-out}
.tn .q.off{opacity:0}
.strip{position:absolute;left:50%;top:26px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;
  background:#1a1711;border:1px solid var(--amber);border-radius:10px;padding:8px 14px;font:12.5px/1.4 var(--sans);color:#ebe6dc;white-space:nowrap;
  transition:opacity .35s ease-out,background .3s ease-out}
.strip b{color:#e0b26a;font-weight:600}
.strip .go{color:#8a877f;font-size:11.5px}
.strip.hl{background:#2b2416}
.strip.off{opacity:0}

.cb{width:16px;height:16px;border:1.5px solid #4b515a;border-radius:4px;margin-top:2px;flex:none;display:grid;place-items:center;font:700 11px/1 var(--sans);color:#0d0f12}
.cb.done{background:var(--green);border-color:var(--green)}
.cb.busy{border-color:#3a4048;border-top-color:var(--purple);border-radius:50%;background:transparent;animation:spin .8s linear infinite}
.cb.ask{border-color:var(--amber);color:var(--amber);background:transparent;font-size:10px}

/* level 2: the branch opened, with the question where it blocks the path */
#stage{position:absolute;left:50%;top:50%;width:880px;height:660px;opacity:0;transition:opacity .4s ease-out}
#stage.on{opacity:1}
#edges{position:absolute;left:0;top:0;width:880px;height:660px;overflow:visible}
#edges path{fill:none;transition:opacity .3s ease-out, stroke .35s ease-out}
path.flow{stroke:#3d434b;stroke-width:1.4}
path.flow.blocked{stroke:#2a2f36;stroke-dasharray:4 4}
path.cedge{stroke:#4b515a;stroke-width:1.4}
path.cedge.ask{stroke:var(--amber)}
path.cedge.green{stroke:var(--green)}
path.rel{stroke:#4b515a;stroke-width:1.4;stroke-dasharray:4 4}

.abs{position:absolute;transform:translate(-50%,-50%)}
.fade{opacity:0;transition:opacity .35s ease-out}
.fade.on{opacity:1}
.crumb{left:75px;transform:translateY(-50%);display:flex;align-items:center;gap:8px;font:13px var(--sans);color:#6b727b;white-space:nowrap}
.crumb b{font-weight:500;color:#eef0f3;font-size:14px}
.node{display:flex;align-items:center;gap:8px;background:#15181d;border:1px solid #343a42;border-radius:8px;padding:6px 13px 6px 10px;font:13px/1.4 var(--sans);color:#c9cfd6;white-space:nowrap}
.node .cb{width:14px;height:14px;margin-top:0;font-size:10px}
.note{font:11px/1.4 var(--sans);color:#6b727b;white-space:nowrap}

.xf{display:grid}
.xf>span{grid-area:1/1;transition:opacity .35s ease-out}
.xf>.b{opacity:0}
.xf.alt>.a{opacity:0}
.xf.alt>.b{opacity:1}

/* the question card: amber while it waits on you, green once you answer */
.qcard{width:270px;background:#1a1711;border:1.5px solid var(--amber);border-radius:10px;padding:9px 11px 8px;font:12.5px/1.4 var(--sans);color:#ebe6dc;
  box-shadow:0 0 0 3px rgba(217,160,84,.1);opacity:0;transform:translate(-50%,-50%) translate(0,var(--dy)) scale(.94);
  transition:transform .4s var(--ease),opacity .32s ease-out,border-color .35s ease-out,background .35s ease-out,box-shadow .35s ease-out}
.qcard.on{opacity:1;transform:translate(-50%,-50%) translate(0,0) scale(1)}
.qcard.green{border-color:var(--green);background:#111a15;box-shadow:0 0 0 3px rgba(63,179,127,.1)}
.qcard .lab{font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:#e0b26a}
.qcard .lab .b{color:#8fd3ae}
.qcard .t{margin-top:4px}
.qcard .why{font-size:11px;color:#a89f8d;margin-top:5px}
.btns{display:flex;justify-content:flex-end;gap:5px;margin-top:8px}
.btns button{font:10.5px/1 var(--sans);color:#9aa1ab;background:#1a1e24;border:1px solid #2d3239;border-radius:5px;padding:4px 8px;cursor:pointer}
.btns button.pressed{background:#1d3328;border-color:var(--green);color:#bfe8d0}

.found{width:270px;background:#15181d;border:1px solid #343a42;border-radius:8px;padding:7px 10px;font:11.5px/1.35 var(--sans)}
.found .dep{position:absolute;top:-9px;right:8px;font:600 9px/1.5 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:#0d0f12;background:var(--green);border-radius:999px;padding:0 7px}
.found .l{color:#c9cfd6;font-weight:500}
.found .y{color:#7d848d;margin-top:2px}
.mini{width:150px;display:flex;gap:8px;align-items:flex-start;background:#15181d;border:1px solid #343a42;border-radius:8px;padding:7px 10px;font:11.5px/1.35 var(--sans);color:#aab1ba}
.mini .cb{width:14px;height:14px;margin-top:1px;font-size:10px}
.mini .k{color:#6b727b;font-size:10px;letter-spacing:.05em;text-transform:uppercase}

#overlay{position:absolute;left:50%;top:50%;transform:translate(-50%,-46%);text-align:center;opacity:0;pointer-events:none;
  transition:opacity .4s ease-out,transform .4s ease-out;width:90%}
#overlay.on{opacity:1;transform:translate(-50%,-50%)}
#overlay .o1,#overlay .o2{font:600 26px/1.35 var(--sans);color:#f3f5f8;letter-spacing:-.01em}
#overlay .o2{color:#c7ccd3}
#overlay .omono{margin-top:26px;font:12.5px/1.8 var(--mono);color:#7d848d}

#nav{position:fixed;right:14px;bottom:12px;display:flex;align-items:center;gap:10px;font:11px var(--mono);color:#4f565f}
#nav button{font:12px var(--sans);color:#c9cfd6;background:#1a1e24;border:1px solid #2d3239;border-radius:6px;padding:5px 11px;cursor:pointer}
#nav button:hover{background:#232830}
#nav .sc{font:11px var(--sans);color:#4f565f;margin-right:-4px}
#nav a{font:12px var(--sans);color:#8a919a;text-decoration:none;padding:5px 9px;border-radius:6px;border:1px solid transparent}
#nav a.cur{color:#c9cfd6;background:#1a1e24;border-color:#2d3239}
#nav .sep{color:#3a4048;margin:0 2px}
</style>
</head>
<body>
<div id="app">
  <section id="chat">
    <div class="chead"><span>acme-app</span><span class="br">⎇ main</span></div>
    <div id="msgs"></div>
    <div class="composer" id="composer">
      <div class="field"><span id="input"></span><span class="caret"></span><span class="ph">Reply to Claude…</span></div>
      <div class="crow"><span>Opus 5.5</span><span class="send">↑</span></div>
    </div>
  </section>
  <section id="map">
    <div class="bbar"><span>‹ › ↻</span><div class="url">localhost:4317/map</div></div>
    <div id="canvas">
      <div id="tree"><div id="treeIn"><svg id="tedges" viewBox="0 0 880 660"><defs></defs></svg></div></div>
      <div id="stage"><svg id="edges" viewBox="0 0 880 660"><defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3d434b"/></marker>
      </defs></svg></div>
      <div id="overlay">
        <p class="o1">Claude asked one question, 58 steps ago.</p>
        <p class="o2">You answered it from the map, without reading them.</p>
        <div class="omono"><div>$ [install command]</div><div>[github link]</div></div>
      </div>
    </div>
  </section>
</div>
<div id="nav"><button id="backb">‹ Back</button><span id="counter">0 / 3</span><button id="nextb">Next ›</button></div>

<script>
const LAST = 3, W = 880, H = 660;
const canvas = document.getElementById('canvas');
const tree = document.getElementById('tree');
const treeIn = document.getElementById('treeIn');
const tsvg = document.getElementById('tedges');
const stage = document.getElementById('stage');
const svg = document.getElementById('edges');
const overlay = document.getElementById('overlay');
const msgs = document.getElementById('msgs');
const input = document.getElementById('input');
const composer = document.getElementById('composer');
const counter = document.getElementById('counter');

// You come back to a chat that is a wall of tool lines. Somewhere in it Claude asked a
// question and kept going. The map has it on top, with what it blocks.
const TREE = {
  root: {x:40, y:364, l:'acme-app'},
  groups: [
    {k:'accounts', x:230, y:149, l:'accounts'},
    {k:'email',    x:230, y:383, l:'email', d:'Postmark, not SendGrid · @harshit · Sep 30'},
    {k:'admin',    x:230, y:560, l:'admin'},
  ],
  leaves: [
    {g:'accounts', x:520, y:50,  l:'sign in', d:'signed in 15 min, then out · @harshit · Oct 14'},
    {g:'accounts', x:520, y:116, l:'sign up'},
    {g:'accounts', x:520, y:182, l:'rate limiting', d:'5 tries per 10 min · @priyanka · Oct 9'},
    {g:'email',    x:520, y:350, l:'notifications'},
    {g:'email',    x:520, y:416, l:'background jobs'},
    {g:'admin',    x:520, y:500, l:'admin panel'},
    {g:'admin',    x:520, y:560, l:'audit log', d:'every change logged · @duy · Oct 2'},
    {g:'admin',    x:520, y:620, l:'/reset page', d:'2024 · ships, nothing links to it', old:true},
  ],
  fresh: {g:'accounts', x:520, y:248, l:'password reset flow', d:'Claude · building · 3 of 5 done · 1 question'},
};
const COLS = [150, 310, 470, 630, 790];
const Y = {crumb:34, flow:108, card:200, q:245, found:370};
const STEPS = ['forgot password', 'email arrives', 'opens the link', 'new password', 'signed in'];
const QUESTION = 'There is an old /reset page from 2024. Nothing links to it, but it still ships. Reuse it, or build a new one?';
const WHY = 'reuse keeps the address in old emails working; new is one more page to keep';
const T = [
  {s:0, k:'divider', t:'58 earlier steps'},
  {s:0, k:'tool', v:'Edit', p:'auth/routes.ts', x:'+46'},
  {s:0, k:'tool', v:'Write', p:'migrations/004_reset_token.sql', x:'+12'},
  {s:0, k:'tool', v:'Edit', p:'services/email.ts', x:'+18'},
  {s:0, k:'tool', v:'Read', p:'web/pages/'},
  {s:0, k:'say', t:'Found an old /reset page from 2024: nothing links to it, but it still ships. Reuse it, or build a new one? Meanwhile I’ll keep going on the email template.'},
  {s:0, k:'tool', v:'Read', p:'templates/notify.html'},
  {s:0, k:'tool', v:'Write', p:'templates/reset-email.html', x:'+40'},
  {s:0, k:'tool', v:'Edit', p:'services/email.ts', x:'+6'},
  {s:0, k:'tool', v:'Read', p:'tests/email.test.ts'},
  {s:0, k:'tool', v:'Write', p:'tests/reset-email.test.ts', x:'+31'},
  {s:0, k:'tool', v:'Edit', p:'package.json', x:'+1'},
  {s:0, k:'tool', v:'Bash', p:'npm test -- reset-email'},
  {s:0, k:'tool', v:'Read', p:'templates/reset-email.html'},
  {s:0, k:'tool', v:'Edit', p:'templates/reset-email.html', x:'+3 −3'},
  {s:0, k:'tool', v:'Bash', p:'npm test -- reset-email'},
  {s:0, k:'tool', v:'Read', p:'services/i18n.ts'},
  {s:0, k:'tool', v:'Edit', p:'locales/en.json', x:'+4'},
  {s:0, k:'tool', v:'Edit', p:'locales/vi.json', x:'+4'},
  {s:0, k:'tool', v:'Bash', p:'npm run lint'},
  {s:0, k:'tool', v:'Edit', p:'services/email.ts', x:'+1 −1'},
  {s:0, k:'tool', v:'Bash', p:'npm test'},
  {s:0, k:'tool', v:'Read', p:'templates/notify.html'},
  {s:0, k:'tool', v:'Edit', p:'templates/reset-email.html', x:'+2 −2'},
  {s:0, k:'spin'},
  {s:2, k:'map', t:'From your map: @duy answered: reuse the old /reset page.'},
  {s:2, k:'say', t:'Reusing /reset. Finishing the last two steps.'},
  {s:2, k:'spin'},
  {s:2, k:'tool', v:'Edit', p:'web/pages/reset.tsx', x:'+22'},
  {s:2, k:'tool', v:'Edit', p:'auth/routes.ts', x:'+9'},
  {s:2, k:'tool', v:'Write', p:'tests/reset.test.ts', x:'+18'},
  {s:2, k:'wait', ms:1900},
  {s:2, k:'say', t:'Done. All five steps built.'},
];

/* ---------- build ---------- */
let scale = 1;
function fit(){
  const r = canvas.getBoundingClientRect();
  scale = Math.min(r.width / W, r.height / H) * 0.95;
  stage.style.transform = tree.style.transform = `translate(-50%,-50%) scale(${scale})`;
}
function div(cls, text){ const d = document.createElement('div'); d.className = cls; if (text) d.textContent = text; return d; }
function span(cls, t){ const s = document.createElement('span'); s.className = cls; s.textContent = t; return s; }
function xf(a, b, cls){ const d = div('xf ' + (cls || '')); d.appendChild(span('a', a)); d.appendChild(span('b', b || '')); return d; }
function place(el, x, y){ el.style.left = x + 'px'; el.style.top = y + 'px'; stage.appendChild(el); return el; }
const svgEl = t => document.createElementNS('http://www.w3.org/2000/svg', t);
function box(el, cx, cy){ const w = el.offsetWidth, h = el.offsetHeight; return {l:cx - w/2, r:cx + w/2, t:cy - h/2, b:cy + h/2}; }
function setCb(cb, state){ cb.className = 'cb' + (state ? ' ' + state : ''); cb.textContent = state === 'done' ? '✓' : state === 'ask' ? '?' : ''; }

// Lines that appear later draw in through a mask, so dashed ones draw in too.
let masks = 0;
function mkPath(d, cls, marker, into = svg){
  const defs = into.querySelector('defs');
  const p = svgEl('path');
  p.setAttribute('d', d); p.setAttribute('class', cls);
  if (marker) p.setAttribute('marker-end', 'url(#arr)');
  into.appendChild(p);
  const id = 'm' + (masks++);
  const m = svgEl('mask');
  m.setAttribute('id', id); m.setAttribute('maskUnits', 'userSpaceOnUse');
  m.setAttribute('x', -100); m.setAttribute('y', -100); m.setAttribute('width', W + 200); m.setAttribute('height', H + 200);
  const mp = svgEl('path');
  mp.setAttribute('d', d); mp.setAttribute('fill', 'none'); mp.setAttribute('stroke', '#fff'); mp.setAttribute('stroke-width', 12);
  m.appendChild(mp); defs.appendChild(m);
  p.setAttribute('mask', `url(#${id})`);
  const len = p.getTotalLength() + 8;
  mp.style.strokeDasharray = `${len} ${len}`;
  mp.style.strokeDashoffset = len;
  p.style.opacity = 0;
  return {p, mp, len, on:false, raf:0};
}

// level 1
fit();
function tnode(n, cls){
  const d = div('tn ' + cls + (n.old ? ' old' : ''));
  if (cls !== 'root') d.appendChild(div('cb' + (cls === 'fresh' ? '' : ' done'), cls === 'fresh' ? '' : '✓'));
  const body = div('');
  body.appendChild(div('tt', n.l));
  if (n.d && cls === 'group') d.appendChild(div('gp', n.d));
  else if (n.d) body.appendChild(n.td = div('td', n.d));
  d.appendChild(body);
  d.style.left = n.x + 'px'; d.style.top = n.y + 'px';
  treeIn.appendChild(d);
  n.el = d; n.cb = d.firstChild;
  return n;
}
function hElbow(p, c, r = 8){
  const x1 = p.x + p.el.offsetWidth, y1 = p.y, x2 = c.x, y2 = c.y, xm = (x1 + x2) / 2;
  if (Math.abs(y2 - y1) < 1) return `M${x1} ${y1}H${x2}`;
  const s = Math.sign(y2 - y1);
  return `M${x1} ${y1}H${xm - r}Q${xm} ${y1} ${xm} ${y1 + s * r}V${y2 - s * r}Q${xm} ${y2} ${xm + r} ${y2}H${x2}`;
}
tnode(TREE.root, 'root');
const G = {};
TREE.groups.forEach(g => { G[g.k] = tnode(g, 'group'); });
TREE.leaves.forEach(n => tnode(n, 'leaf'));
const fresh = tnode(TREE.fresh, 'fresh');
fresh.q = div('q', '?'); fresh.el.appendChild(fresh.q);
[...TREE.groups.map(g => [TREE.root, g]), ...TREE.leaves.map(n => [G[n.g], n]), [G[fresh.g], fresh]]
  .forEach(([p, c]) => { const L = mkPath(hElbow(p, c), '', false, tsvg); L.p.style.opacity = 1; L.mp.style.strokeDashoffset = 0; });
treeIn.style.transformOrigin = `${fresh.x + fresh.el.offsetWidth / 2}px ${fresh.y}px`;
// what waits on you stays on top of the map, however far the chat has scrolled
const strip = div('strip');
strip.append((() => { const b = document.createElement('b'); b.textContent = 'Waiting on you · 1'; return b; })(),
  span('', 'Reuse the old /reset page, or build a new one?'), span('go', 'open ›'));
tree.appendChild(strip);

// level 2
const crumb = place(div('abs crumb fade'), 0, Y.crumb);
const crumbCb = div('cb', '');
crumb.append(span('', 'acme-app  ›  accounts  ›'), crumbCb, (() => { const b = document.createElement('b'); b.textContent = TREE.fresh.l; return b; })());
const steps = STEPS.map((l, i) => {
  const el = div('abs node fade'), cb = div('cb', '');
  el.append(cb, span('', l));
  place(el, COLS[i], Y.flow);
  return {el, cb};
});
const behind = place(div('abs note fade', 'waiting behind it'), COLS[4], Y.flow + 34);

const Q = place(div('abs qcard'), COLS[3], Y.q);
Q.style.setProperty('--dy', (Y.flow - Y.q) + 'px');
const qlab = xf('Claude asks · waiting on you', '@duy answered · today', 'lab');
Q.append(qlab, div('t', QUESTION), div('why', 'why it matters: ' + WHY));
const qbtns = div('btns'), qb = {};
[['reuse', 'Reuse it'], ['build', 'Build new'], ['ask', 'Ask Claude']].forEach(([k, t]) => { const b = document.createElement('button'); b.textContent = t; qbtns.appendChild(qb[k] = b); });
Q.appendChild(qbtns);

const found = place(div('abs found fade'), COLS[3], Y.found);
found.append(div('dep', 'deployed since 2024'), div('l', 'what it found: /reset page'), div('y', 'ships in the app, nothing links to it · under admin on the map'));

const mean = place(div('abs mini fade'), COLS[1], Y.card);
const meanCb = div('cb busy', '');
{ const body = div(''); body.append(div('k', 'meanwhile'), div('', 'email template')); mean.append(meanCb, body); }

// lines, now that every box has a size
const arrows = steps.slice(0, -1).map((st, i) => {
  const a = box(st.el, COLS[i], Y.flow), b = box(steps[i + 1].el, COLS[i + 1], Y.flow);
  return mkPath(`M${a.r + 4} ${Y.flow}H${b.l - 5}`, 'flow', true);
});
const qEdge = (() => { const sb = box(steps[3].el, COLS[3], Y.flow), qbx = box(Q, COLS[3], Y.q); return mkPath(`M${COLS[3]} ${sb.b}V${qbx.t}`, 'cedge ask'); })();
const qBottom = box(Q, COLS[3], Y.q).b;
const fEdge = mkPath(`M${COLS[3]} ${qBottom}V${box(found, COLS[3], Y.found).t}`, 'rel');
const mEdge = (() => { const sb = box(steps[1].el, COLS[1], Y.flow), mb = box(mean, COLS[1], Y.card); return mkPath(`M${COLS[1]} ${sb.b}V${mb.t}`, 'cedge'); })();

/* ---------- primitives ---------- */
let step = 0, token = 0, timers = [];

function setLine(L, on, A){
  if (A && L.on === on) return;
  cancelAnimationFrame(L.raf);
  L.on = on;
  if (!on){ L.p.style.opacity = 0; return; }
  L.p.style.opacity = 1;
  if (!A){ L.mp.style.strokeDashoffset = 0; return; }
  L.mp.style.strokeDashoffset = L.len;
  const t0 = performance.now();
  const tick = now => {
    const p = Math.min(1, (now - t0) / 380), e = 1 - Math.pow(1 - p, 3);
    L.mp.style.strokeDashoffset = L.len * (1 - e);
    if (p < 1) L.raf = requestAnimationFrame(tick);
  };
  L.raf = requestAnimationFrame(tick);
}

/* ---------- map ---------- */
function renderMap(s, A){
  const at = (ms, fn) => A ? timers.push(setTimeout(fn, ms)) : fn();
  const opening = A && s === 1, answering = A && s === 2, closing = A && s === 3;

  // level 1: the question is pinned on top; clicking it zooms into the branch it blocks
  strip.classList.toggle('hl', s === 1);
  at(closing ? 500 : 0, () => {
    strip.classList.toggle('off', s >= 2);
    fresh.q.classList.toggle('off', s >= 2);
    fresh.el.classList.toggle('built', s >= 3);
    setCb(fresh.cb, s >= 3 ? 'done' : 'busy');
    fresh.td.textContent = s >= 3 ? 'built · @duy · today' : TREE.fresh.d;
  });
  const inside = s >= 1 && s < 3;
  const sw = opening ? 450 : closing ? 100 : 0;
  at(sw, () => { treeIn.classList.toggle('zoom', inside); tree.classList.toggle('off', inside); });
  at(closing ? 0 : sw + (opening ? 250 : 0), () => stage.classList.toggle('on', inside));
  at(closing ? 1100 : 0, () => tree.classList.toggle('dim', s >= 3));

  // level 2: three steps done, one blocked by the question, one waiting behind it
  const d0 = sw + (opening ? 450 : 0);
  at(d0, () => crumb.classList.toggle('on', s >= 1));
  steps.forEach((st, i) => at(d0 + i * 90, () => st.el.classList.toggle('on', s >= 1)));
  arrows.forEach((L, i) => at(d0 + 120 + i * 90, () => { setLine(L, s >= 1, A); L.p.setAttribute('class', 'flow' + (i === 3 && s === 1 ? ' blocked' : '')); }));
  at(d0 + 500, () => behind.classList.toggle('on', s === 1));
  at(d0 + (opening ? 700 : 0), () => { mean.classList.toggle('on', s >= 1); setLine(mEdge, s >= 1, A); });
  at(d0 + (opening ? 900 : 0), () => { Q.classList.toggle('on', s >= 1); setLine(qEdge, s >= 1, A); });
  at(d0 + (opening ? 1300 : 0), () => { found.classList.toggle('on', s >= 1); setLine(fEdge, s >= 1, A); });

  // your answer, pressed on the map; then the last two steps tick off
  at(0, () => qb.reuse.classList.toggle('pressed', s >= 2));
  at(answering ? 300 : 0, () => {
    Q.classList.toggle('green', s >= 2);
    qlab.classList.toggle('alt', s >= 2);
    qEdge.p.setAttribute('class', 'cedge ' + (s >= 2 ? 'green' : 'ask'));
  });
  if (answering){
    steps.forEach((st, i) => setCb(st.cb, i < 3 ? 'done' : i === 3 ? 'ask' : ''));
    setCb(crumbCb, 'busy'); setCb(meanCb, 'busy');
    at(1500, () => setCb(steps[3].cb, 'busy'));
    at(2000, () => setCb(meanCb, 'done'));
    at(2600, () => setCb(steps[3].cb, 'done'));
    at(2700, () => setCb(steps[4].cb, 'busy'));
    at(3800, () => setCb(steps[4].cb, 'done'));
    at(3900, () => setCb(crumbCb, 'done'));
  } else {
    steps.forEach((st, i) => setCb(st.cb, s >= 2 || i < 3 ? 'done' : i === 3 ? 'ask' : ''));
    setCb(crumbCb, s >= 2 ? 'done' : 'busy');
    setCb(meanCb, s >= 2 ? 'done' : 'busy');
  }

  at(closing ? 1400 : 0, () => overlay.classList.toggle('on', s >= 3));
}

/* ---------- chat ---------- */
function setInput(t){ input.textContent = t; composer.classList.toggle('has', !!t); }
let spinEl = null;
function addMsg(el, anim){ if (anim) el.classList.add('anim'); msgs.insertBefore(el, spinEl); msgs.scrollTop = msgs.scrollHeight; }
function apply(e, anim){
  if (e.k === 'wait') return;
  else if (e.k === 'divider') addMsg(div('divider', e.t), anim);
  else if (e.k === 'submit'){ addMsg(div('bubble', e.t || input.textContent), anim); setInput(''); }
  else if (e.k === 'map'){ if (spinEl){ spinEl.remove(); spinEl = null; } addMsg(div('frommap', e.t), anim); }
  else if (e.k === 'spin'){
    if (spinEl) spinEl.remove();
    spinEl = div('working'); spinEl.append(div('spin'), span('', 'Working…'));
    msgs.appendChild(spinEl); msgs.scrollTop = msgs.scrollHeight;
  }
  else if (e.k === 'say'){
    if (spinEl){ spinEl.remove(); spinEl = null; }
    addMsg(div('say', e.t), anim);
  } else {
    let g = spinEl ? spinEl.previousElementSibling : msgs.lastElementChild;
    if (!g || !g.classList.contains('tools')){ g = div('tools'); addMsg(g, false); }
    const r = div('tool' + (anim ? ' anim' : ''));
    r.append(span('v', e.v), span('p', e.p));
    if (e.x) r.append(span('x', e.x));
    g.appendChild(r);
    msgs.scrollTop = msgs.scrollHeight;
  }
}
function chatStatic(s){
  msgs.textContent = ''; spinEl = null; setInput('');
  T.filter(e => e.s <= s).forEach(e => apply(e, false));
}
const wait = ms => new Promise(r => setTimeout(r, ms));
async function chatAnim(s, tok){
  for (const e of T.filter(e => e.s === s)){
    if (e.k === 'wait'){ await wait(e.ms); if (tok !== token) return; continue; }
    await wait(e.k === 'tool' ? 200 : e.k === 'spin' ? 150 : 650); if (tok !== token) return;
    apply(e, true);
  }
}

/* ---------- stepping ---------- */
function go(t, A){
  token++; timers.forEach(clearTimeout); timers = [];
  const tok = token;
  const base = A ? t - 1 : t;
  canvas.classList.add('notrans');
  chatStatic(base); renderMap(base, false);
  void canvas.offsetWidth;
  canvas.classList.remove('notrans');
  step = t; counter.textContent = t + ' / ' + LAST;
  if (!A) return;
  // you act on the map first; the chat hears about it after
  renderMap(t, true);
  timers.push(setTimeout(() => chatAnim(t, tok), t === 2 ? 600 : 0));
}
const next = () => step >= LAST ? go(0, false) : go(step + 1, true);
const prev = () => { if (step > 0) go(step - 1, false); };

document.getElementById('nextb').addEventListener('click', e => { e.stopPropagation(); next(); });
document.getElementById('backb').addEventListener('click', e => { e.stopPropagation(); prev(); });
document.addEventListener('click', e => { if (!e.target.closest('button, a')) next(); });
document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'ArrowRight'){ e.preventDefault(); next(); }
  else if (e.key === 'Backspace' || e.key === 'ArrowLeft'){ e.preventDefault(); prev(); }
});
window.addEventListener('resize', fit);
go(0, false);
</script>
