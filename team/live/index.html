/** Frames the view: the whole of it at the zoom that fits, or at the zoom `keep` gives, centred where it fits and
 * from its top left where it does not. @param {number} [keep] */
function fit(keep){
  const f = frame(); if (!f) return;
  const wide = f.maxX - f.minX, tall = f.maxY - f.minY;

}

/** Shows the view at the reading size, around what is in the middle of the screen now: 85%, a little more of the
 * map than at 100% with every box's words easy to read. Where the map is smaller than the screen it is
 * centred; where it is larger, it fills the screen to its edge rather than leaving the room past it empty. */
function readingSize(){
  const f = frame(); if (!f) return;

    if ((max - min) * z <= room) return start + (room - (max - min) * z) / 2 - min * z;
    const mid = (start + room / 2 - at) / cam.z;
    return Math.min(start - min * z, Math.max(start + room - max * z, start + room / 2 - mid * z));

  else if (t?.closest('[data-sd-close]')){ sdAsking = false; try { localStorage.setItem(`lm-sd-${SYS_MAP}`, String(S?.drawing?.at)); } catch { /* storage blocked: it closes until the page reloads */ } $('sysdraw').hidden = true; renderSave(); }
});
const historyView = () => historyScreens({ me: ME, admin: amAdmin(), live: !READ_ONLY, esc, vtime, statusLabel: (a) => actionStatus(a)?.label });
function renderHist(){
  const el = $('hist'), open = railTab === 'history' && !selected;
  el.classList.toggle('on', open);
  // closing History while an earlier version shows goes back to now
  if (!open){ if (PREVIEW) setTimeout(backToNow); return; }
  if (!HIST.length) fetchHist();
  const cur = PREVIEW?.id || HIST[0]?.id;
  const archived = PREVIEW ? [] : (S.archived || []);
  el.innerHTML = historyView().panel({ archived, versions: HIST, current: cur });
}
function renderHistBar(){
  const el = $('histbar'); el.classList.toggle('on', !!PREVIEW || !!FILE); document.body.classList.toggle('previewing', !!PREVIEW);
  el.innerHTML = historyView().bar({ preview: PREVIEW, file: FILE });
}
// Load into Living Map, in a saved file: opens the Living Map on this Mac (its usual address) in a new tab, which
// says it is ready, then hands it the file's data; that tab makes it a map of its own and shows it. Signed out,
// that tab asks to sign in first and then takes the data; not running, it shows nothing, and the bar says what to do
const LM = 'http://localhost:4323';
let loading = null;
function loadFile(){
  const b = document.querySelector('[data-fload]'); if (!b) return;
  loading = window.open(`${LM}/?load`, '_blank');
  toast('If no Living Map opens, type /anur-living-map in Claude Code first, then click again.');
}
window.addEventListener('message', (e) => {
  if (!FILE || e.data !== 'lm-ready' || !loading || e.source !== loading) return;
  loading.postMessage({ lmLoad: document.getElementById('lm-data').textContent }, LM);
});
function showVersion(id){
  const v = HIST.find((h) => h.id === id); if (!v) return;
  fetch(`api/history/${id}`).then((r) => r.json()).then((content) => {
    PREVIEW = { ...v, content }; S = { ...LIVE, ...content }; selected = null; renderHistBar(); render();
  }).catch(() => toast('That version could not be opened.'));
}
function backToNow(){ if (!PREVIEW) return; PREVIEW = null; S = LIVE; renderHistBar(); render(); }

let toastT; function toast(t){ $('toast').textContent = t; $('toast').classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => $('toast').classList.remove('on'), 2600); }

function cloudEvents(){
  const listeners = new Map(); let stopped = false, revision = -1, timer;
  const es = { addEventListener: (name, fn) => listeners.set(name, fn), close(){ stopped = true; clearTimeout(timer); } };
  const poll = async () => {
    try {
      const r = await fetch('api/state', { headers: revision < 0 ? {} : { 'if-none-match': `"${revision}"` } });
      if (r.status === 304) { if (!stopped) timer = setTimeout(poll, document.hidden ? 30000 : 3000); return; }
      if (r.status === 403 || r.status === 404){ stopped = true; toast('This shared link is no longer available.'); document.body.classList.add('view-only'); return; }
      if (!r.ok) throw new Error();
      const next = await r.json();
      if (next.linkSharing.mode !== (READ_ONLY ? 'view' : 'edit')){ location.reload(); return; }
      if (revision !== next.cloudRevision){ revision = next.cloudRevision; listeners.get('state')?.({ data: JSON.stringify(next) }); }
    } catch { toast('Reconnecting to the cloud…'); }
    if (!stopped) timer = setTimeout(poll, document.hidden ? 30000 : 3000);
  };
  setTimeout(poll, 0); return es;
}
/* follow the server */
// A browser keeps six connections to one site, and a map's live line holds one for as long as it is open: with six
// maps open in six tabs a seventh never loads, and none of the six can save. So a tab nobody is looking at gives
// its line back once it has the map, and takes it again, with the map as it is by then, when it is looked at.
let line = null, lineHasMap = false, firstState = true;
const dropLine = () => { line?.close(); line = null; };
document.addEventListener('visibilitychange', () => {
  if (FILE || CLOUD) return;
  if (!document.hidden){ if (!line) listen(); }
  else if (lineHasMap) dropLine();
});
function listen(){
  if (FILE){ LIVE = S = FILE_DATA; renderHistBar(); render(); fit(); return; }
  if (line) return;
  const es = line = CLOUD ? cloudEvents() : new EventSource(mapURL('api/events'));
  lineHasMap = false;
  // the live connection comes back after the server restarts: ask which server answers now
  es.onopen = () => loadVer(false);
  es.addEventListener('access-changed', () => { es.close(); location.reload(); });
  es.addEventListener('access-removed', () => { es.close(); location.replace('/'); });
  es.addEventListener('state', (m) => {
    const next = JSON.parse(m.data);
    const arrived = new Set(allBoxesOf(next).map((n) => n.id));
    for (const n of pendingTopics) if (arrived.has(n.id)) pendingTopics.delete(n);
    for (const id of pendingRemovals) if (!allBoxesOf(next).some((n) => n.id === id)) pendingRemovals.delete(id);
    hideRemoved(next);
    if (drag){ const d = drag.proposed ? proposedBox(drag.n.id, next) : allBoxesOf(next).find((n) => n.id === drag.n.id); if (d){ d.x = drag.n.x; d.y = drag.n.y; drag.n = d; }
      for (const m of drag.many || []){ const e = allBoxesOf(next).find((n) => n.id === m.n.id); if (e){ e.x = m.n.x; e.y = m.n.y; m.n = e; } } }
    // a box or flow you are inside that no longer exists sends you back to the system
    const here = view.replace(/^(flow|diagram):/, ''), dg = view.startsWith('diagram:');
    if (view !== 'system' && !allBoxesOf(next).some((n) => n.id === here && (!view.startsWith('flow:') || n.flow))
      && !(dg && proposedBox(here, next)?.diagram)) view = 'system';
    // the comment you just posted opens as a thread
    if (pendingOpen && next.comments?.length){ const mine = next.comments.filter((c) => c.msgs[0].who === ME).at(-1); if (mine) openThread = mine.id; pendingOpen = false; }
    // typing a reply, or the next question to Claude while it is still answering, survives the redraw
    const ae = document.activeElement;
    const typing = ae?.closest?.('#thread, #cpanel, #side, #chat, #mem') ? { sel: ae.id || (ae.closest('#thread') ? '#thread input' : ae.closest('#side') ? '#side form[data-ask] textarea' : ae.closest('#chat') ? '#chat form[data-chat] textarea' : null), val: ae.value } : null;
    // an earlier version on show stays on show: the live map waits underneath until Back to now
    LIVE = next; S = PREVIEW ? { ...next, ...PREVIEW.content } : next;
    if (!PREVIEW) syncTopicPreview(true);
    render();
    if (railTab === 'history') fetchHist();
    if (typing?.sel){ const el = typing.sel.includes(' ') ? document.querySelector(typing.sel) : $(typing.sel); if (el){ el.value = typing.val; el.focus(); if (el.tagName === 'TEXTAREA') fitBox(el); } }
    if (firstState){ firstState = false; fit(); openBrainBox(); openNewMap(); }
    lineHasMap = true;
    if (document.hidden && !CLOUD) dropLine();
  });
  es.addEventListener('cloud', (m) => { CLOUD_STATUS = JSON.parse(m.data); if (shareOpen) renderShare(); });
  es.addEventListener('cursors', (m) => { cursors = JSON.parse(m.data); renderCursors(); });
  // your Claude Code chat, synced into the Claude pane; typing in the pane survives the redraw
  es.addEventListener('mirror', (m) => {
    const v = JSON.parse(m.data); MIRROR = v.owner === ME ? v : null;
    redrawChat();
  });
  es.addEventListener('here', (m) => { hereNow = JSON.parse(m.data); if (S) renderTop(); });
  es.onerror = () => { es.close(); if (line !== es) return; line = null; setTimeout(listen, 1500); };
}
// a resize can come before the map has loaded
window.addEventListener('resize', () => { if (S) fit(); });
// the chat box, the way the Claude app has it: Enter sends, Shift+Enter starts a new line (so does Enter while an
// input method is still composing a word); the box grows with each line
document.addEventListener('keydown', (e) => {
  const t = e.target.closest?.('form[data-chat] textarea, form[data-ask] textarea, form[data-action-start] textarea, form[data-action-answer] textarea, form[data-action-continue] textarea');
  if (!t || e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
  e.preventDefault(); t.form.requestSubmit();
});
const fitBox = (t) => { t.style.height = 'auto'; t.style.height = `${t.scrollHeight}px`; };
document.addEventListener('input', (e) => { const t = e.target.closest?.('form[data-chat] textarea, form[data-ask] textarea, form[data-action-start] textarea, form[data-action-answer] textarea, form[data-action-continue] textarea'); if (t) fitBox(t); const key = t && draftKey(t); if (key) keepDraft(key, t.value); });
listen();
</script>
