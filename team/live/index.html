/* arrowheads, one per line colour */
const COL = { old: '#9b988f', new: '#2F6FE4', 'assumed-gone': '#D23B32' };
const defsHtml = `<defs>${Object.entries(COL).map(([k, c]) => `<marker id="a-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 1L10 5L0 9Z" fill="${c}"/></marker>`).join('')}`
  + `<marker id="x-gone" viewBox="0 0 16 16" refX="8" refY="8" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16"><circle cx="8" cy="8" r="7" fill="#fbfaf7"/><path d="M4.5 4.5L11.5 11.5M11.5 4.5L4.5 11.5" stroke="#D23B32" stroke-width="2" stroke-linecap="round"/></marker></defs>`;
const endOf = (k) => k === 'assumed-gone' ? 'url(#x-gone)' : `url(#a-${k})`;

// out of one box, into the next: straight when they line up, one elbow otherwise
// A line leaves and enters on the sides that face each other: boxes mostly side
// by side join left-to-right with one jog in the gap; boxes mostly above each
// other join bottom-to-top the same way. So a line never runs along a box edge
// or arrives where another line already does.
function route(a, b, dup, others = [], port){ return routePts(a, b, dup, others, port).map(([x, y], i) => `${i ? 'L' : 'M'}${x} ${y}`).join(''); }
// a line's corner points, so its words can be put where no other line runs; `port` moves where it leaves
// its first box and enters its second along that side, so lines meeting one side never share a stretch
function routePts(a, b, dup, others = [], port = { from: 0, to: 0 }){
  // two lines between the same boxes sit 7px either side of the middle
  const off = dup === null ? 0 : dup ? 7 : -7;
  const dx = b.x - a.x, dy = b.y - a.y;
  // sideways: out of the facing sides, one jog in the gap between them
  const side = () => {
    const sx = dx > 0 ? a.x + W(a) / 2 : a.x - W(a) / 2, tx = dx > 0 ? b.x - W(b) / 2 - 2 : b.x + W(b) / 2 + 2;
    const y1 = a.y + off + port.from, y2 = b.y + off + port.to, mx = (sx + tx) / 2;
    return Math.abs(y2 - y1) < 2 ? [[sx, y1], [tx, y1]] : [[sx, y1], [mx, y1], [mx, y2], [tx, y2]];
  };
  // up or down: out of the top or bottom, one jog between the rows
  const updown = () => {
    const sy = dy > 0 ? a.y + HT(a) / 2 : a.y - HT(a) / 2, ty = dy > 0 ? b.y - HT(b) / 2 - 2 : b.y + HT(b) / 2 + 2, my = (sy + ty) / 2;
    const x1 = a.x + port.from, x2 = b.x + port.to;
    return Math.abs(x2 - x1) < 2 ? [[x1, sy], [x1, ty]] : [[x1, sy], [x1, my], [x2, my], [x2, ty]];
  };
  // the natural shape, unless it runs through another box and the other one does not
  const blocked = (pts) => pts.slice(1).reduce((k, [x2, y2], i) => {
    const [x1, y1] = pts[i];
    return k + others.filter((n) => n !== a && n !== b && Math.max(x1, x2) > n.x - W(n) / 2 - 4 && Math.min(x1, x2) < n.x + W(n) / 2 + 4
      && Math.max(y1, y2) > n.y - HT(n) / 2 - 4 && Math.min(y1, y2) < n.y + HT(n) / 2 + 4).length;
  }, 0);
  const first = Math.abs(dx) >= Math.abs(dy) ? side() : updown(), second = Math.abs(dx) >= Math.abs(dy) ? updown() : side();
  return blocked(first) && blocked(second) < blocked(first) ? second : first;
}

// Lines that enter the same side of one box spread out along it, up to 28px apart and never past its corners,
// so two arrows never merge into one stretch (Charge $99 and Sends the saved cards both arriving under Stripe).
// A line that arrives straight keeps the middle; the others step aside towards where they come from. Lines
// leaving one box spread the same way, except on a mind map, where fanning out of one stem is the shape.
function portsFor(list, nodes, spreadOut = true){
  const plain = list.map((l) => ({ ...l, pts: routePts(l.a, l.b, l.dup, nodes) }));
  const vertical = (p, q) => Math.abs(p[0] - q[0]) < 1;
  const groups = new Map(), add = (key, item) => { if (!groups.has(key)) groups.set(key, []); groups.get(key).push(item); };
  for (const l of plain){
    const p = l.pts, n = p.length, outV = vertical(p[0], p[1]), inV = vertical(p[n - 2], p[n - 1]);
    const outSide = outV ? (p[1][1] < p[0][1] ? 'top' : 'bottom') : (p[1][0] > p[0][0] ? 'right' : 'left');
    const inSide = inV ? (p[n - 1][1] < p[n - 2][1] ? 'bottom' : 'top') : (p[n - 1][0] > p[n - 2][0] ? 'left' : 'right');
    if (spreadOut) add(`${l.a.id}:${outSide}`, { id: l.id, end: 'from', from: outV ? p[n - 1][0] : p[n - 1][1], mid: outV ? l.a.x : l.a.y, side: outV ? W(l.a) : HT(l.a) });
    add(`${l.b.id}:${inSide}`, { id: l.id, end: 'to', from: inV ? p[0][0] : p[0][1], mid: inV ? l.b.x : l.b.y, side: inV ? W(l.b) : HT(l.b) });
  }
  const ports = new Map(plain.map((l) => [l.id, { from: 0, to: 0 }]));
  for (const g of groups.values()){
    if (g.length < 2) continue;
    g.sort((s, t) => s.from - t.from);
    const at = g.findIndex((s) => Math.abs(s.from - s.mid) < 1), anchor = at < 0 ? (g.length - 1) / 2 : at;
    // every port stays at least 8px inside the side's corners
    const reach = Math.max(anchor, g.length - 1 - anchor) || 1, step = Math.min(28, (g[0].side / 2 - 8) / reach);
    g.forEach((s, i) => { ports.get(s.id)[s.end] = (i - anchor) * step; });
  }
  return ports;
}

// A topic map (one box everything hangs off) is a tree: each box hangs under the box nearest the first one that
// has a line to it, as Tidy up lays it out. Its other lines are cross-links, drawn faint, dashed and curved the
// way XMind draws its relationships, so they read as "related to" and never as part of the tree.
function crossLinks(){
  const ids = new Set(S.nodes.map((n) => n.id)), es = S.edges.filter((e) => ids.has(e.from) && ids.has(e.to) && e.from !== e.to);
  const into = new Set(es.map((e) => e.to)), roots = S.nodes.filter((n) => !into.has(n.id));
  if (roots.length !== 1) return null;
  const out = new Map(); for (const e of es){ if (!out.has(e.from)) out.set(e.from, []); out.get(e.from).push(e); }
  const seen = new Set([roots[0].id]), tree = new Set(), q = [roots[0].id];
  while (q.length) for (const e of out.get(q.shift()) || []) if (!seen.has(e.to)){ seen.add(e.to); tree.add(e); q.push(e.to); }
  if (seen.size !== S.nodes.length) return null;
  return { root: roots[0], links: new Set(es.filter((e) => !tree.has(e)).map((e) => `${e.from}>${e.to}`)) };
}
// a cross-link's curve: out of the side facing the other box and into its facing side; two boxes in one column
// join on their outer side (away from the first box), the curve bowing out past them
function curve(a, b, cx){
  const column = Math.abs(b.x - a.x) < (W(a) + W(b)) / 2 + 24, dir = column ? (a.x >= cx ? 1 : -1) : Math.sign(b.x - a.x);
  const sx = a.x + dir * W(a) / 2, tx = column ? b.x + dir * (W(b) / 2 + 2) : b.x - dir * (W(b) / 2 + 2);
  const bow = column ? Math.min(64, 32 + Math.abs(b.y - a.y) / 8) : Math.max(40, Math.abs(tx - sx) / 2);
  const c1 = [sx + dir * bow, a.y], c2 = [column ? tx + dir * bow : tx - dir * bow, b.y];
  const at = (t) => { const u = 1 - t; return [u * u * u * sx + 3 * u * u * t * c1[0] + 3 * u * t * t * c2[0] + t * t * t * tx, u * u * u * a.y + 3 * u * u * t * c1[1] + 3 * u * t * t * c2[1] + t * t * t * b.y]; };
  return { d: `M${sx} ${a.y}C${c1[0]} ${c1[1]} ${c2[0]} ${c2[1]} ${tx} ${b.y}`, mid: at(.5), pts: Array.from({ length: 17 }, (_, i) => at(i / 16)) };
}

// Where a line's level run crosses another line's upright run, it hops over it with a small arc, the way a
// wiring diagram shows one wire passing over another, so a crossing never reads as a junction. Only level runs
// hop, so each crossing gets one hop; a crossing within a hop's width of a corner or an end is left alone.
function hopPath(pts, others, r = 6){
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++){
    const [x1, y1] = pts[i - 1], [x2, y2] = pts[i];
    if (Math.abs(y1 - y2) > .5 || Math.abs(x1 - x2) < 2 * r){ d += `L${x2} ${y2}`; continue; }
    const dir = Math.sign(x2 - x1), lo = Math.min(x1, x2) + r, hi = Math.max(x1, x2) - r, xs = new Set();
    for (const o of others) for (let j = 1; j < o.length; j++){
      const [ox1, oy1] = o[j - 1], [ox2, oy2] = o[j];
      if (Math.abs(ox1 - ox2) > .5) continue;
      if (ox1 > lo && ox1 < hi && y1 > Math.min(oy1, oy2) + r && y1 < Math.max(oy1, oy2) - r) xs.add(Math.round(ox1));
    }
    for (const x of [...xs].sort((p, q) => dir * (p - q))) d += `L${x - dir * r} ${y1}A${r} ${r} 0 0 ${dir > 0 ? 1 : 0} ${x + dir * r} ${y1}`;
    d += `L${x2} ${y2}`;
  }
  return d;
}

// A line's words never sit where another line runs: they go on a stretch that is the line's own, the way
// "Charge $99" sits on its own run with the corner clear of it, and never on a stem two lines share or a
// crossing. Each candidate is a box of the words' size; the first that no other line, box or words touch wins.
function placeWords(labels, lines, nodes){
  const segs = lines.flatMap((l) => l.pts.slice(1).map((q, i) => ({ id: l.id, p: l.pts[i], q })));
  const boxes = nodes.map((n) => [n.x - W(n) / 2, n.y - HT(n) / 2, n.x + W(n) / 2, n.y + HT(n) / 2]);
  const inR = (x, y, r) => x >= r[0] && x <= r[2] && y >= r[1] && y <= r[3];
  const hitsSeg = ({ p, q }, r) => { const n = Math.max(1, Math.ceil(Math.hypot(q[0] - p[0], q[1] - p[1]) / 3));
    for (let i = 0; i <= n; i++) if (inR(p[0] + (q[0] - p[0]) * i / n, p[1] + (q[1] - p[1]) * i / n, r)) return true; return false; };
  const over = (r, s) => r[0] < s[2] && r[2] > s[0] && r[1] < s[3] && r[3] > s[1];
  const taken = [];
  return labels.map((L) => {
    const w = L.text.length * 6.6 + 12, rect = ([x, y]) => [x - w / 2, y - 10, x + w / 2, y + 10];
    const free = (pt) => { const r = rect(pt); return !segs.some((s) => s.id !== L.id && hitsSeg(s, r)) && !boxes.some((b) => over(r, b)) && !taken.some((t) => over(r, t)); };
    // along the line's own stretches, longest first, from the middle of each outwards
    const runs = L.pts.slice(1).map((q, i) => [L.pts[i], q]).sort((s, t) => Math.hypot(t[1][0] - t[0][0], t[1][1] - t[0][1]) - Math.hypot(s[1][0] - s[0][0], s[1][1] - s[0][1]));
    const along = runs.flatMap(([p, q]) => [.5, .35, .65, .2, .8].map((f) => [p[0] + (q[0] - p[0]) * f, p[1] + (q[1] - p[1]) * f]));
    const at = [L.first, ...along].find(free) || L.first;
    taken.push(rect(at));
    return { ...L, at };
  });
}

function render(){
  if (!S) return;
  const fb = flowBox();
  const db = !fb && diagramBox();
  if (db && !db.diagram && !diagramChange(db.id)){ view = 'system'; return render(); }
  if (fb || db){ if (fb) drawFlow(fb); else drawDiagram(db); renderLevels(); renderTop(); renderInbox(); renderQueue(); renderSide(); renderPrs(); renderCursors(); renderComments(); renderChat(); renderDecs(); renderHist(); renderMem(); fitPane(); return; }
  let { nodes, edges } = scope();
  while ([selected, lit].some((id) => id && reveal(id))) ({ nodes, edges } = scope());
  const byId = Object.fromEntries(nodes.map((n) => [n.id, n]));
  // lines
  // the lines' words go in after every line, so no other line runs across them
  let svg = '', words = '', hits = '';
  const lines = [], labels = [];
  // a line you may delete: not one Claude only proposed, and not one touching a box outside your reach
  const canPick = (e, a, b) => !e.proposed && !locked(a) && !locked(b) && !PREVIEW;
  const half = (pts) => { const seg = pts.slice(1).map((p, i) => Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1])); let left = seg.reduce((s, d) => s + d, 0) / 2;
    for (const [i, d] of seg.entries()){ if (left <= d){ const t = d ? left / d : 0; return [pts[i][0] + (pts[i + 1][0] - pts[i][0]) * t, pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t]; } left -= d; } return pts.at(-1); };
  let pickSeen = false;
  const pair = (e) => edges.some((o) => o.from === e.to && o.to === e.from);
  const seen = new Set(), cross = view === 'system' ? crossLinks() : null;
  const routed = [], dupOf = new Map();
  for (const e of edges){
    const a = byId[e.from], b = byId[e.to]; if (!a || !b) continue;
    const dup = pair(e) ? seen.has(`${e.to}>${e.from}`) : null; seen.add(`${e.from}>${e.to}`); dupOf.set(e, dup);
    if (!cross?.links.has(`${e.from}>${e.to}`)) routed.push({ id: `${e.from}>${e.to}`, a, b, dup });
  }
  const ports = portsFor(routed, nodes, !cross);
  // every plain line's points first, so each can hop where it crosses another
  const ptsOf = new Map(routed.map((l) => [l.id, routePts(l.a, l.b, l.dup, nodes, ports.get(l.id))]));
  for (const e of edges){
    const a = byId[e.from], b = byId[e.to]; if (!a || !b) continue;
    const dup = dupOf.get(e);
    // a line Claude proposed and you have not applied is blue and moving, on any map; on a map of decisions the rest are plain
    const k0 = e.proposed ? 'new' : decisionMap() ? 'old' : e.state || 'old';
    const k = k0;
    // motion means "still open": once nothing on the map waits on anyone, the plan's own new lines hold still
    // (blue and dashed, not built yet); a change Claude proposes keeps moving until someone applies it
    const still = k === 'new' && !e.proposed && settledPlan();
    const quiet = anyFocus() && !e.state && !focused(a) && !focused(b);
    // a cross-link always curves around the tree; a plain one is faint, one a plan adds or proposes keeps its colour
    if (cross?.links.has(`${e.from}>${e.to}`)){
      const c = curve(a, b, cross.root.x), kc = !e.proposed && !e.state ? 'cross' : k;
      const pk = pickedLine === `${e.from}>${e.to}`;
      svg += `<path class="${kc} ${quiet && !pk ? 'faint' : ''} ${pk ? 'pick' : ''}" d="${c.d}" marker-end="${endOf(kc === 'cross' ? 'old' : k)}"/>`;
      if (canPick(e, a, b)){ hits += `<path class="hit" data-edge="${e.from}>${e.to}" d="${c.d}"/>`; if (pk){ pickSeen = true; lineMid = c.mid; } }
      lines.push({ id: `${e.from}>${e.to}`, pts: c.pts });
      if (e.label) labels.push({ id: `${e.from}>${e.to}`, k: kc, text: e.label, pts: c.pts, first: c.mid });
      continue;
    }
    const pts = ptsOf.get(`${e.from}>${e.to}`);
    lines.push({ id: `${e.from}>${e.to}`, pts });
    const others = [...ptsOf].filter(([id]) => id !== `${e.from}>${e.to}`).map(([, p]) => p);
    const pk = pickedLine === `${e.from}>${e.to}`;
    svg += `<path class="${k} ${quiet && !pk ? 'faint' : ''} ${still ? 'still' : ''} ${pk ? 'pick' : ''}" d="${hopPath(pts, others)}" marker-end="${endOf(k)}"/>`;
    if (canPick(e, a, b)){ hits += `<path class="hit" data-edge="${e.from}>${e.to}" d="${pts.map(([x, y], i) => `${i ? 'L' : 'M'}${x} ${y}`).join('')}"/>`; if (pk){ pickSeen = true; lineMid = half(pts); } }
    // a line's words sit on the line itself, in a gap, so the line reads "Upgrade →"
    if (e.label){
      const level = Math.abs(a.y - b.y) < 2, upright = Math.abs(a.x - b.x) < 2;
      const off = dup === null ? 0 : dup ? 7 : -7;
      const x1 = a.x < b.x ? a.x + W(a) / 2 : a.x - W(a) / 2, x2 = level ? (a.x < b.x ? b.x - W(b) / 2 : b.x + W(b) / 2) : b.x;
      // a straight up-and-down line carries its words halfway between the two boxes; a sideways line with a jog
      // carries them on its own last stretch, so lines that share a stem out of one box keep their words apart
      const branch = !level && !upright && Math.abs(b.x - a.x) >= Math.abs(b.y - a.y);
      const tx = a.x < b.x ? b.x - W(b) / 2 - 2 : b.x + W(b) / 2 + 2;
      const mx = upright ? a.x : branch ? ((x1 + tx) / 2 + tx) / 2 : (x1 + x2) / 2;
      const my = upright ? ((a.y < b.y ? a.y + HT(a) / 2 : a.y - HT(a) / 2) + (a.y < b.y ? b.y - HT(b) / 2 : b.y + HT(b) / 2)) / 2 : branch ? b.y + off : a.y + off;
      labels.push({ id: `${e.from}>${e.to}`, k, text: e.label, pts, first: [mx, my] });
    }
  }
  for (const L of placeWords(labels, lines, nodes))
    words += `<rect class="gap" x="${L.at[0]}" y="${L.at[1] - 8}" width="0" height="16" fill="var(--canvas)"/><text class="${L.k}" x="${L.at[0]}" y="${L.at[1]}" text-anchor="middle" dominant-baseline="central">${L.text}</text>`;
  // a picked line that is gone (deleted, or folded away) lets go
  if (!pickSeen){ pickedLine = null; lineMid = null; lineAt = null; }
  edgesEl.innerHTML = defsHtml + svg + words + hits;
  // the gap is as wide as the words, measured, plus a little air
  for (const r of edgesEl.querySelectorAll('rect.gap')){
    const t = r.nextElementSibling, w = t.getComputedTextLength() + 8;
    r.setAttribute('x', Number(r.getAttribute('x')) - w / 2); r.setAttribute('width', w);
  }
  // boxes
  document.body.classList.toggle('decide', decisionMap());
  let html = '';
  for (const n of nodes){
    const open = S.calls.filter((c) => c.node === n.id && c.status === 'open'), mine = open.some((c) => c.for === ME);
    // a box outside your reach shows nothing of what was decided on it, unless a question on it waits on you
    const going = !decisionMap() && !locked(n) && (n.state === 'assumed-gone' || n.state === 'gone');
    const cls = ['node', n.kind || '', fold.depth.get(n.id) === 0 && fold.kids.has(n.id) ? 'start' : '', n.ghost ? 'ghost' : '', n.proposed ? 'proposed new' : '', decisionMap() ? (locked(n) && !mine ? '' : boxDecision(n)) : n.state || '', going && !guessGone(n) ? 'settled' : '', n.state === 'new' && !n.proposed && settledPlan() ? 'still' : '', selected === n.id || lit === n.id ? 'sel' : '', locked(n) ? 'locked' : '', focused(n) || view !== 'system' || !anyFocus() ? '' : 'faint'].join(' ');
    html += `<div class="${cls}" data-id="${n.id}" style="left:${n.x}px;top:${n.y}px;width:${W(n)}px;height:${HT(n)}px" ${locked(n) ? `title="No access: ask ${S.people.find((p) => p.role === 'Admin')?.id || 'an admin'}"` : ''}>
      <div class="n">${locked(n) ? ICON.lock : n.icon === 'db' ? ICON.db : ''}<span class="nt">${n.label}</span></div>${n.sub && !locked(n) ? `<div class="s">${n.sub}</div>` : ''}
      ${n.note && n.note !== n.sub && n.state === 'assumed-gone' ? `<div class="s2">${n.note}</div>` : ''}
      ${mine ? `<span class="mk q" title="${open.find((c) => c.for === ME).ask || ''}">Need clarify</span>`
        : locked(n) ? '' : open.length ? waitPill(open, 'mk q') : (() => { const d = S.calls.filter((c) => c.node === n.id && c.status !== 'open').at(-1); return d && !open.length ? `<span class="mk q ok" title="${d.ask || d.text}: ${ans(d)} from ${d.by}, ${d.at}">Clarified</span>` : ''; })()}
      ${n.inside && !locked(n) ? `<span class="expand" data-expand="${n.id}" title="Open ${n.label}: what is inside it">Expand ›</span>`
        : !locked(n) ? dgPill(n) : ''}
      ${foldButton(n, byId)}
      </div>`;
    // a warning sits under the box, as wide as the box and wrapping inside it, clear of a pill on the box's
    // bottom edge: `warn` is what breaks, `why` the comment under it. Only while a question on the box is open:
    // once it is answered the warning stays on the box's card and in its steps, and the map stays clear
    const warn = n.warn && !locked(n) && open.length;
    if (warn) html += `<div class="warn" style="left:${n.x - W(n) / 2}px;top:${n.y + HT(n) / 2 + (n.inside || n.diagram ? 14 : 6)}px;width:${W(n)}px">⚠ ${n.warn}</div>`;
    // the file only for the box you picked; the card has it too
    if (n.file && selected === n.id) html += `<div class="file" style="left:${n.x - W(n) / 2}px;top:${n.y + HT(n) / 2 + (warn ? 24 : 5)}px">${n.file}</div>`;
  }
  // beside where you clicked the line (its middle can sit behind a box), else its middle
  const btnAt = lineAt || lineMid;
  if (pickedLine && btnAt) html += `<button class="edel" data-edge-del="${pickedLine}" style="left:${btnAt[0]}px;top:${btnAt[1] + 20}px" title="Take this line off the map, for everyone (Delete)">Delete line</button>`;
  nodesEl.innerHTML = html;
  renderLevels(); renderTop(); renderInbox(); renderQueue(); renderSide(); renderPrs(); renderCursors(); renderComments(); renderChat(); renderDecs(); renderHist(); renderMem(); fitPane();
}

// the map as one file anyone can read (Markdown): each box with its notes and what was decided on it, the lines, and

function mapFile(){
  const all = S.nodes.flatMap((n) => [n, ...(n.inside?.nodes || []).map((m) => ({ ...m, within: n.label }))]);

/* the rail's Decisions panel: every question answered on this map, newest first: intent made clear, not edits;
   a box's name opens that box on its History tab. One panel shows beside the rail at a time; a box you open takes its place. */
let railTab = null;
// the decision opened in the Decisions panel, by call id: one at a time
const decOpen = new Set();
/* the rail's Memory pane: Instructions (what Claude follows on this map) and Memory (what the team asked it to keep
   in mind), each for the whole map first, then box by box. Only Claude adds them, when asked in a chat; here people
   change their words or remove them */
let memEdit = null; // the item you are editing
const memSeen = () => (S.memory || []).filter((m) => !m.box || (nodeById(m.box) && canSee(nodeById(m.box))));
function renderMem(){
  renderSideChats(); // the rail's other list, drawn on every redraw with this one
  const el = $('mem'), open = railTab === 'memory' && !selected;
  el.classList.toggle('on', open); if (!open) return;
  const all = memSeen();
  const item = (m) => memEdit === m.id
    ? `<form class="mem-f" data-memedit="${m.id}"><input id="mem-in" value="${prose(m.text)}" autocomplete="off"><button class="gb" type="submit">Save</button></form>`
    : `<div class="mem-i"><span class="mem-t">${prose(m.text)}</span><span class="mem-m">${m.by}, ${vtime(m.at)}<span class="ib" data-memedit-open="${m.id}" title="Edit">✎</span><span class="ib" data-forget="${m.id}" title="Remove">✕</span></span></div>`;
  const list = (kind, title, sub) => {
    const its = all.filter((m) => m.kind === kind), groups = [null, ...new Set(its.filter((m) => m.box).map((m) => m.box))];
    const rows = groups.map((b) => { const g = its.filter((m) => (m.box || null) === b); return g.length ? `<div class="mem-g">${b ? prose(nodeById(b).label) : 'Whole map'}</div>${g.map(item).join('')}` : ''; }).join('');
    return `<div class="mem-h"><span>${title}</span></div><div class="mem-sub">${sub}</div>${rows || '<div class="d-wait">None yet.</div>'}`;
  };
  el.innerHTML = `<div class="ct"><span>Memory</span><span class="x" data-close-rail>×</span></div>
    ${list('instruction', 'Instructions', 'Claude follows these in every chat on this map. Ask Claude to make something a rule.')}
    ${list('memory', 'Memory', 'Claude keeps these in mind. They can go out of date. Ask Claude to remember something.')}`;
}
// what a Side Chat reads before each answer, shown as chips in its input box: the whole map and this box; hovering a
// chip says what is in it
const attached = (n) => {
  const rules = (S.memory || []).filter((m) => m.box === n.id);
  const seen = S.nodes.filter(canSee).length, done = S.calls.filter((c) => c.status !== 'open').length;
  const chip = (icon, label, title) => `<span class="att-c" title="${prose(title)}">${icon}${prose(label)}</span>`;
  // the map: three boxes joined by lines; a box: one rounded box with a line of text
  const MAP_I = '<svg viewBox="0 0 16 16"><rect x="1.5" y="6" width="4.5" height="4" rx="1"/><rect x="10" y="2" width="4.5" height="4" rx="1"/><rect x="10" y="10" width="4.5" height="4" rx="1"/><path d="M6 8h2v-4h2M8 8v4h2"/></svg>';
  const BOX_I = '<svg viewBox="0 0 16 16"><rect x="2" y="3.5" width="12" height="9" rx="2"/><path d="M5 7h6M5 9.5h4"/></svg>';
  return `<div class="att-row">${chip(MAP_I, 'Whole map', `The whole map, ${S.title}: ${seen} boxes and their notes, the lines between them, ${done} answered questions, its Instructions and Memory`)}${
    chip(BOX_I, n.label, `This box, ${n.label}: its notes, what Claude found${rules.length ? `, and ${rules.length === 1 ? 'its rule' : 'its rules'}: ${rules.map((m) => m.text).join('; ')}` : ''}`)}</div>`;
};
/* the rail's Side Chats: every box you have a side chat on (threads['@Duy>rivals']), the newest started first, with
   the last thing you asked; a click opens the box on its Side Chat tab, and Back comes here */
function renderSideChats(){

    const id = k.slice(ME.length + 2), n = nodeById(id), t = S.threads[k], asked = t.filter((m) => m.who !== 'Claude');
    if (!n || !canSee(n)) return '';
    return `<button class="sc-r" data-scopen="${id}"><span class="sc-b">${prose(n.label)}<span>${asked.length} asked · ${t.at(-1).at || ''}</span></span><span class="sc-q">${prose(asked.at(-1)?.text || '')}</span></button>`;

// a box's own Instructions and Memory, on its card
const memOf = (id) => ['instruction', 'memory'].map((kind) => {
  const its = (S.memory || []).filter((m) => m.box === id && m.kind === kind);
  return its.length ? `<div class="h">${kind === 'instruction' ? 'Instructions' : 'Memory'}</div><ul class="nt-list">${its.map((m) => `<li>${prose(m.text)}<span class="mem-m">${m.by}</span></li>`).join('')}</ul>` : '';
}).join('');
function renderDecs(){
  const el = $('decs'), open = railTab === 'decisions' && !selected;
  el.classList.toggle('on', open);
  document.querySelectorAll('#rail .ri').forEach((b) => b.classList.toggle('on', b.dataset.rail === railTab && !selected));
  if (!open) return;
  const when = (t) => { const d = new Date(t); return `${d.toDateString() === new Date().toDateString() ? '' : `${d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}, `}${d.toTimeString().slice(0, 5)}`; };
  const logged = (S.log || []).filter((l) => ['confirmed', 'disputed', 'answered'].includes(l.action))
    .map((l) => ({ ...l, c: l.call ? S.calls.find((c) => c.id === l.call) : null })).reverse()
    // one row per question, with the answer it holds now: an answer undone by going back in History, or changed
    // since, stays in the log but not here
    .filter((l) => !l.c || (l.c.status === l.action && (l.action !== 'answered' || l.picked === l.c.picked)))
    .filter((l, i, rows) => !l.c || rows.findIndex((r) => r.c === l.c) === i);
  // an answer the log never held (an older map) still counts, after the logged ones
  const older = S.calls.filter((c) => ['confirmed', 'disputed', 'answered'].includes(c.status) && !logged.some((l) => l.c === c)).reverse().map((c) => ({ action: c.status, who: c.by, c, node: c.node }));
  const all = [...logged, ...older].filter((r) => canSee(nodeById(r.node || r.c?.node) || {}));
  const at = (r) => r.at ? when(r.at) : r.c?.at || '';
  // the answer, read as a reply: who answered first, as @Name, then the answer, then their words if they added any
  const reply = (who, chip, words) => `<div class="dl-ans"><span class="dl-at" style="color:${pcol(who)}">@${who}</span>${chip ? `<span class="dl-v">${chip}</span>` : ''}${words ? `<span class="dl-said">“${prose(words)}”</span>` : ''}<span class="dl-chev">›</span></div>`;
  // opened: why it was asked, and the way into the box, where its History has the choices
  const detail = (c) => `<div class="dl-x">
      ${c.plain || c.context ? `<div class="h">Why Claude asked</div><p>${c.plain || c.context}</p>` : ''}
      ${nodeById(c.node) ? `<button class="gb" data-about-h="${c.node}">Go to ${nodeById(c.node).label} ›</button>` : ''}
    </div>`;
  el.innerHTML = `<div class="ct"><span>Decisions${all.length ? ` · ${all.length}` : ''}</span><span class="x" data-close-rail>×</span></div>
    <div class="dl-sub">Every question answered on this map, newest first. Click one for why it was asked.</div>
    ${all.length ? all.map((r, i) => {
      const id = r.c?.id || `applied-${r.at || i}`, open = decOpen.has(id);
      const c = r.c || { ask: r.text, status: r.action, by: r.who, node: r.node };
      const own = c.pickedId === 'other', said = own ? c.picked : c.said && c.said !== c.picked ? c.said : '';
      return `<div class="dl ${open ? 'open' : ''}" data-dec="${id}">
        <div class="dl-q"><span class="dl-when">${at(r)}</span>${c.ask || c.text || ''}</div>
        ${reply(r.who || c.by, r.c && !own ? ans(c) : r.c ? '' : r.action, said)}
        ${open && r.c ? detail(c) : ''}</div>`;
    }).join('')
      : '<div class="d-wait">Nothing has been decided on this map yet.</div>'}`;
}

    ${elsewhere.map((m) => `<div class="ib-map">${prose(m.title || m.name)}</div>${m.items.map((it) => far(m, it)).join('')}`).join('')}`;

const ago = (t) => { const s = Math.max(0, Math.round((Date.now() - t) / 1000)); if (s < 60) return 'just now'; const m = Math.round(s / 60); if (m < 60) return `${m} minute${m === 1 ? '' : 's'} ago`; const h = Math.round(m / 60); return `${h} hour${h === 1 ? '' : 's'} ago`; };

  if (o){ e.preventDefault(); const i = o.querySelector('input'), text = i.value.trim(); if (text){ act('call', { id: o.dataset.other, other: text }); toast('Sent. The chat hears it now.'); i.value = ''; } return; }
  const f = e.target.closest('form[data-ask]'); if (!f) return;
  e.preventDefault(); const i = f.querySelector('input'); const text = i.value.trim(); if (!text) return;
  act('ask', { node: f.dataset.ask, text, side: true }); i.value = '';
  // "visualize this flow": Claude draws it, so the map opens on it
  const fx = flowOf(nodeById(f.dataset.ask));
  if (fx && /flow|visuali|diagram|draw|sequence/i.test(text)) setTimeout(() => openFlow(fx.id), 700);
});
/* pictures for your Claude chat: + picks them, or paste or drop them in the pane, up to five at a time;
   a click on one in the chat opens it large */
const addPics = (files) => {
  const ok = [...files].filter((f) => /^image\/(png|jpeg|gif|webp)$/.test(f.type) && f.size <= 10e6).slice(0, Math.max(0, 5 - chatPics.length));
  Promise.all(ok.map((f) => new Promise((done) => { const r = new FileReader(); r.onload = () => done(r.result); r.onerror = () => done(null); r.readAsDataURL(f); })))
    .then((urls) => { chatPics = [...chatPics, ...urls.filter(Boolean)]; renderChat(); document.querySelector('#chat form[data-chat] input')?.focus(); });
};
document.addEventListener('change', (e) => { if (e.target.matches?.('#chat [data-pick]')) addPics(e.target.files); });
document.addEventListener('paste', (e) => { const f = [...(e.clipboardData?.files || [])]; if (MIRROR && f.length && e.target.closest?.('#chat')){ e.preventDefault(); addPics(f); } });
$('chat').addEventListener('dragover', (e) => { if (MIRROR && e.dataTransfer?.types.includes('Files')){ e.preventDefault(); $('chat').classList.add('drop'); } });
$('chat').addEventListener('dragleave', (e) => { if (!$('chat').contains(e.relatedTarget)) $('chat').classList.remove('drop'); });
$('chat').addEventListener('drop', (e) => { $('chat').classList.remove('drop'); if (MIRROR && e.dataTransfer?.files.length){ e.preventDefault(); addPics(e.dataTransfer.files); } });
document.addEventListener('click', (e) => {
  if (e.target.closest('#chat [data-attach]')) return $('chat').querySelector('[data-pick]')?.click();
  const u = e.target.closest('#chat [data-unpic]'); if (u){ chatPics.splice(Number(u.dataset.unpic), 1); return renderChat(); }
  const img = e.target.closest('#chat .ua img'); if (img){ $('lightbox').innerHTML = `<img src="${img.src}" alt="">`; return $('lightbox').classList.add('on'); }
  if (e.target.closest('#lightbox')) $('lightbox').classList.remove('on');
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('lightbox').classList.remove('on'); });
const when = (t) => { const d = new Date(t), today = new Date().toDateString() === d.toDateString(); return today ? d.toTimeString().slice(0, 5) : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); };

/* History: every change saves itself, and each one is a version (the server's api/history, newest first).
   A version shows the map as it was, over the live one, until Back to now; Restore makes it the map again. */
const fetchHist = () => { const n = ++histAsk; fetch('api/history').then((r) => r.json()).then((h) => { if (n === histAsk){ HIST = h; renderHist(); } }).catch(() => {}); };
const vtime = (t) => { const d = new Date(t), today = d.toDateString() === new Date().toDateString(); return `${today ? 'Today' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}, ${d.toTimeString().slice(0, 5)}`; };
function renderHist(){
  const el = $('hist'), open = railTab === 'history' && !selected;
  el.classList.toggle('on', open);
  // closing History while an earlier version shows goes back to now
  if (!open){ if (PREVIEW) setTimeout(backToNow); return; }
  if (!HIST.length) fetchHist();
  const cur = PREVIEW?.id || HIST[0]?.id;
  el.innerHTML = `<div class="ct"><span>History</span><span class="x" data-close-rail>×</span></div>
    ${HIST.map((v, i) => `<button class="hv ${v.id === cur ? 'on' : ''}" data-hver="${v.id}"><span class="hv-t">${i === 0 ? 'Now' : vtime(v.at)}</span><span class="hv-w">${esc(v.what)}</span></button>`).join('')
      || '<div class="d-wait">No changes yet.</div>'}`;
}
function renderHistBar(){
  const el = $('histbar'); el.classList.toggle('on', !!PREVIEW); document.body.classList.toggle('previewing', !!PREVIEW);
  el.innerHTML = PREVIEW ? `<span class="hb-w">${vtime(PREVIEW.at)} · ${esc(PREVIEW.what)}</span><button class="go" data-hrestore>Restore this version</button><button data-hnow>Back to now</button>` : '';
}
function showVersion(id){
  const v = HIST.find((h) => h.id === id); if (!v) return;
  fetch(`api/history/${id}`).then((r) => r.json()).then((content) => {
    PREVIEW = { ...v, content }; S = { ...LIVE, ...content }; selected = null; renderHistBar(); render();
  }).catch(() => toast('That version could not be opened.'));
}
function backToNow(){ if (!PREVIEW) return; PREVIEW = null; S = LIVE; renderHistBar(); render(); }

let toastT; function toast(t){ $('toast').textContent = t; $('toast').classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => $('toast').classList.remove('on'), 2600); }

/* follow the server */
function listen(){
  const es = new EventSource('api/events');
  let first = true;
  es.addEventListener('state', (m) => {
    const next = JSON.parse(m.data);
    if (drag){ const d = drag.proposed ? proposedBox(drag.n.id, next) : next.nodes.flatMap((n) => [n, ...(n.inside?.nodes || [])]).find((n) => n.id === drag.n.id); if (d){ d.x = drag.n.x; d.y = drag.n.y; drag.n = d; } }
    // a box or flow you are inside that no longer exists sends you back to the system
    const here = view.replace(/^(flow|diagram):/, ''), dg = view.startsWith('diagram:');
    if (view !== 'system' && !next.nodes.flatMap((n) => [n, ...(n.inside?.nodes || [])]).some((n) => n.id === here && (!view.startsWith('flow:') || n.flow))
      && !(dg && proposedBox(here, next)?.diagram)) view = 'system';
    // the comment you just posted opens as a thread
    if (pendingOpen && next.comments?.length){ const mine = next.comments.filter((c) => c.msgs[0].who === ME).at(-1); if (mine) openThread = mine.id; pendingOpen = false; }
    // typing a reply, or the next question to Claude while it is still answering, survives the redraw
    const ae = document.activeElement;
    const typing = ae?.closest?.('#thread, #cpanel, #side, #chat, #mem') ? { sel: ae.id || (ae.closest('#thread') ? '#thread input' : ae.closest('#side') ? '#side form[data-ask] input' : ae.closest('#chat') ? '#chat form[data-chat] input' : null), val: ae.value } : null;
    // an earlier version on show stays on show: the live map waits underneath until Back to now
    LIVE = next; S = PREVIEW ? { ...next, ...PREVIEW.content } : next; render();
    if (railTab === 'history') fetchHist();
    if (typing?.sel){ const el = typing.sel.includes(' ') ? document.querySelector(typing.sel) : $(typing.sel); if (el){ el.value = typing.val; el.focus(); } }
    if (first){ first = false; fit(); }
  });
  es.addEventListener('cursors', (m) => { cursors = JSON.parse(m.data); renderCursors(); });
  // your Claude Code chat, synced into the Claude pane; typing in the pane survives the redraw
  es.addEventListener('mirror', (m) => {
    const v = JSON.parse(m.data); MIRROR = v.owner === ME ? v : null;
    const ae = document.activeElement, typing = ae?.closest?.('#chat') ? ae.value : null;
    renderChat();
    if (typing !== null){ const el = document.querySelector('#chat form[data-chat] input'); if (el){ el.value = typing; el.focus(); } }
  });
  es.addEventListener('here', (m) => { hereNow = JSON.parse(m.data); if (S) renderTop(); });
  es.onerror = () => { es.close(); setTimeout(listen, 1500); };
}
window.addEventListener('resize', fit);
listen();
fetchInbox(); setInterval(fetchInbox, 8000);
</script>
