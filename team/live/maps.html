<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Living Map · maps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{ --plex:"IBM Plex Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  --canvas:#fbfaf7; --text:#141413; --text-2:#6c6a64; --rule:rgba(0,0,0,.10); --rule-2:rgba(0,0,0,.16); --claude:#C96442; }
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--canvas);color:var(--text);font:14px/1.5 var(--plex)}
#top{height:44px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--rule);font-weight:500}
.home{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,32%);min-height:calc(100vh - 44px)}
#account{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px}
#account[hidden]{display:none}
#account-avatar{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;color:#fff;background:var(--profile);font-weight:600}
:root{--profile:#0E7490}
main{width:100%;max-width:640px;margin:48px auto;padding:0 16px}
h1{font-size:18px;font-weight:500;margin-bottom:16px}
a.map{display:flex;align-items:baseline;gap:12px;padding:14px 16px;margin-bottom:10px;background:#fff;border:1px solid var(--rule-2);border-radius:10px;color:inherit;text-decoration:none}
a.map:hover{border-color:var(--text)}
.t{font-weight:500}
.map-name{display:flex;align-items:center;flex-wrap:wrap;gap:7px;min-width:0}
.map-name .t{overflow-wrap:anywhere}
.map-status{display:inline-flex;align-items:center;gap:8px;flex:none}
.map-shared{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;flex:none;border:1px solid var(--rule-2);border-radius:50%;color:var(--text-2)}
.map-cloud{display:inline-flex;align-items:center;gap:4px;flex:none;font-size:11px;font-weight:400;color:var(--text-2);white-space:nowrap}
.map-shared svg,.map-cloud svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:600px){a.map{flex-wrap:wrap;gap:5px 10px}.map-name{flex-basis:100%}.addr{overflow-wrap:anywhere}.n{white-space:normal}}
.addr{color:var(--text-2);font-size:12.5px}
.n{margin-left:auto;color:var(--text-2);font-size:12.5px;white-space:nowrap}
.n b{color:var(--claude);font-weight:500}
.none{color:var(--text-2)}
/* a new map from a prompt, in a box like Claude's: Claude Code starts it on a blank canvas */
#new{display:flex;align-items:flex-end;gap:8px;margin-bottom:28px;padding:12px 10px 10px 14px;background:#fff;border:1px solid var(--rule-2);border-radius:18px;box-shadow:0 1px 6px rgba(0,0,0,.04)}
#new:focus-within{border-color:rgba(0,0,0,.3)}
#new textarea{flex:1;min-height:44px;max-height:200px;border:0;outline:none;resize:none;background:none;font:14px/1.5 var(--plex);color:var(--text)}
#new button{flex:none;width:32px;height:32px;border:0;border-radius:9px;background:var(--claude);color:#fff;display:grid;place-items:center;cursor:pointer}
#new button:disabled{opacity:.5;cursor:default}
#new svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#err{margin:-18px 0 22px;color:#B42318;font-size:12.5px}
/* a map someone shared as a file comes back here exactly, as a map of its own */
.load{display:flex;align-items:center;gap:12px;margin:-12px 0 28px;color:var(--text-2);font-size:13px}
.load label{border:1px solid var(--rule-2);background:#fff;border-radius:7px;padding:5px 12px;font-size:13px;color:var(--text);cursor:pointer}
.load label:hover{border-color:var(--text)}
#lerr{margin:-18px 0 22px;color:#B42318;font-size:12.5px}
/* the list sorts by time (last changed first) or by name; this browser remembers the choice */
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.head h1{margin:0}
.sort{display:inline-flex;gap:2px;padding:2px;background:#fff;border:1px solid var(--rule-2);border-radius:8px}
.sort button{border:0;background:none;padding:3px 10px;border-radius:6px;font:12.5px var(--plex);color:var(--text-2);cursor:pointer}
.sort button:hover{color:var(--text)}
.sort button.on{background:#f0eee8;color:var(--text);font-weight:500}
/* Trash keeps maps recoverable, with the same neutral action on every owned map. */
.row{position:relative;margin-bottom:10px}
.row a.map{margin-bottom:0;align-items:center}
.row.can a.map{padding-right:48px}
.del{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:28px;height:28px;border:0;border-radius:7px;background:none;color:var(--text-2);font-size:14px;cursor:pointer}
.del:hover{background:#f0eee8;color:var(--text)}
.del svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#brain{padding:28px 24px;background:#fff;border-left:1px solid var(--rule);overflow-wrap:anywhere}
#brain .ct{font-weight:600;font-size:18px;margin-bottom:18px}
#brain .gb{border:1px solid var(--rule-2);border-radius:7px;background:#fff;padding:5px 12px;cursor:pointer}
:root{--new:#2F6FE4;--text-3:#8e8b84}
@media(max-width:860px){.home{display:block}#brain{border-left:0;border-top:1px solid var(--rule)}}
#brain .brain-map{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;padding:14px 10px;text-align:left;border:0;border-bottom:1px solid var(--rule);background:none;color:var(--text);cursor:pointer;border-radius:8px}
#brain .brain-map:hover{background:var(--canvas)}
#brain .brain-map strong{font-size:14px;display:block}
#brain small{display:block;color:var(--text-2);font-size:12px;margin-top:4px}
#brain .brain-back{border:0;background:none;color:var(--new);padding:2px 0 14px;cursor:pointer}
#brain h2{font-size:19px;margin:2px 0 12px;overflow-wrap:anywhere}
#brain .brain-title{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:12px}
#brain .brain-title h2{min-width:0;margin:2px 0 0}
#brain .brain-open{flex-shrink:0;color:var(--new);text-decoration:none;font-size:13px}
#brain .brain-json-row{position:relative;border-top:1px solid var(--rule);padding:10px 0}
#brain .brain-json-row details{border:0;padding:0}
#brain .brain-json-row > button{position:absolute;right:0;top:10px;font-size:12px}
#brain summary{padding-right:120px;min-height:30px;line-height:30px;cursor:pointer;font-size:14px;font-weight:600}
#brain pre{max-height:45vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;user-select:text;margin:8px 0 0;padding:10px;border:1px solid var(--rule);border-radius:8px;background:var(--canvas);font:12px/1.5 ui-monospace,monospace}
#brain .brain-empty{font-size:13px;color:var(--text-3);margin:8px 0 16px}
[hidden]{display:none!important}
.trash-button{font:13px var(--plex);padding:6px 12px;background:#fff;color:var(--text);border:1px solid var(--rule-2);border-radius:7px;cursor:pointer}
.trash-button:disabled,.del:disabled{opacity:.5;cursor:wait}
#trash-open{margin-top:6px;background:none}
#trash-panel>p{color:var(--text-2);font-size:13px;margin:10px 0 18px}
.trash-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;margin:10px 0;background:#fff;border:1px solid var(--rule-2);border-radius:10px}
.trash-row strong{font-weight:500}.trash-row small{display:block;color:var(--text-2);font-size:12px;margin-top:3px}
#trash-status{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);padding:12px 16px;background:#fff;border:1px solid var(--rule-2);border-radius:10px;box-shadow:0 5px 20px var(--rule);z-index:10}
.trash-dismiss{border:0;background:none;font-size:20px;color:var(--text-2);cursor:pointer}
</style>
</head>
<body>
<div id="top"><span>Living Map</span><div id="account" hidden><span id="account-avatar" aria-hidden="true"></span><span id="account-name"></span></div></div>
<div class="home">
<main>
  <h1>Start a new map</h1>
  <form id="new"><textarea rows="2" placeholder="What should Claude map?" aria-label="What should Claude map?"></textarea>
    <button type="submit" title="Start the map" aria-label="Start the map"><svg viewBox="0 0 20 20"><path d="M10 16V4M5 9l5-5 5 5"/></svg></button></form>
  <div id="err" hidden></div>
  <div class="load"><span>Have a map someone sent you as a file?</span><label><input type="file" accept=".html,text/html" hidden>Load a map file</label></div>
  <div id="lerr" hidden></div>
  <div class="head"><h1>Or pick a map you have</h1>
    <div class="sort" role="group" aria-label="Sort maps"><button type="button" data-sort="time" title="Last changed first">Time</button><button type="button" data-sort="name" title="A to Z">Name</button></div></div>
  <div id="list" class="none">Loading…</div>
  <button id="trash-open" type="button" class="trash-button">Trash</button>
  <section id="trash-panel" hidden aria-label="Trash"><div class="head"><h1>Trash</h1><button id="trash-back" type="button" class="trash-button">Back to maps</button></div><p>Restore a map to put it back in your list. Code files and online copies are kept.</p><div id="trash-list"></div></section>
  <div id="trash-status" role="status" hidden></div>
</main>
<aside id="brain" aria-label="All brain"></aside>
</div>
<script>
// every map this server holds; a click opens it, with ?as= carried along
const $ = (id) => document.getElementById(id);
const SIGNED_IN = document.querySelector('meta[name="lm-user"]')?.content || '';
const ME = SIGNED_IN || new URLSearchParams(location.search).get('as') || 'Duy';
if (SIGNED_IN){
  $('account').hidden = false;
  $('account').title = `Signed in as ${SIGNED_IN}`;
  $('account').setAttribute('aria-label', `Signed in as ${SIGNED_IN}`);
  $('account-name').textContent = SIGNED_IN;
  $('account-avatar').textContent = Array.from(SIGNED_IN.trim())[0]?.toUpperCase() || '';
  const color = {Harshit:'#1E7A5A', Priyanka:'#7C3AED', Duy:'#0E7490', You:'#1E7A5A', Sam:'#B45309'}[SIGNED_IN];
  if (color) $('account').style.setProperty('--profile', color);
}
const ago = (t) => { if (!t) return 'not opened yet'; const m = Math.round((Date.now() - t) / 60000);
  return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
// a new map: Claude Code starts drawing it on a blank canvas, and the map opens with its chat beside it
const form = document.getElementById('new'), box = form.querySelector('textarea'), go = form.querySelector('button'), err = document.getElementById('err');
box.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); form.requestSubmit(); } });
form.addEventListener('submit', (e) => {
  e.preventDefault(); const prompt = box.value.trim(); if (!prompt || go.disabled) return;
  go.disabled = true; err.hidden = true;
  fetch('/api/newmap', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ prompt }) })
    .then((r) => r.json().then((d) => ({ ok: r.ok, d })))
    .then(({ ok, d }) => { if (!ok) throw new Error(d.error || 'The map could not start.'); location.href = `${d.href}?chat=1`; })
    .catch((x) => { err.textContent = x.message; err.hidden = false; go.disabled = false; });
});
// a map file (Share as a file) carries the map's data inside its page: that data becomes a map here, and it opens
const pick = document.querySelector('.load input'), lerr = document.getElementById('lerr');
pick.addEventListener('change', () => {
  const f = pick.files[0]; if (!f) return; lerr.hidden = true;
  f.text().then((t) => {
    const data = t.match(/<script id="lm-data" type="application\/json">([^]*?)<\/script>/)?.[1];
    if (!data) throw new Error('Not a map file. Share as a file on a map makes one.');
    return fetch('/api/maps/load', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ data }) })
      .then((r) => r.json().then((d) => ({ ok: r.ok, d })))
      .then(({ ok, d }) => { if (!ok) throw new Error(d.error || 'The map could not be loaded.'); location.href = d.href; });
  }).catch((x) => { lerr.textContent = x.message; lerr.hidden = false; pick.value = ''; });
});
// opened by a saved file's Load into Living Map (/?load): this page tells that file it is ready, takes the map's
// data it sends, and makes it a map here the same way (the server checks the data; a message from anywhere else
// carries none)
if (new URLSearchParams(location.search).has('load') && window.opener){
  window.addEventListener('message', (e) => {
    const data = e.data?.lmLoad; if (typeof data !== 'string') return;
    fetch('/api/maps/load', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ data }) })
      .then((r) => r.json().then((d) => ({ ok: r.ok, d })))
      .then(({ ok, d }) => { if (!ok) throw new Error(d.error || 'The map could not be loaded.'); location.href = d.href; })
      .catch((x) => { lerr.textContent = x.message; lerr.hidden = false; });
  });
  window.opener.postMessage('lm-ready', '*');
}
let trashItems = [], trashOpen = false;
const trashIcon = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M7 5V3h6v2M5 5l1 12h8l1-12M8 8v6M12 8v6"/></svg>';
function trashNotice(message, id = ''){
  $('trash-status').hidden = false;
  $('trash-status').innerHTML = `<span>${esc(message)}</span>${id ? `<button type="button" class="trash-button" data-restore="${esc(id)}">Undo</button>` : ''}<button type="button" class="trash-dismiss" aria-label="Dismiss message">×</button>`;
}
async function trashRequest(route, data){
  let response;
  try { response = await fetch(route, data ? {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)} : undefined); }
  catch { throw new Error('Could not reach Living Map. Try again when it reconnects.'); }
  const result = await response.json();
  if (!response.ok) throw new Error(result.error || 'That change could not be saved. Try again.');
  return result;
}
async function refreshMapList(){ maps = await trashRequest('/api/maps'); list(); loadBrain(); }
async function moveToTrash(name, button){
  const title = titleOf(maps.find((m) => m.name === name) || {name}); button.disabled = true;
  try {
    const result = await trashRequest('/api/maps/trash', {name});
    maps = maps.filter((m) => m.name !== name); list(); loadBrain();
    trashNotice(`Moved “${title}” to Trash.`, result.trashId);
  } catch (e){
    // A restart can interrupt the reply after the move has succeeded.
    try {
      await refreshMapList();
      if (!maps.some((m) => m.name === name)) {
        const items = await trashRequest('/api/maps/trash'), item = items.find((m) => m.name === name);
        if (item) { trashNotice(`Moved “${title}” to Trash.`, item.id); return; }
      }
    } catch {}
    button.disabled = false; trashNotice(e.message);
  }
}
function renderTrash(){
  $('trash-list').innerHTML = trashItems.length ? trashItems.map((m) => `<div class="trash-row"><span><strong>${esc(m.title)}</strong><small>Moved to Trash ${ago(m.at)}</small></span><button type="button" class="trash-button" data-restore="${esc(m.id)}">Restore</button></div>`).join('') : '<p class="none">Trash is empty.</p>';
}
async function showTrash(){
  trashOpen = true; document.querySelector('main .head').hidden = true; $('list').hidden = true; $('trash-open').hidden = true; $('trash-panel').hidden = false;
  $('trash-back').focus(); $('trash-list').textContent = 'Loading…';
  try { trashItems = await trashRequest('/api/maps/trash'); renderTrash(); }
  catch (e){ $('trash-list').innerHTML = `<p role="alert">${esc(e.message)}</p><button type="button" class="trash-button" data-trash-retry>Try again</button>`; }
}
async function restoreFromTrash(id, button){
  button.disabled = true;
  try {
    const result = await trashRequest('/api/maps/restore', {id});
    trashItems = trashItems.filter((m) => m.id !== id); if (trashOpen) renderTrash();
    await refreshMapList(); trashNotice(`Restored “${result.title}”.`);
  } catch (e){button.disabled = false; trashNotice(e.message);}
}
$('trash-open').addEventListener('click', showTrash);
$('trash-back').addEventListener('click', () => {
  trashOpen = false; $('trash-panel').hidden = true; document.querySelector('main .head').hidden = false; $('list').hidden = false; $('trash-open').hidden = false; $('trash-open').focus();
});
document.addEventListener('click', (e) => {
  const restore = e.target.closest('[data-restore]');
  if (restore) restoreFromTrash(restore.dataset.restore, restore);
  else if (e.target.closest('[data-trash-retry]')) showTrash();
  else if (e.target.closest('.trash-dismiss')) $('trash-status').hidden = true;
});

let maps = null, sortBy = 'time';
try { if (localStorage.getItem('lm.sort') === 'name') sortBy = 'name'; } catch {}
const titleOf = (m) => m.title || m.name;
function mapIndicators(m){
  if (!m.shared && !m.cloud) return '';
  return `<span class="map-status">${m.shared ? '<span class="map-shared" role="img" aria-label="Shared by link" title="Shared by link"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 4v2"/></svg></span>' : ''}${m.cloud ? '<span class="map-cloud" role="img" aria-label="Online copy stored in the cloud" title="Online copy stored in the cloud"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a5 5 0 1 1 0-10 6 6 0 0 1 11.5 1.5A4.3 4.3 0 0 1 18 18Z"/></svg></span>' : ''}</span>`;
}
function list(){
  const el = document.getElementById('list');
  document.querySelectorAll('.sort button').forEach((b) => b.classList.toggle('on', b.dataset.sort === sortBy));
  if (!maps) return;
  if (!maps.length) { el.textContent = 'No maps yet.'; return; }
  el.className = '';
  const sorted = [...maps].sort(sortBy === 'name' ? (a, b) => titleOf(a).localeCompare(titleOf(b), undefined, { sensitivity: 'base', numeric: true }) || a.name.localeCompare(b.name)
    : (a, b) => (b.at || 0) - (a.at || 0) || titleOf(a).localeCompare(titleOf(b)));
  el.innerHTML = sorted.map((m) => `<div class="row${m.deletable ? ' can' : ''}"><a class="map" href="${m.href}${location.search}"><span class="map-name"><span class="t">${esc(titleOf(m))}</span></span><span class="addr">${m.href}</span><span class="n">${m.boxes} boxes${m.open ? ` · <b>${m.open} to answer</b>` : ''} · ${ago(m.at)}</span>${mapIndicators(m)}</a>${m.deletable ? `<button type="button" class="del" data-trash="${esc(m.name)}" title="Move to Trash" aria-label="Move ${esc(titleOf(m))} to Trash">${trashIcon}</button>` : ''}</div>`).join('');
}
$('list').addEventListener('click', (e) => { const button = e.target.closest('[data-trash]'); if (button) moveToTrash(button.dataset.trash, button); });
document.querySelector('.sort').addEventListener('click', (e) => {
  const b = e.target.closest('[data-sort]'); if (!b) return;
  sortBy = b.dataset.sort; try { localStorage.setItem('lm.sort', sortBy); } catch {}
  list();
});
function brainObjects(state, who){
  const sees = state.people?.find((p) => p.id === who)?.sees;
  const limited = sees && sees !== 'all', ids = new Set();
  const collect = (items) => (items || []).filter((n) => !limited || n.area === sees).map((n) => {
    ids.add(n.id);
    return n.inside ? {...n, inside:{...n.inside, nodes:collect(n.inside.nodes)}} : n;
  });
  const nodes = collect(state.nodes);
  const visibleEdges = (edges) => (edges || []).filter((e) => ids.has(e.from) && ids.has(e.to));
  const trimEdges = (nodes) => nodes.map((n) => n.inside ? {...n,inside:{...n.inside,nodes:trimEdges(n.inside.nodes),edges:visibleEdges(n.inside.edges)}} : n);
  const calls = (state.calls || []).filter((c) => !limited || ids.has(c.node));
  const log = (state.log || []).filter((l) => ['answered','confirmed','disputed'].includes(l.action) && (!limited || (l.node && ids.has(l.node))));
  const memory = (state.memory || []).filter((m) => !limited || !m.box || ids.has(m.box));
  // Match the map's JSON view without exposing its share-link credential.
  const map = limited ? {title:state.title, start:ids.has(state.start) ? state.start : null, nodes:trimEdges(nodes), edges:visibleEdges(state.edges), calls, memory}
    : {...state, ...(state.linkSharing ? {linkSharing:{mode:state.linkSharing.mode}} : {})};
  return {map, decisions:{calls, log}, memory};
}
let brainMaps = [], brainMap = null, brainState = null, brainLoading = false, brainError = '', brainRequest = 0;
async function loadBrain(map = null){
  const request = ++brainRequest;
  brainMap = map; brainState = null; brainError = ''; brainLoading = true; renderBrain();
  try {
    const r = await fetch(map ? `${map.href}api/state` : '/api/maps');
    if (!r.ok) throw new Error('This map is unavailable or your access has changed.');
    const data = await r.json();
    if (request !== brainRequest) return;
    if (map) brainState = data;
    else {
      brainMaps = data;

    }
  } catch (e){ if (request === brainRequest) brainError = e.message || 'Could not load your maps.'; }
  finally { if (request === brainRequest){ brainLoading = false; renderBrain(); } }
}
function renderBrain(){
  const el = $('brain');
  const heading = '<div class="ct"><span>All brain</span></div>';
  const back = brainMap ? '<button class="brain-back" data-brain-back>‹ All maps</button>' : '';
  if (brainLoading){ el.innerHTML = heading + back + '<p class="brain-empty" role="status">Loading…</p>'; return; }
  if (brainError){ el.innerHTML = heading + back + `<p role="alert">${esc(brainError)}</p><button class="gb" data-brain-retry>Try again</button>`; return; }
  if (!brainMap){
    el.innerHTML = heading + brainMaps.map((m,i) => `<button class="brain-map" data-brain-map="${i}"><span><strong>${esc(m.title || m.name || 'Untitled map')}</strong><small>${m.boxes || 0} boxes</small></span><span aria-hidden="true">›</span></button>`).join(''); return;
  }
  const state = brainState;
  if (!state) return;
  const objects = brainObjects(state, ME);
  const opened = new Set([...el.querySelectorAll('details[open]')].map((d) => d.dataset.brainObject));
  const row = (key,title) => `<div class="brain-json-row"><details data-brain-object="${key}"${opened.has(key) ? ' open' : ''}><summary>${title}</summary><pre tabindex="0">${esc(JSON.stringify(objects[key], null, 2))}</pre></details><button class="gb" data-brain-download="${key}" aria-label="Download ${title} JSON">Download JSON</button></div>`;
  el.innerHTML = heading + back + `<div class="brain-title"><h2>${esc(state.title || brainMap.title)}</h2><a class="brain-open" href="${esc(brainMap.href)}">Open map ↗</a></div>` +
    row('map', 'Map object') + row('decisions', 'Decision object') + row('memory', 'Memory object');
}
$('brain').addEventListener('click', (e) => {
  const download = e.target.closest('[data-brain-download]');
  if (download && brainState){
    const key = download.dataset.brainDownload;
    const data = brainObjects(brainState, ME)[key];
    if (data === undefined) return;
    const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], {type:'application/json'}));
    const a = document.createElement('a'); a.href = url;
    a.download = `${(brainMap.name || 'map').replace(/[^a-z0-9-]/gi, '-')}-${key}.json`;
    a.click(); setTimeout(() => URL.revokeObjectURL(url), 60000); return;
  }
  const button = e.target.closest('[data-brain-map]');
  if (button) loadBrain(brainMaps[Number(button.dataset.brainMap)]);
  else if (e.target.closest('[data-brain-back]')) loadBrain();
  else if (e.target.closest('[data-brain-retry]')) loadBrain(brainMap);
});
loadBrain();
list();
fetch('api/maps').then((r) => r.json()).then((m) => { maps = m; list(); });
</script>
</body>
</html>
