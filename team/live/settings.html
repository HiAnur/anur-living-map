<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Living Map · Settings</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231f1b14'/%3E%3Crect x='19' y='19' width='26' height='26' rx='4' fill='%23f8f6f1' transform='rotate(45 32 32)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{ --plex:"IBM Plex Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  --canvas:#fbfaf7; --text:#141413; --text-2:#6c6a64; --rule:rgba(0,0,0,.10); --rule-2:rgba(0,0,0,.16); --profile:#141413; }
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--canvas);color:var(--text);font:14px/1.5 var(--plex)}
#top{height:44px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--rule);font-weight:500}
#top .brand{display:inline-flex;align-items:center;gap:8px;font-weight:500;color:var(--text);text-decoration:none}
#top .brand i{width:22px;height:22px;border-radius:6px;background:#1f1b14;display:grid;place-items:center}
#top .brand i::before{content:'';width:9px;height:9px;border-radius:2px;background:#f8f6f1;transform:rotate(45deg)}
#top .brand > span{color:var(--text-2);font-weight:400}
main{width:100%;max-width:520px;margin:40px auto;padding:0 16px}
#back{border:0;background:none;padding:0;margin-bottom:14px;font:13px var(--plex);color:var(--text-2);cursor:pointer}
#back:hover{color:var(--text)}
h1{font-size:18px;font-weight:500;margin-bottom:16px}
.card{background:#fff;border:1px solid var(--rule-2);border-radius:12px}
.who{display:flex;align-items:center;gap:14px;padding:20px}
.face{position:relative;display:grid;place-items:center;flex:none;width:48px;height:48px;border-radius:50%;color:#fff;background:var(--profile);font-weight:600;font-size:18px}
/* your Google picture covers your initial, which stays underneath for a picture that will not load */
.face img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover}
.who b{display:block;font-size:16px;font-weight:500;overflow-wrap:anywhere}
#role{color:var(--text-2);font-size:13px}
/* one fact a line: what it is on the left, the fact in the middle, the one thing you can do about it on the right */
.line{display:flex;align-items:baseline;gap:12px;padding:14px 20px;border-top:1px solid var(--rule)}
.line dt{flex:none;width:84px;color:var(--text-2);font-size:13px}
.line dd{flex:1;min-width:0;overflow-wrap:anywhere}
.line dd small{display:block;color:var(--text-2);font-size:12.5px}
.line a,.line button{flex:none;display:inline-flex;align-items:center;gap:8px;font:13px var(--plex);padding:5px 12px;border:1px solid var(--rule-2);border-radius:7px;background:#fff;color:var(--text);text-decoration:none;cursor:pointer}
.line a:hover,.line button:hover{border-color:var(--text)}
/* changing your name: the field takes the fact's place, with Save and Cancel beside it */
#name-form{display:flex;gap:8px;flex:1;min-width:0}
#name-form input{flex:1;min-width:0;height:32px;border:1px solid var(--rule-2);border-radius:7px;padding:0 10px;font:inherit;color:inherit;background:#fff}
#err,#name-err{color:#B42318;font-size:13px}
#err{margin-bottom:12px}
#name-err{padding:0 20px 12px}
[hidden]{display:none!important}
@media(max-width:480px){.line{flex-wrap:wrap}.line dt{width:100%}}
</style>
</head>
<body>
<div id="top"><a class="brand" href="/"><i aria-hidden="true"></i>Anur <span>Living Map</span></a></div>
<main>
  <button id="back" type="button">‹ Back</button>
  <h1>Settings</h1>
  <div id="err" role="alert" hidden></div>
  <div class="card" id="card" hidden>
    <div class="who"><span class="face" id="face" aria-hidden="true"></span><div><b id="name"></b><span id="role"></span></div></div>
    <dl>
      <div class="line"><dt>Name</dt>
        <dd id="name-show"><span id="name-now"></span><small>The name your maps show for you on this Mac.</small></dd><button type="button" id="name-edit">Change</button>
        <form id="name-form" hidden><input id="name-in" maxlength="40" autocomplete="name" aria-label="Your name"><button type="submit">Save</button><button type="button" id="name-cancel">Cancel</button></form></div>
      <div id="name-err" role="alert" hidden></div>
      <div class="line"><dt>Google</dt><dd><span id="google"></span><small id="google-note"></small></dd>
        <a id="google-in" href="/auth/google?next=%2Fsettings" hidden><svg width="16" height="16" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>Sign in with Google</a>
        <button type="button" id="google-out" hidden>Sign out of Google</button></div>
    </dl>
  </div>
</main>
<script>
// who you are on this Mac: your name, which you can change, your role, and the Google account you signed in with
const $ = (id) => document.getElementById(id);
// back to where you came from; opened on its own, to the first page
$('back').addEventListener('click', () => { if (history.length > 1) history.back(); else location.href = '/'; });
// a Google sign-in that did not finish comes back here saying why
const failed = new URLSearchParams(location.search).get('error');
if (failed){ $('err').textContent = failed; $('err').hidden = false; history.replaceState(null, '', '/settings'); }
// what the page writes for the answer from /api/me: your role, and what Settings says and offers about Google
function words(me){
  return {
    role: (me.role || '').split(',')[0],
    google: me.googleEmail || (me.google ? 'Not signed in' : 'Not set up on this Mac'),
    note: me.googleEmail ? 'Your email and picture come from this Google account.' : me.google ? 'Optional. Adds your email and picture, and lets you publish a map online.' : '',
    action: me.googleEmail ? 'out' : me.google ? 'in' : '',
  };
}
const post = (route, data) => fetch(route, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(data) })
  .then(async (r) => { const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || 'The map server is not answering.'); return d; });
function show(me){
  const w = words(me);
  $('name').textContent = $('name-now').textContent = me.name; $('role').textContent = w.role;
  $('face').textContent = Array.from(me.name.trim())[0]?.toUpperCase() || '';
  $('face').querySelector('img')?.remove();
  if (me.picture){ const im = new Image(); im.alt = ''; im.referrerPolicy = 'no-referrer'; im.onerror = () => im.remove(); im.src = me.picture; $('face').append(im); }
  const color = { Harshit: '#1E7A5A', Priyanka: '#7C3AED', Duy: '#0E7490', You: '#1E7A5A', Sam: '#B45309' }[me.name];
  $('face').style.setProperty('--profile', color || '#141413');
  $('google').textContent = w.google; $('google-note').textContent = w.note; $('google-note').hidden = !w.note;
  $('google-in').hidden = w.action !== 'in'; $('google-out').hidden = w.action !== 'out';
  $('card').hidden = false;
}
const load = () => fetch('/api/me').then(async (r) => { const d = await r.json(); if (!r.ok) throw new Error(d.error || 'Your settings could not be loaded.'); return d; })
  .then(show).catch((e) => { $('err').textContent = e.message; $('err').hidden = false; });
load();
// changing your name: the field opens with the name you have, Save keeps the new one, Cancel or Esc the old
const editing = (on) => { $('name-show').hidden = $('name-edit').hidden = on; $('name-form').hidden = !on; $('name-err').hidden = true; if (on){ $('name-in').value = $('name-now').textContent; $('name-in').select(); } };
$('name-edit').addEventListener('click', () => editing(true));
$('name-cancel').addEventListener('click', () => editing(false));
$('name-in').addEventListener('keydown', (e) => { if (e.key === 'Escape') editing(false); });
$('name-form').addEventListener('submit', (e) => {
  e.preventDefault();
  post('/api/me', { name: $('name-in').value }).then(() => { editing(false); return load(); })
    .catch((err) => { $('name-err').textContent = err.message; $('name-err').hidden = false; });
});
// signing out of Google forgets its email and picture; you stay on your maps
$('google-out').addEventListener('click', () => { post('/api/google/signout', {}).then(load).catch((e) => { $('err').textContent = e.message; $('err').hidden = false; }); });
</script>
</body>
</html>
